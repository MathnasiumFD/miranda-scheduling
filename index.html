// Applies immediately — no front-desk approval step (Sept 2026, per Allie: "as a parent, they
// should be able to change days and times permanently or one off without front desk permission").
// Before this, submitting here only created a pending enrollment_requests row that front desk had
// to separately open and click Approve on before anything actually changed; now it calls
// applyTimeChange() directly, the exact same function front desk's own approval used to call, so the
// underlying schedule-change mechanics (cancelling upcoming standing sessions, restoring any make-up
// credit tied to one, writing the new student_plan_changes/_recurring rows, regenerating sessions)
// are unchanged — only the "someone has to click Approve first" gate is gone.
function submitTimeChangeRequest(){
  const f=state.timeChangeRequestForm;
  if(!f.effectiveFrom){ f.error='Choose the date this should take effect from.'; render(); return; }
  const effectiveFrom=new Date(f.effectiveFrom);
  // Unlike a hold or cancelling enrolment, a permanent day/time change has no billing-cycle impact,
  // so MONTH_NOTICE_DAYS never applies here (Sept 2026, per Allie: "the 1 week only applies to holds
  // and cancellations, to change days and times no notice required (other than 10am)") — just the
  // same-day cutoff.
  if(!timeChangeDateOk(effectiveFrom)){
    f.error='Same-day schedule changes need to be made before 10:00am — the earliest available date is '+fmtShort(earliestTimeChangeDate())+'.';
    render(); return;
  }
  if(!f.recurring || f.recurring.length===0){ f.error='Add at least one day/time.'; render(); return; }
  const student=findStudent(f.studentId);
  const recurring=f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; });
  // A student's plan only ever holds ONE slot per weekday — generateRecurringSessions() looks up a
  // date's session via plan.recurring.find(r => r.weekday===weekday), so two rows landing on the
  // same weekday would silently collapse to just the first one, quietly dropping a session the
  // parent thinks they still have. Both rows now show their own picker at once (Sept 2026, per
  // Allie: "swap both sessions ... in one dialogue box"), which makes it easy to point two rows at
  // the same day by accident — block that outright rather than letting it through to vanish later.
  const weekdayCounts={};
  recurring.forEach(function(r){ weekdayCounts[r.weekday]=(weekdayCounts[r.weekday]||0)+1; });
  const dupedWeekday=Object.keys(weekdayCounts).find(function(wd){ return weekdayCounts[wd]>1; });
  if(dupedWeekday){
    f.error='You\'ve picked '+dupedWeekday+' for more than one session — choose a different day for one of them.';
    render(); return;
  }
  // Every row a parent actually PICKED came from a dropdown already filtered to open times (see
  // renderTimeChangeRecurringPickers), so this is almost always true by construction for that row —
  // it's only false if a picked time went full in the moments between opening the form and hitting
  // Confirm. That used to be fine to let through anyway, since front desk would double-check before
  // actually writing the change (see the "Ready to approve" flag this used to feed). With that
  // safety net gone now that this applies immediately, re-check right here instead and block on it —
  // each full row already shows its own "Join waitlist" escape hatch above, so this should be rare.
  //
  // Only rows the parent actually CHANGED are checked (Sept 2026, per Allie: "One of your picked
  // times just filled up (Fri 3:15pm) ... when I wasn't changing that day") — every row's picker
  // shows at once now, but a row identical to its currentRecurring counterpart is still just the
  // family keeping a seat they already hold, not a new claim on capacity, so it makes no sense to
  // block the whole submission over its real-world fullness — a family keeping their existing Friday
  // slot should never be told "Friday just filled up" when they never touched Friday. Only genuinely
  // new picks (a row that differs from its original) need re-validating here.
  const stillFull=recurring.filter(function(r, idx){
    const orig=f.currentRecurring && f.currentRecurring[idx];
    if(orig && orig.weekday===r.weekday && orig.start===r.start) return false; // unchanged — already their seat, not a new claim
    return !standingSlotHasAvailability(r.weekday, r.start, student.duration, student.year);
  });
  if(stillFull.length){
    f.error='One of your picked times just filled up ('+stillFull.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ')+') — pick a different time for that row, or use "Join waitlist" instead.';
    render(); return;
  }
  state.timeChangeRequestForm=null;
  applyTimeChange(student, effectiveFrom, recurring, f.note.trim(), true);
}

// Everything a parent should be told is changing about a child's schedule (5.20) — any front-desk-
// scheduled hold, plan change (stop / frequency change), or standing Pod move that hasn't taken
// effect yet. Purely informational on the parent side; they can't edit any of it themselves, only
// front desk can (5.4/5.9c/5.16b). An already-active hold is included too (still worth surfacing),
// but a Pod pin already in effect is not — only ones still ahead count as a "change".
function upcomingChangesForStudent(studentId){
  const out=[];
  const hold=currentOrUpcomingHold(studentId);
  if(hold) out.push({type:'hold', hold:hold});
  const planChange=currentOrUpcomingPlanChange(studentId);
  if(planChange) out.push({type:'plan', planChange:planChange});
  currentOrUpcomingPodAssignments(studentId)
    .filter(function(a){ return toKey(a.effectiveFrom) > toKey(simNow()); })
    .forEach(function(a){ out.push({type:'pod', podAssignment:a}); });
  return out;
}
function describeUpcomingChange(change){
  // effectiveFrom/date fields on these records may be a Date or a plain "YYYY-MM-DD" string
  // depending on how they were created (form saves always store a Date; a couple of these record
  // shapes — like planChanges, still without a dedicated save form — aren't fully pinned down yet).
  // new Date(x) accepts either, so wrap everything here rather than assume one or the other.
  if(change.type==='hold'){
    const h=change.hold;
    const active = toKey(h.start)<=toKey(simNow());
    return active
      ? '⏸️ Currently on hold through '+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+' — sessions resume automatically after.'
      : '⏸️ Scheduled hold '+fmtShort(new Date(h.start))+'–'+fmtShort(new Date(h.end))+(h.note? ' ('+h.note+')' : '')+'.';
  }
  if(change.type==='plan'){
    const pc=change.planChange;
    return pc.stopped
      ? '📋 Scheduled to stop attending from '+fmtShort(new Date(pc.effectiveFrom))+'.'
      : '📋 Schedule changing to '+recurringSummary({recurring:pc.recurring})+' from '+fmtShort(new Date(pc.effectiveFrom))+'.';
  }
  if(change.type==='pod'){
    const a=change.podAssignment;
    return a.podId
      ? '↪️ Moving to '+findPod(a.podId).name+' from '+fmtShort(new Date(a.effectiveFrom))+'.'
      : '↪️ Returning to an auto-assigned Pod from '+fmtShort(new Date(a.effectiveFrom))+'.';
  }
  return '';
}

// A student's pinned standing Pod, if front desk has set one — resolved the same dated-history way
// as an instructor's own availability or a Pod shift's assignment: whichever entry has the latest
// effectiveFrom on or before the date wins. A null podId entry explicitly means "back to
// auto-assign" from that date forward; no entries at all (the normal case) means auto-assign has
// always applied — pickBestPod() picks freely among qualified, available, under-capacity Pods.
//
// A pin can optionally be scoped to a single weekday (a.weekday) — this is how a student who
// genuinely sits in a different Pod on different days (e.g. Pod 6 Monday, Pod 2 Tuesday) is
// represented, without one day's placement fighting the other's. A weekday-scoped pin always wins
// over an every-day pin (a.weekday null/unset) covering the same date, regardless of which was set
// more recently — it's the more specific instruction. Within the same specificity, whichever has
// the latest effectiveFrom on or before this date wins, same as before.
// The single standing pin currently in effect for this student on this date, whatever kind it is
// (a Pod, an Online instructor, or none at all — auto-assign) — shared by studentAssignedPodOn()
// and studentAssignedOnlineInstructorOn() below so both always agree on which entry is "latest",
// rather than risking two separately-written resolution passes drifting apart.
function latestStudentPodAssignment(studentId, date){
  const student=findStudent(studentId);
  const dateKey=toKey(date);
  const weekday=WEEKDAY_KEYS[(new Date(date).getDay()+6)%7];
  const applicable=(student.podAssignments||[]).filter(function(a){
    return toKey(a.effectiveFrom)<=dateKey && (!a.weekday || a.weekday===weekday);
  });
  if(applicable.length===0) return null;
  const daySpecific=applicable.filter(function(a){ return !!a.weekday; });
  const pool = daySpecific.length? daySpecific : applicable;
  pool.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  return pool[pool.length-1];
}
function studentAssignedPodOn(studentId, date){
  const a=latestStudentPodAssignment(studentId, date);
  return a? a.podId : null;
}
// Online counterpart of studentAssignedPodOn() — null unless the currently-effective pin is
// specifically an Online one (5.32, per Allie: "moving forward how do i set them their assigned
// pod" / "i dont see the option to schedule them online" — the standing pin needed to support
// Online, not just physical Pods). Mutually exclusive with studentAssignedPodOn() by construction:
// whichever pin is latest, only one of the two ever comes back non-null for it.
function studentAssignedOnlineInstructorOn(studentId, date){
  const a=latestStudentPodAssignment(studentId, date);
  return a && a.online? a.instructorId : null;
}
function currentOrUpcomingPodAssignments(studentId){
  const student=findStudent(studentId);
  return (student.podAssignments||[]).slice().sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
}

/* ---------- standing Pod pin (moving forward) ---------- */
function openStudentPodForm(studentId){
  // `location` uses the same encoded convention as every other Pod/Online picker in the app (see
  // sessionLocationValue): '' = auto-assign, a Pod's own id = that Pod, 'online:<instructorId>' =
  // that instructor's Online group.
  state.studentPodForm={studentId, location:'', effectiveFrom:toKey(simNow()), weekday:'', error:''};

function closeStudentPodForm(){ state.studentPodForm=null; render(); }
function setStudentPodField(field, value){
  state.studentPodForm[field]=value;
  state.studentPodForm.error='';
  render();
}
function saveStudentPodAssignment(){
  const f=state.studentPodForm;
  if(!f.effectiveFrom){ f.error='Choose an effective date.'; render(); return; }
  const weekday=f.weekday||null; // '' (or unset) means "every day"
  const student=findStudent(f.studentId);
  const isOnline=String(f.location).indexOf('online:')===0;
  const podId=isOnline? null : (f.location||null);
  const instructorId=isOnline? f.location.slice(7) : null;
  // Identity for "replacing" a prior pin is now (effectiveFrom, weekday) together, not just
  // effectiveFrom alone — a Monday pin and a Tuesday pin sharing the same effective date are two
  // separate, coexisting entries, not a conflict.
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===f.effectiveFrom && (a.weekday||null)===weekday);
  });
  student.podAssignments.push({podId:podId, online:isOnline, instructorId:instructorId, effectiveFrom:new Date(f.effectiveFrom), weekday:weekday});
  dbWrite('pinning standing Pod', function(){
    let q=supabaseClient.from('student_pod_assignments').delete().eq('student_id', student.id).eq('effective_from', f.effectiveFrom);
    q = weekday? q.eq('weekday', weekday) : q.is('weekday', null);
    return q.then(function(){
      return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:podId, online:isOnline, instructor_id:instructorId, effective_from:f.effectiveFrom, weekday:weekday});
    });
  });

  // Cancel already-generated future standing occurrences from the effective date forward, so the
  // new pin actually takes hold for every upcoming standing session — not just ones not yet
  // generated — restoring any linked make-up credit first, same as any other cancellation (5.11).
  // One-off/staff-placed sessions are left alone; only the auto-generated standing ones regenerate.
  // A weekday-scoped pin only touches sessions on that one weekday — every other day this student
  // attends is left completely alone, which is the whole point of scoping it.
  let movedCount=0;

    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < f.effectiveFrom) return;

    dbWrite('cancelling a session for a Pod move', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();
  const podName = isOnline? ('Online — '+findInstructor(instructorId).name) : (podId? findPod(podId).name : 'auto-assign');
  const dayLabel=weekday? ' on '+weekday+'s' : '';
  toast(student.name+' moves to '+podName+dayLabel+' from '+fmtShort(new Date(f.effectiveFrom))+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
  state.studentPodForm=null;
  render();

function removeStudentPodAssignment(studentId, effectiveFromKey, weekday){
  const student=findStudent(studentId);
  const wd=weekday||null;
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===effectiveFromKey && (a.weekday||null)===wd);
  });

    let q=supabaseClient.from('student_pod_assignments').delete().eq('student_id', studentId).eq('effective_from', effectiveFromKey);

// Resolves where one standing occurrence should land: an Online pin (if one applies and is
// currently feasible — the instructor is on shift and under the combined ratio at this exact
// day/time), else a Pod pin or auto-assign via pickBestPod (existing behavior, unchanged). An
// Online pin that's infeasible right now leaves the occurrence unassigned rather than silently
// falling back to a physical Pod — the same "pinned, no fallback" rule pickBestPod's own
// preferredPodId already follows (5.8/5.32).
function resolveStandingLocation(studentId, weekday, dateKey, date, start, duration, year){
  const onlineInstructorId=studentAssignedOnlineInstructorOn(studentId, date);
  if(onlineInstructorId){
    const onShift=instructorsOnShift(weekday, start, duration, date).some(function(i){ return i.id===onlineInstructorId; });
    const blocked=!onShift || instructorOnlineBlocked(onlineInstructorId, dateKey, start, duration, null);
    return blocked? {podId:null, online:false, instructorId:null} : {podId:null, online:true, instructorId:onlineInstructorId};
  }
  const pinnedPodId=studentAssignedPodOn(studentId, date); // front desk's standing Pod pin, if any (else auto-assign)
  const podId=pickBestPod(weekday, dateKey, start, duration, year, pinnedPodId);
  return {podId:podId||null, online:false, instructorId:null};
}
// deferredSessions is optional — when the caller passes an array, a newly-created occurrence's
// remote insert is pushed onto it instead of being fired immediately here (its LOCAL session object
// is still created and pushed onto `sessions` either way, so the UI updates exactly as before). Used
// by saveNewStudent() specifically: this function normally runs safely because the student it's
// generating for already exists in Supabase, but for a BRAND NEW student, firing these session
// inserts immediately races the student's own not-yet-committed insert — sessions.student_id is a
// real foreign key, so whichever request reaches Postgres first can make the other fail (Sept 2026,
// root cause of "when adding a student i'm getting an error code" / "...may not have saved").
// Deferring lets the caller insert them only once the student row is confirmed to exist.
function generateRecurringSessions(student, weeksAhead, deferredSessions){
  // A held spot (Oct 2026) has no real sessions until it's confirmed — it only counts toward
  // permanent availability (see ratioDay's includeHeld).
  if(student.heldUntil) return 0;
  const startMonday=getMonday(simNow());
  let created=0;
  for(let w=0; w<weeksAhead; w++){
    const monday=addDays(startMonday, w*7);
    WEEKDAY_KEYS.forEach(function(weekday, dayIdx){
      const date=addDays(monday, dayIdx);
      // never backfill the past — compared as YYYY-MM-DD (Oct 2026): `new Date(toKey(now))` is UTC
      // midnight, i.e. ~10–11am in Sydney, so comparing Dates treated TODAY as already past and a
      // same-day schedule change ("change today too") never booked today's new session.
      if(toKey(date) < toKey(simNow())) return;
      // Compared as YYYY-MM-DD strings, not raw Date objects — `date` here is built via local-time
      // arithmetic (addDays) while `new Date(toKey(student.startDate))` would parse as UTC midnight,
      // and in any timezone ahead of UTC that makes a same-calendar-day Date compare as "earlier"
      // than its own UTC-midnight parse, silently skipping the start date's own occurrence (and
      // starting a week late for a weekly recurring slot). toKey() on both sides avoids that entirely.
      if(student.startDate && toKey(date) < toKey(student.startDate)) return; // not enrolled yet — nothing to book before their first day (Sept 2026, per Allie: "its not always straight away")
      if(isClosedDate(date)) return; // centre's closed this day — never pre-book a regular session onto it
      if(termBreakOn(date)) return; // running summer hours this day — no standing afternoon session; families self-book a morning slot instead
      const dateKey=toKey(date);
      if(isStudentOnHold(student.id, date)) return; // on hold — leave this occurrence unbooked
      const plan=studentPlanOn(student.id, date); // respects any scheduled stop/frequency change
      const slot=(plan.recurring||[]).find(function(r){ return r.weekday===weekday; });
      if(!slot) return; // this weekday isn't part of whichever plan governs this date
      // A session cancelled for just that day (by the parent, or front desk's Cancel) still counts
      // as this occurrence — otherwise it was booked straight back in (Oct 2026, per Allie: "some
      // kids cancelled their session earlier today, but they re-appeared"). Other cancels (Pod
      // move, schedule edit, plan change) are meant to be re-booked, so they don't count.
      const dup=sessionsOnDate(dateKey).find(function(s){ return s.studentId===student.id && s.start===slot.start && (s.status!=='cancelled' || s.parentCancelled || s.oneOffCancel); });
      if(dup){
        // Already exists — normally nothing to do. The one exception: a previously-unassigned
        // occurrence (see below) is always worth trying again, since regenerateAllRecurring() runs
        // on almost every write in this app — a pin changing, a new instructor being assigned, a
        // Pod freeing up — so it's the natural place for an unassigned session to self-heal the
        // moment something actually opens up, rather than sitting unassigned until someone happens
        // to notice and fix it by hand.
        if(dup.podId==null && !dup.online){
          const loc=resolveStandingLocation(student.id, weekday, dateKey, date, slot.start, student.duration, student.year);
          if(loc.podId || loc.online){
            // Only staff logins (or offline/demo mode) may actually persist this self-heal —
            // a parent or instructor login has no valid RLS write permission for this
            // administrative correction (a parent's only matching UPDATE policy is cancel-only
            // and its WITH CHECK rejects a write that doesn't set status='cancelled'; an
            // instructor's policy can't match a session with no instructor assigned at all).
            // The local in-memory fields below are still set unconditionally so that whichever
            // role is viewing right now sees the corrected Pod/instructor immediately — only the
            // actual server write is skipped for roles that can't legally make it.
            const canPersist = !currentUser || currentUser.role==='staff';
            if(loc.online){
              dup.podId=null; dup.online=true; dup.instructorId=loc.instructorId; dup.instructorId2=null; dup.handoff=null;
              if(canPersist) dbWrite('filling a previously-unassigned standing session (Online)', function(){ return supabaseClient.from('sessions').update({
                pod_id:null, online:true, instructor_id:dup.instructorId, instructor_id_2:null, handoff_min:null
              }).eq('id', dup.id); });
            } else {
              const cov=podCoverageDetail(loc.podId, weekday, slot.start, student.duration, date);
              dup.podId=loc.podId; dup.instructorId=cov.primaryInstructorId; dup.instructorId2=cov.secondaryInstructorId; dup.handoff=cov.handoffAt;
              if(canPersist) dbWrite('filling a previously-unassigned standing session', function(){ return supabaseClient.from('sessions').update({
                pod_id:dup.podId, instructor_id:dup.instructorId, instructor_id_2:dup.instructorId2, handoff_min:dup.handoff
              }).eq('id', dup.id); });
            }
            created++;
          }
        }
        return;
      }
      if(studentOverlapClash(student.id, dateKey, slot.start, student.duration, null)) return;
      const loc=resolveStandingLocation(student.id, weekday, dateKey, date, slot.start, student.duration, student.year);
      // No eligible Pod/Online instructor is staffed/available for this exact day+time (or nothing
      // was pinned and no Pod anywhere is staffed). This USED to mean the occurrence was simply
      // never created — a student's regular class could silently vanish for a day with nothing
      // anywhere to show it. Instead, still create the session, just with no Pod/instructor —
      // visible on the Schedule tab's "Unassigned" section so front desk can see and fix it
      // directly (assign a Pod once one opens up), rather than it disappearing unnoticed.
      const cov=loc.podId? podCoverageDetail(loc.podId, weekday, slot.start, student.duration, date) : {primaryInstructorId: loc.online? loc.instructorId : null, secondaryInstructorId:null, handoffAt:null}; // tolerant of a short unattended gap (UNATTENDED_TOLERANCE_MIN), same as pickBestPod just validated
      const recSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:loc.podId||null, online:!!loc.online, instructorId:cov.primaryInstructorId, instructorId2:cov.secondaryInstructorId, handoff:cov.handoffAt, date, start:slot.start, duration:student.duration, status:'scheduled', bookedBy:'staff', creditId:null, recurring:true};
      sessions.push(recSess);
      if(deferredSessions){
        deferredSessions.push(recSess);
      } else {
        // Staff/offline may always persist a brand-new standing session. A parent may too, but
        // ONLY for their own child — regenerateAllRecurring() sweeps every student on every
        // schedule change, so a parent's own submission can incidentally reach this branch for
        // some other family's unrelated backlog gap; the matching RLS policy
        // (parent_insert_own_children_standing_session) only allows a parent to write a
        // standing session for their OWN child, so attempting the write for anyone else's would
        // just fail with a 403 — skip it here instead, same pattern as the self-heal branch
        // above. The local sessions.push() above still runs unconditionally so rendering stays
        // correct regardless of whose session this is.
        const canPersist = !currentUser || currentUser.role==='staff' || (currentUser.role==='parent' && parentCanManage(student.id)); // second parents too (Oct 2026), unless view-only
        // onDuplicateConflict — see dbWrite's own comment (Sept 2026, per Allie: "every kid got 2
        // make up for the same day"). A unique-violation here means another tab's own
        // regenerateAllRecurring() already inserted the real row for this exact student/date/slot a
        // moment before this one landed — that other row is the authoritative occurrence, so this
        // tab's own optimistic local copy (pushed above, before we knew the write would lose the
        // race) needs to come back out rather than sit there as a session this tab thinks exists but
        // the database rejected. The next live-sync refresh would eventually correct this anyway, but
        // there's no reason to wait out that window when we already know for certain right now.
        if(canPersist) dbWrite('pre-booking a standing session', function(){ return supabaseClient.from('sessions').insert({
          id:recSess.id, student_id:recSess.studentId, pod_id:recSess.podId, online:recSess.online, instructor_id:recSess.instructorId,
          instructor_id_2:recSess.instructorId2, handoff_min:recSess.handoff,
          the_date:toKey(recSess.date), start_min:recSess.start, duration:recSess.duration, status:recSess.status,
          booked_by:recSess.bookedBy, credit_id:recSess.creditId, is_recurring:true
        }); }, false, function(){
          sessions=sessions.filter(function(s){ return s.id!==recSess.id; });
          render();
        });
      }
      created++;
    });
  }
  return created;
}
function regenerateAllRecurring(){
  let total=0;
  students.forEach(function(s){ total+=generateRecurringSessions(s, HORIZON_WEEKS); });
  return total;
}
function recurringSummary(student){
  if(!student.recurring || student.recurring.length===0) return 'Not set';
  return student.recurring.map(function(r){ return r.weekday+' '+minToLabel(r.start); }).join(', ');
}
// Shared "current -> desired" pairing text for the waitlist and permanent-change-request swap
// displays below (Sept 2026, per Allie: "the function needs to be: swap (current day) for (desired
// day)... and we need to be aware of which [day is being given up]") — a bare new day/time request
// gives front desk no way to tell a genuine swap (a family moving one standing slot to another)
// apart from someone asking to simply add a session, so both flows now say explicitly which current
// slot funds the new one.
function swapLabel(fromWeekday, fromStart, toWeekday, toStart){
  return fromWeekday+' '+minToLabel(fromStart)+' → '+toWeekday+' '+minToLabel(toStart);
}
// Pairs a time-change request's previous schedule against its requested one, positionally (the form
// never adds/removes rows — frequency stays fixed, only day/time per row can change, see
// applyTimeChange's comment) — so index i's "before" is always index i's "after". Falls back to a
// plain summary for a request submitted before previousRecurring existed (legacy data with nothing
// to pair against) or the rare case the lengths don't line up.
function timeChangeSwapDetail(req){
  const prev=req.previousRecurring||[];
  const next=req.requestedRecurring||[];
  if(prev.length===0 || prev.length!==next.length) return 'Change to '+recurringSummary({recurring:next});
  return next.map(function(n,i){
    const p=prev[i];
    return (p.weekday===n.weekday && p.start===n.start)
      ? p.weekday+' '+minToLabel(p.start)+' (unchanged)'
      : 'Swap: '+swapLabel(p.weekday, p.start, n.weekday, n.start);
  }).join(', ');
}

/* ---------- automatic school-year promotion ---------- */
function applyPromotions(){
  const idx=schoolYearIndex(simNow());
  let promoted=0;
  students.forEach(function(s){
    const target=Math.min(YEAR_CAP, s.baseYear + Math.max(0, idx - s.yearBaseline));
    if(s.year!==target){ s.year=target; promoted++; }
  });
  return promoted;
}

/* ---------- actions ---------- */
function setRole(r){ state.role=r; state.booking=null; state.parentBookingCreditId=null; render(); }

function advanceClock(days){
  state.offsetDays += days;
  const promoted=applyPromotions();
  applyPlanChanges();
  regenerateAllRecurring();
  if(promoted>0) toast(promoted+' student'+(promoted===1?'':'s')+' promoted to their next school year.');
  else render();
}
function resetClock(){ state.offsetDays=0; applyPromotions(); applyPlanChanges(); render(); }

// podId is optional now (Sept 2026) — the Schedule tab's "+ Book a session" button is no longer
// attached to a specific Pod's card (pod cards were replaced by one flat student list, see
// renderStaff()), so it opens with no Pod chosen yet; suggestBookingPod() below fills one in
// automatically once a student and time are picked, same "pre-filled, editable" pattern as
// everywhere else. Passing a podId directly still works for any caller that already knows which
// Pod it wants.
function openBooking(podId, dateKey){
  const d = new Date(dateKey);
  if(d < new Date(toKey(simNow()))) return; // can't book into the past
  const closure=closedDayFor(d);
  if(closure){ toast("The centre's marked closed that day (\""+closure.label+"\") — nothing can be booked onto it."); return; }
  const dur=90;
  state.booking={dateKey};
  // locationManual: true when a caller opened this with a specific Pod already in mind (e.g. the
  // old per-pod entry point, or any future explicit caller) — suggestBookingPod() must never stomp
  // on that as the student/time/duration are filled in, same as it never stomps on a manual pick
  // made via setBookingLocation() below. `location` is the same encoded value as everywhere else a
  // Pod/Online picker appears (see sessionLocationValue) — a Pod's own id, '' for unassigned, or
  // 'online:<instructorId>' for an Online group; pickBestPod (auto-suggest) only ever proposes a
  // physical Pod, never Online — that's always a deliberate manual pick.
  state.bookingForm={studentId:'', duration:dur, start:possibleStarts(dur)[0], location:podId||'', overrideOk:false, locationManual:!!podId, checkInNow:false};
  render();
}
function closeBooking(){ state.booking=null; render(); }

// Manually assigning a make-up session (Sept 2026, per Allie: "I need a button to manually assign
// make-up sessions") — opens the exact same booking modal front desk already uses for any other
// session, just pre-loaded for this credit's own student and tagged with the credit so confirming it
// redeems the credit instead of leaving it available. Unlike the parent's own self-service make-up
// picker (startBookMakeUp/openSlotsForCredit — a constrained list limited to the next 2 weeks, an
// auto-picked Pod, and no choice of date beyond that list), this gives front desk the full ordinary
// booking form: any date, any Pod or Online, editable length — for whenever a parent calls in and
// asks staff to just sort it out directly, rather than doing it themselves online.
function openBookingForCredit(creditId){
  const credit=findCredit(creditId);
  if(!credit || credit.status!=='available') return; // guards direct calls; the button itself only ever shows for an available credit
  if(creditPartlyUsed(credit)){ toast('This credit has already been partly used for +30 min top-ups ('+creditMinutesLeft(credit)+' min left), so it can only be used for more top-ups, not a whole session.', 7000); return; }
  const student=findStudent(credit.studentId);
  // Defaults to the nearest non-closed day from today (usually just today) — rolls forward day by
  // day rather than leaving staff to land on a day the centre's marked closed and have to change it
  // immediately; they can still pick any other date from the field below.
  let d=simNow();
  for(let i=0;i<14 && closedDayFor(d);i++){ d=addDays(d,1); }
  const dateKey=toKey(d);
  const dur=student.duration;
  state.booking={dateKey, creditId};
  state.bookingForm={studentId:student.id, duration:dur, start:possibleStarts(dur)[0], location:'', overrideOk:false, locationManual:false, checkInNow:false};
  suggestBookingPod();
  render();
}
// The booking modal's date field — only ever shown for a credit-based booking (see
// renderBookingModal); an ordinary booking's date comes from wherever it was opened (a specific
// day's "+ Book a session" button) and isn't editable in-modal at all.
function setBookingDate(v){
  if(new Date(v) < new Date(toKey(simNow()))){ toast("Can't book into the past."); return; }
  const closure=closedDayFor(new Date(v));
  if(closure){ toast("The centre's marked closed that day (\""+closure.label+"\") — pick a different date."); return; }
  state.booking.dateKey=v;
  state.bookingForm.overrideOk=false;
  suggestBookingPod();
  render();
}
// "They're here right now" — offered only for a same-day booking (see renderBookingModal): checks
// the student in immediately after confirmBooking() creates the session, instead of leaving front
// desk to find them in the Schedule list and click Check in separately a moment later. Exactly the
// walk-in case Allie described: a student whose usual day is different shows up unexpectedly today.
function setBookingCheckInNow(v){ state.bookingForm.checkInNow=!!v; render(); }

// Re-suggests a Pod via pickBestPod() (first staffed, under-capacity Pod — no age consideration,
// Sept 2026) whenever the student, start time, or duration changes — mirrors the "pre-filled,
// editable" default used for check-in/check-out times. Never runs once a location has been chosen
// manually — either via setBookingLocation() below, or by opening the form with an explicit Pod
// already in mind (locationManual, set in openBooking()). Passes the student's own standing Pod pin
// (their Preferred Pod from enrollment, or any later "Change Pod" — studentAssignedPodOn() resolves
// either) as pickBestPod's preferredPodId, so a fresh manual booking defaults to it too — this used
// to only happen for check-in's own auto-suggest and standing pre-booking, leaving a plain manual
// booking to ignore the pin entirely (5.30 fix).
function suggestBookingPod(){
  const f=state.bookingForm;
  if(f.locationManual) return;
  if(!f.studentId || f.start==null){ f.location=''; return; }
  const student=findStudent(f.studentId);
  const date=new Date(state.booking.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  // An Online pin (see studentAssignedOnlineInstructorOn) is checked first — same "hard pin, no
  // fallback" rule as a Pod pin: if it's pinned to Online but that instructor isn't actually
  // available right now, this suggests nothing at all rather than falling back to hunting for a
  // physical Pod instead (5.32).
  const onlineInstructorId=studentAssignedOnlineInstructorOn(student.id, date);
  if(onlineInstructorId){
    const eligible=instructorsOnShift(weekday, f.start, f.duration, date).some(function(i){ return i.id===onlineInstructorId; })
      && !instructorOnlineBlocked(onlineInstructorId, state.booking.dateKey, f.start, f.duration, null);
    f.location = eligible? ('online:'+onlineInstructorId) : '';
    return;
  }
  f.location = pickBestPod(weekday, state.booking.dateKey, f.start, f.duration, student.year, studentAssignedPodOn(student.id, date)) || '';
}

function setBookingStudent(sid){
  state.bookingForm.studentId=sid;
  if(sid){
    const dur=findStudent(sid).duration;
    state.bookingForm.duration=dur;
    const starts=possibleStarts(dur);
    if(!starts.includes(state.bookingForm.start)) state.bookingForm.start=starts[0];
  }
  state.bookingForm.overrideOk=false;
  suggestBookingPod();
  render();
}
function setBookingDuration(v){
  state.bookingForm.duration=Number(v);
  const starts=possibleStarts(state.bookingForm.duration);
  if(!starts.includes(state.bookingForm.start)) state.bookingForm.start=starts[0];
  state.bookingForm.overrideOk=false;

  render();
}
function setBookingStart(v){
  state.bookingForm.start=Number(v);
  state.bookingForm.overrideOk=false;
  suggestBookingPod();
  render();
}
// Manual override (freely — no capacity/age blocking on the picker itself, Sept 2026) of the
// suggested location. Left alone by suggestBookingPod() until the student/time/duration changes
// again. Accepts either a Pod's own id or an 'online:<instructorId>' value (see locationOptionsHtml).
function setBookingLocation(v){ state.bookingForm.location=v; state.bookingForm.locationManual=true; state.bookingForm.overrideOk=false; render(); }
function toggleOverride(){ state.bookingForm.overrideOk=!state.bookingForm.overrideOk; render(); }

// Applies the "they're here right now" quick check-in to a session that confirmBooking() just
// created, returning a note to tack onto the usual booking toast plus the check-in's own remote
// write, deferred rather than fired here. Only ever invoked for a same-day booking (see the
// checkInNow guard in confirmBooking()) — arrival defaults to the same "nearest 5-minute mark,
// capped 3 minutes ahead" smart default the Check-in modal itself uses.
// The write MUST be deferred and chained after the new session's own insert commits, the same way
// redeemCreditForBooking() already is just below — firing it independently raced the insert (this
// session's id doesn't exist in Postgres yet), so the check-in UPDATE could reach the server first,
// match zero rows, and silently do nothing: the booking looked checked-in locally (and the toast said
// so) but the student was never actually signed in on the server (Sept 2026, per Allie: "when booking
// a session if i click the box that says student is already here, they are still not getting signed
// in" — same class of race as the earlier make-up-credit bug).
function checkInNewBookingNow(sess){
  const arrival=nearestOption(checkInArrivalOptions(sess), nowMinutesOfDay());
  const exitTime=autoExitTime(sess, arrival-sess.start);
  const write=applyCheckIn(sess, arrival, exitTime, true);
  return { msg:' Checked in immediately — running '+minToLabel(sess.actualStart)+'–'+minToLabel(sess.actualEnd)+'.', write:write };
}
// Runs a deferred remote write (see redeemCreditForBooking()/checkInNewBookingNow() above) only after
// the promise it's chained onto resolved without error — and only if there IS one to run at all (the
// ordinary case, where nothing needed deferring). Used to chain zero, one, or two dependent writes
// (a redeemed credit, an immediate check-in, either, neither, or both) onto a session's own insert,
// in order, so none of them can ever reach Postgres before the row they depend on exists.
function chainAfterInsert(insertPromise, writeFn){
  return insertPromise.then(function(r){ return (r && r.error) || !writeFn ? r : writeFn(); });
}
// Marks the credit a booking was made against as redeemed, once the session it's tied to actually
// exists locally (mirrors what bookSlot() already does for the parent's own self-service flow) — a
// no-op when this booking wasn't for a credit at all (the ordinary case). Updates local state right
// away (optimistic, same as ever), but deliberately does NOT fire the remote write itself — it hands
// the caller back a function that does, so the caller can chain it as a step AFTER the new session's
// own insert has committed. credits.redeemed_session_id is a real foreign key to sessions(id): firing
// the credit update as its own independent, unordered request (the old behaviour) raced the session's
// insert, and whichever reached Postgres second could fail outright if the session row it points at
// doesn't exist yet (Sept 2026, root cause of "makeup credits are not saving to server" when
// redeeming one from the front desk's manual "assign make-up" flow — same class of bug already fixed
// once for saveNewStudent's own parent/student ordering).
/* ---------- +30 min make-up top-ups (Oct 2026) ---------- */
// Per Allie: "I sometimes offer up the option to our parents to make up a missed session (whether
// its 1.5 hrs or 1hr or 2 hrs) in additional 30 min to an already scheduled session". Chosen:
// parents can add it too (if they can make changes for that child), it must be clear it uses
// make-up time and show what's left; the extra time goes AFTER the session; a credit is used in
// 30-minute pieces; front desk sees it flagged at check-in. A credit with nothing used yet can still
// be booked as one whole make-up session; once part-used it's top-ups only. The database does the
// real checks (add_session_topup / remove_session_topup, add_session_topups.sql) and hands minutes
// back automatically if a topped-up session is cancelled or marked away / not in.
var TOPUP_MIN=30;
function sessionBaseMinutes(s){ return s.duration-(s.extraMin||0); }
function creditTotalMinutes(c){ if(c.minutes) return c.minutes; const st=findStudent(c.studentId); return st? st.duration : 90; }
function creditMinutesLeft(c){ return Math.max(0, creditTotalMinutes(c)-(c.minutesUsed||0)); }
function creditPartlyUsed(c){ return (c.minutesUsed||0)>0; }
function creditUsableForTopUp(c, date){
  return c.status==='available' && toKey(c.expiryDate)>=toKey(date) && toKey(c.expiryDate)>=toKey(simNow()) && creditMinutesLeft(c)>=TOPUP_MIN;
}
// Which credit a top-up would come from: an already-started one first (so families don't end up
// with several half-used credits), then whichever expires soonest.
function topUpCreditFor(studentId, date){
  return credits.filter(function(c){ return c.studentId===studentId && creditUsableForTopUp(c, date); })
    .sort(function(a,b){ return (creditPartlyUsed(b)-creditPartlyUsed(a)) || (a.expiryDate-b.expiryDate); })[0] || null;
}
function totalTopUpMinutesLeft(studentId){
  return credits.filter(function(c){ return c.studentId===studentId && c.status==='available' && toKey(c.expiryDate)>=toKey(simNow()); })
    .reduce(function(sum,c){ return sum+creditMinutesLeft(c); }, 0);
}
// Why +30 can't be added to this session right now (null = it can). Parents get the same strict
// checks the booking calendar uses; front desk can still overbook a Pod on the day, as elsewhere.
// `credit` (optional): use that specific credit (the credits list's +30 button) instead of picking one.
function topUpBlockedReason(sess, byParent, credit){
  const student=findStudent(sess.studentId);
  const name=student? student.name : 'They';
  if(sess.status!=='scheduled') return 'Only an upcoming booked session can be extended.';
  const dk=toKey(sess.date), todayKey=toKey(simNow());
  if(dk<todayKey) return 'That session has already happened.';
  if(sess.extraMin>0) return 'This session already has an extra 30 minutes.';
  if(credit? !creditUsableForTopUp(credit, sess.date) : !topUpCreditFor(sess.studentId, sess.date)) return credit && toKey(credit.expiryDate)<dk? 'That credit expires before this session.' : name+' doesn\'t have 30 minutes of make-up time available for that date.';
  const end=sess.start+sess.duration;
  if(end+TOPUP_MIN>CENTER_CLOSE) return 'The centre closes before an extra 30 minutes would finish.';
  if(byParent && dk===todayKey && sameDayMakeUpCutoffPassed()) return 'Same-day changes close at 10:00am — please call the centre.';
  if(studentOverlapClash(sess.studentId, dk, end, TOPUP_MIN, sess.id)) return 'It would run into another session '+name+' has that day.';
  // Centre-wide staff ratio for those extra 30 minutes (Oct 2026, see ratioDay) — front desk can
  // still squeeze someone in on the day itself, as elsewhere.
  if((byParent || dk!==todayKey) && !ratioHasRoom(dk, end, TOPUP_MIN, !!sess.online)) return 'The centre is full for those extra 30 minutes'+(byParent? ' — please call the centre.' : '.');
  return null;
}
function applyTopUpLocally(sess, credit){
  sess.duration+=TOPUP_MIN; sess.extraMin=TOPUP_MIN; sess.extraCreditId=credit.id;
  credit.minutes=creditTotalMinutes(credit);
  credit.minutesUsed=(credit.minutesUsed||0)+TOPUP_MIN;
  if(creditMinutesLeft(credit)<=0) credit.status='redeemed';
}
function addTopUp(sessionId, creditId){
  const sess=findSession(sessionId);
  if(!sess) return;
  const byParent = currentUser? currentUser.role==='parent' : state.role==='parent';
  const chosen=creditId? findCredit(creditId) : null;
  const reason=topUpBlockedReason(sess, byParent, chosen);
  if(reason){ toast(reason, 7000); return; }
  const student=findStudent(sess.studentId);
  const credit=chosen || topUpCreditFor(sess.studentId, sess.date);
  const leftAfter=creditMinutesLeft(credit)-TOPUP_MIN;
  const oldEnd=sess.start+sess.duration, newEnd=oldEnd+TOPUP_MIN;
  if(!confirm('Add 30 extra minutes to '+student.name+'\'s session on '+fmtShort(sess.date)+'?\n\n'
    +'This uses 30 minutes of make-up time from a missed session ('+leftAfter+' min left on that credit after this).\n'
    +'The session will finish at '+minToLabel(newEnd)+' instead of '+minToLabel(oldEnd)+'.')) return;
  const done=function(){
    applyTopUpLocally(sess, credit);
    state.topUpPicker=null;
    toast('Added 30 minutes — '+student.name+' now finishes at '+minToLabel(newEnd)+' on '+fmtShort(sess.date)+'. '+leftAfter+' min of make-up time left on that credit.', 7000);
    render();
  };
  if(!supabaseClient || !currentUser){ done(); return; }
  supabaseClient.rpc('add_session_topup', {p_session_id:sess.id, p_credit_id:credit.id}).then(function(r){
    if(r.error){
      const msg=String(r.error.message||'');
      toast('Couldn\'t add the extra 30 minutes — '+(/overlap|exclusion|conflict/i.test(msg)? 'it would run into another session that day.' : msg), 7000);
      return;
    }
    done();
  });
}
function removeTopUp(sessionId){
  const sess=findSession(sessionId);
  if(!sess || !sess.extraMin) return;
  const student=findStudent(sess.studentId);
  if(!confirm('Remove the extra 30 minutes from '+student.name+'\'s session on '+fmtShort(sess.date)+'?\n\nThe 30 minutes go back onto their make-up credit.')) return;
  const done=function(){
    const credit=sess.extraCreditId? findCredit(sess.extraCreditId) : null;
    if(credit){
      credit.minutesUsed=Math.max(0,(credit.minutesUsed||0)-sess.extraMin);
      if(credit.status==='redeemed' && !credit.redeemedSessionId) credit.status='available';
    }
    sess.duration-=sess.extraMin; sess.extraMin=0; sess.extraCreditId=null;
    toast('Extra 30 minutes removed — the time is back on '+student.name+'\'s make-up credit.');
    render();
  };
  if(!supabaseClient || !currentUser){ done(); return; }
  supabaseClient.rpc('remove_session_topup', {p_session_id:sess.id}).then(function(r){
    if(r.error){ toast('Couldn\'t remove it — '+r.error.message, 7000); return; }
    done();
  });
}
// On-screen mirror of the database's return_topup_minutes trigger: when a topped-up session is
// cancelled or marked away/not in, its extra 30 minutes go back onto the credit and the session
// returns to its normal length. Only touches local state — the database does it for real.
function returnTopUpLocally(sess){
  if(!sess || !sess.extraMin || sess.status!=='scheduled') return;
  const credit=sess.extraCreditId? findCredit(sess.extraCreditId) : null;
  if(credit){
    credit.minutesUsed=Math.max(0,(credit.minutesUsed||0)-sess.extraMin);
    if(credit.status==='redeemed' && !credit.redeemedSessionId) credit.status='available';
  }
  sess.duration-=sess.extraMin; sess.extraMin=0; sess.extraCreditId=null;
}
// Short marker used wherever a session is listed (Oct 2026).
function topUpBadgeHtml(sess){
  return sess.extraMin? ' <span class="badge firstday" title="Includes '+sess.extraMin+' extra minutes of make-up time">+'+sess.extraMin+' min make-up</span>' : '';
}

function redeemCreditForBooking(creditId, sessionId){
  if(!creditId) return null;
  const credit=findCredit(creditId);
  if(!credit) return null;
  credit.status='redeemed';
  credit.redeemedSessionId=sessionId;
  return function(){ return supabaseClient.from('credits').update({status:'redeemed', redeemed_session_id:sessionId}).eq('id', credit.id); };
}
function confirmBooking(){
  const b=state.booking; const f=state.bookingForm;
  if(!f.studentId || f.start==null) return;
  const dateKey=b.dateKey, date=new Date(dateKey);
  const student=findStudent(f.studentId);
  const isOnline = String(f.location).indexOf('online:')===0;
  const onlineInstructorId = isOnline? f.location.slice(7) : null;
  const pod = (!isOnline && f.location)? findPod(f.location) : null;
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const end=f.start+f.duration;
  const checkInNow = !!f.checkInNow && dateKey===toKey(simNow());
  const creditId=b.creditId||null;

  if(studentOverlapClash(student.id, dateKey, f.start, f.duration, null)){
    toast('Blocked — '+student.name+' already has an overlapping session that day.');
    return;
  }

  // Online — no Pod, no coverage/handoff to resolve (the instructor's already on shift running a
  // Pod); the combined 1:9 ratio is the only thing that can say no.
  if(isOnline){
    const instr=findInstructor(onlineInstructorId);
    if(instructorOnlineBlocked(onlineInstructorId, dateKey, f.start, f.duration)){
      const peak=instructorCombinedPeak(onlineInstructorId, dateKey, {start:f.start, duration:f.duration});
      toast('Blocked — this would put '+instr.name+"'s Online group over the combined ratio ("+peak+'/'+combinedCapFor(onlineInstructorId)+').');
      return;
    }
    const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:null, instructorId:onlineInstructorId, instructorId2:null, handoff:null, online:true, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
    sessions.push(newSess);
    // redeemCreditForBooking() updates the local credit right away but hands back its remote write
    // rather than firing it — chained here as a step AFTER the session insert resolves, since
    // credits.redeemed_session_id is a real foreign key to sessions(id) and firing both as
    // independent, unordered requests could have the credit update reach Postgres first and fail
    // against a session row that doesn't exist yet (Sept 2026 fix).
    const redeemWrite=redeemCreditForBooking(creditId, newSess.id);
    const checkInResult=checkInNow? checkInNewBookingNow(newSess) : null;
    dbWrite('booking an online session'+(redeemWrite? ' and redeeming its make-up credit':'')+(checkInResult? ' and checking in':''), function(){
      let p=supabaseClient.from('sessions').insert({
        id:newSess.id, student_id:newSess.studentId, pod_id:null, instructor_id:newSess.instructorId, instructor_id_2:null, handoff_min:null, online:true,
        the_date:toKey(newSess.date), start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
      });
      p=chainAfterInsert(p, redeemWrite);
      p=chainAfterInsert(p, checkInResult && checkInResult.write);
      return p;
    });
    let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked into Online — '+instr.name+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+'.';
    if(checkInResult) msg+=checkInResult.msg;
    toast(msg);
    state.booking=null;
    render();
    return;
  }

  // No Pod chosen at all — book it unassigned, same as any other slot nothing was staffed for
  // (5.10). Front desk can pick a Pod for it any time from the Schedule list.
  if(!pod){
    const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:null, instructorId:null, instructorId2:null, handoff:null, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
    sessions.push(newSess);
    // See the Online branch above for why this is chained rather than fired independently.
    const redeemWrite=redeemCreditForBooking(creditId, newSess.id);
    const checkInResult=checkInNow? checkInNewBookingNow(newSess) : null;
    dbWrite('booking an unassigned session'+(redeemWrite? ' and redeeming its make-up credit':'')+(checkInResult? ' and checking in':''), function(){
      let p=supabaseClient.from('sessions').insert({
        id:newSess.id, student_id:newSess.studentId, pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null,
        the_date:toKey(newSess.date), start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
      });
      p=chainAfterInsert(p, redeemWrite);
      p=chainAfterInsert(p, checkInResult && checkInResult.write);
      return p;
    });
    let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+' — no Pod chosen, pick one any time from the Schedule list.';
    if(checkInResult) msg+=checkInResult.msg;
    toast(msg);
    state.booking=null;
    render();
    return;
  }

  // The only thing that can require an override for STAFFING is actual coverage: no instructor
  // anywhere near the window, or a real gap bigger than the tolerated 15 minutes unattended
  // (UNATTENDED_TOLERANCE_MIN). Capacity (the 1:8 ratio) used to be checked separately below and
  // was never override-able at all — but front desk already has a same-day capacity bypass for
  // MOVING an already-booked session (movePodSession, per Allie: "on the day students can be moved
  // to other pods, disregarding pod fullness"), and the only way to reach that for a brand-new
  // booking was the roundabout trick of booking it unassigned first, then moving it — something only
  // Allie herself was doing (Sept 2026, per Allie: "I also need all front staff to have the ability
  // to overbook a pod on the day, not just me"). So the exact same rule now applies directly here
  // too: a future-dated booking is still hard-capped at capacity, no override; a same-day booking can
  // go over, since front desk is looking at the real room, not a projection.
  const cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
  const totallyUnassigned = !cov.primaryInstructorId;
  const needsOverride = !cov.ok;

  if(needsOverride && !f.overrideOk) return; // needs explicit override checkbox

  const cap=podCapacity(pod.id);
  const isToday=dateKey===toKey(simNow());
  const wouldBePeak = peakConcurrency(pod.id, dateKey, {start:f.start, duration:f.duration});
  const overCapacityToday = isToday && wouldBePeak>cap;
  if(!isToday && podCapacityBlocked(pod.id, dateKey, {start:f.start, duration:f.duration})){
    toast('Blocked — this would put '+pod.name+' over capacity ('+wouldBePeak+'/'+cap+').');
    return;
  }

  const newSess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:pod.id, instructorId: cov.primaryInstructorId, instructorId2: cov.secondaryInstructorId, handoff: cov.handoffAt, date, start:f.start, duration:f.duration, status:'scheduled', bookedBy:'staff', creditId};
  sessions.push(newSess);
  // See the Online branch above for why this is chained rather than fired independently.
  const redeemWrite=redeemCreditForBooking(creditId, newSess.id);
  const checkInResult=checkInNow? checkInNewBookingNow(newSess) : null;
  dbWrite('booking a session'+(redeemWrite? ' and redeeming its make-up credit':'')+(checkInResult? ' and checking in':''), function(){
    let p=supabaseClient.from('sessions').insert({
      id:newSess.id, student_id:newSess.studentId, pod_id:newSess.podId, instructor_id:newSess.instructorId,
      instructor_id_2:newSess.instructorId2, handoff_min:newSess.handoff, the_date:toKey(newSess.date),
      start_min:newSess.start, duration:newSess.duration, status:newSess.status, booked_by:newSess.bookedBy, credit_id:newSess.creditId
    });
    p=chainAfterInsert(p, redeemWrite);
    p=chainAfterInsert(p, checkInResult && checkInResult.write);
    return p;
  });
  const handoffNote = cov.secondaryInstructorId? (' with a handoff to '+findInstructor(cov.secondaryInstructorId).name+' at '+minToLabel(cov.handoffAt)) : '';
  const withNote = cov.primaryInstructorId? (' with '+findInstructor(cov.primaryInstructorId).name) : '';
  const gapNote = (cov.gapMinutes>0 && cov.ok)? (' ('+cov.gapMinutes+' min unattended — within the '+UNATTENDED_TOLERANCE_MIN+'-min tolerance)') : '';
  const capacityNote = overCapacityToday? (' — over capacity ('+wouldBePeak+'/'+cap+'), allowed since it\'s today') : '';
  let msg=(creditId? 'Make-up booked — ' : '')+student.name+' booked into '+pod.name+withNote+', '+fmtShort(date)+' '+rangeLabel(f.start,f.duration)+handoffNote+gapNote+capacityNote+'.';
  if(checkInResult) msg+=checkInResult.msg;
  toast(msg);
  state.booking=null;
  render();
}

// A student who simply doesn't turn up is two very different situations to front desk (Sept 2026,
// per Allie: "I need to differentiate... the student not coming and having notified us thus getting
// a makeup credit, or the student just not showing up"). 'no-show' is the plain, un-notified case —
// no make-up credit, since nothing was arranged in advance. 'excused' is a family who called/messaged
// ahead of time to say they can't make it — treated exactly like any other advance-notice absence
// (a parent's own self-cancel, a centre closure): a make-up credit is issued, same 90-day rule.
function markStatus(sessionId, status){
  const sess=findSession(sessionId);
  if(status==='cancelled' || status==='excused' || status==='no-show') returnTopUpLocally(sess); // +30 minutes back on the credit (Oct 2026)
  sess.status=status;
  if(status==='cancelled') sess.oneOffCancel=true; // keeps auto-booking from re-booking it (Oct 2026)
  dbWrite('updating attendance', function(){ return supabaseClient.from('sessions').update(status==='cancelled'? {status, one_off_cancel:true} : {status}).eq('id', sess.id); });
  if(status==='excused'){
    const issued=sess.date;
    const expiry=addMonths(issued,3);
    const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'excused-absence', note:'', minutes:sessionBaseMinutes(sess), minutesUsed:0};
    credits.push(c);
    dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
      id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
      status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note, minutes:c.minutes||null
    }); });
    toast(findStudent(sess.studentId).name+' marked excused (notified in advance) — a make-up credit was issued, expires '+fmtShort(expiry)+'.');
  } else if(status==='no-show'){
    toast(findStudent(sess.studentId).name+' marked as a no-show — no make-up credit issued, since nothing was arranged in advance.');
  } else {
    render();
  }
}

// Parent self-service cancellation (5.7-style rule, revised Sept 2026 per Allie): a parent can
// always cancel an individual upcoming session themselves — cancelling with notice (any day
// before today, or same-day but before the 10:00am cutoff) frees the slot and automatically
// issues a make-up credit, exactly like a front-desk no-show would, dated from the missed session
// and expiring 3 months later. Cancelling a same-day session AFTER the cutoff still goes through
// (it was previously refused outright here, which just meant a family had to phone in instead) —
// it just doesn't come with a make-up credit, since that's the same cutoff already used for
// booking make-ups (5.7). Both the confirm dialog and the resulting toast say so explicitly, so
// nobody cancels expecting a credit that isn't coming.
function parentCancelSession(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='scheduled') return;
  const now=simNow();
  const pastCutoff = toKey(sess.date)===toKey(now) && sameDayMakeUpCutoffPassed();
  const student=findStudent(sess.studentId);
  const issued=sess.date, expiry=addMonths(issued,3);
  const confirmMsg = 'Cancel '+student.name+'\'s session?\n'+fmtLong(sess.date)+' at '+minToLabel(sess.start)+'\n\nThis will cancel this session only. '+student.name+'\'s regular session time will remain unchanged. '
    + (pastCutoff
      ? 'It\'s after the 10:00am same-day cutoff, so this cancellation will NOT come with a make-up credit.'
      : 'You\'ll get a make-up credit valid until '+fmtShort(expiry)+'.');
  if(!confirm(confirmMsg)) return;
  returnTopUpLocally(sess); // +30 minutes back on the credit (the database does the same, Oct 2026)
  sess.status='cancelled';
  dbWrite('cancelling session (parent'+(pastCutoff?', after same-day cutoff — no make-up':', with notice')+')', function(){ return supabaseClient.from('sessions').update({status:'cancelled', parent_cancelled:true}).eq('id', sess.id); });
  sess.parentCancelled=true;
  if(pastCutoff){
    toast('Session cancelled — no make-up credit was issued since it\'s after the 10:00am same-day cutoff. Call the centre if you\'d like to discuss options.', 6000);
    return;
  }
  const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'parent-cancel', note:'', minutes:sessionBaseMinutes(sess), minutesUsed:0};
  credits.push(c);
  dbWrite('issuing a make-up credit', function(){ return supabaseClient.from('credits').insert({
    id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
    status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note, minutes:c.minutes||null
  }); });
  toast('Session cancelled — a make-up credit was added, valid until '+fmtShort(expiry)+'.');
}

/* ---------- manual make-up credits (e.g. migrating owed make-ups from an old manual log) ---------- */
// Sept 2026, per Allie: "when giving a child a credit, only make available the specific days that
// child usually regularly attends — taking into consideration any changes to scheduling in the
// future" — the "Owed from (missed session date)" field is supposed to name the actual day the
// student missed, so it shouldn't accept a weekday they were never even scheduled on. A plain HTML
// date input can't grey out individual days on its own, so this validates on change instead (same
// pattern setBookingDate() already uses for closed days) and explains why, rather than silently
// accepting whatever's typed. studentPlanOn() resolves whichever dated recurring pattern actually
// governed that specific date — so a student who changed schedule partway through is checked
// against their pattern AS OF the date being entered, not just their current one.
function isStudentRegularDate(studentId, dateKey){
  if(!studentId || !dateKey) return true; // nothing chosen yet to validate against
  const plan=studentPlanOn(studentId, new Date(dateKey));
  if(!plan.recurring || plan.recurring.length===0) return true; // no pattern on file — nothing to restrict against (e.g. a stopped enrolment being migrated)
  const weekday=WEEKDAY_KEYS[(new Date(dateKey).getDay()+6)%7];
  return plan.recurring.some(function(r){ return r.weekday===weekday; });
}
function studentRegularDaysLabel(studentId, dateKey){
  const plan=studentPlanOn(studentId, new Date(dateKey));
  if(!plan.recurring || plan.recurring.length===0) return null;
  return plan.recurring.map(function(r){ return r.weekday; }).join(', ');
}
// Used only when switching students in the form invalidates whatever date was already entered —
// snaps to the closest date (same day, then a day either side, and so on) that actually matches the
// newly-selected student's own pattern, rather than leaving a stale, now-meaningless date in place.
function nearestRegularDateKey(studentId, aroundDateKey, maxDays){
  const around=new Date(aroundDateKey);
  const limit=maxDays||90;
  for(let i=0;i<=limit;i++){
    const back=toKey(addDays(around,-i));
    if(isStudentRegularDate(studentId, back)) return back;
    if(i>0){
      const fwd=toKey(addDays(around,i));
      if(isStudentRegularDate(studentId, fwd)) return fwd;
    }
  }
  return aroundDateKey; // give up — nothing matched within range, leave it as-is
}
function openAddCreditForm(studentId){

// cant remember, to just update them as a today thing but have multiples") — dated today, so the
// regular-day check doesn't apply, and they expire 3 months from today like any other credit.
function setAddCreditCarriedOver(on){
  const f=state.addCreditForm;
  f.carriedOver=!!on;
  if(on){
    f.issuedDate=toKey(simNow()); f.expiryDate=toKey(addMonths(simNow(),3));

}
function closeAddCreditForm(){ state.addCreditForm=null; render(); }
function setAddCreditField(field, value){
  const f=state.addCreditForm;
  if(field==='quantity'){ f.quantity=Math.max(1, Math.min(10, parseInt(value,10)||1)); f.error=''; render(); return; }
  if(field==='issuedDate' && f.studentId && value && !f.carriedOver && !isStudentRegularDate(f.studentId, value)){
    const daysLabel=studentRegularDaysLabel(f.studentId, value);
    f.error=findStudent(f.studentId).name+' only attends '+(daysLabel||'no regular days')+' as of that date — pick a date that falls on one of those days.';
    render();
    return; // reject the change outright — issuedDate stays at whatever it was
  }
  f[field]=value;
  f.error='';
  // Keep expiry in sync with the standard 3-month rule as the issued date changes — staff can
  // still override it afterward for a migrated record that doesn't fit the rule exactly.
  if(field==='issuedDate' && value){ f.expiryDate=toKey(addMonths(new Date(value),3)); }
  if(field==='studentId' && value && f.issuedDate && !f.carriedOver && !isStudentRegularDate(value, f.issuedDate)){
    f.issuedDate=nearestRegularDateKey(value, f.issuedDate, 90);
    f.expiryDate=toKey(addMonths(new Date(f.issuedDate),3));
  }
  render();
}
function saveAddCredit(){
  const f=state.addCreditForm;
  if(!f.studentId){ f.error='Choose a student.'; render(); return; }
  if(!f.issuedDate){ f.error='Enter the date the make-up is owed from.'; render(); return; }

    credits.push(c); made.push(c);

  dbWrite('adding '+(qty===1? 'a manual credit' : qty+' manual credits'), function(){ return supabaseClient.from('credits').insert(made.map(function(c){ return {
    id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
    status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note, minutes:c.minutes||null
  }; })); });

  state.addCreditForm=null;
  render();
}
// Sept 2026, per Allie: "i want every single credit to have a remove button" — front desk needs full
// manual control over the credits table, not just migration-entry mistakes on unredeemed manual
// credits (the previous restriction) — but NOT ones already redeemed against a session ("not the
// redeemed ones"): those stay locked, so this never has to touch a session's creditId link.
function removeCredit(id){
  const c=findCredit(id);
  if(!c) return;

  render();
}

/* ---------- extend a make-up credit's expiry (Nov 2026, front desk only) ---------- */
// Per Allie: "the option as front desk to extend the validity of a makeup credit". Works on an

// parent gets a fresh reminder before the new date.
function openExtendCredit(id){
  const c=findCredit(id); if(!c) return;

}
function closeExtendCredit(){ state.extendCreditForm=null; render(); }
function setExtendCreditDate(k){ if(state.extendCreditForm){ state.extendCreditForm.date=k; state.extendCreditForm.error=''; render(); } }
function extendCreditBy(months, days){

  const base=toKey(c.expiryDate)>toKey(simNow())? c.expiryDate : simNow();
  setExtendCreditDate(toKey(addDays(addMonths(base,months||0),days||0)));
}
function saveExtendCredit(){
  const f=state.extendCreditForm; const c=f&&findCredit(f.id); if(!c) return;
  if(!f.date){ f.error='Pick a new expiry date.'; render(); return; }

  c.expiryDate=new Date(f.date);
