// Kindy is year 0 (Pre-K is -1), so a plain `!f.year` treated Kindy as "no year chosen" (Oct 2026,
// per Allie: "when enrolling a new student in kindy, when i select K, it says please select a school
// year. even though i have"). Only an empty / non-numeric choice counts as missing.
function schoolYearMissing(v){ return v===null || v===undefined || v==='' || isNaN(Number(v)); }
function saveNewStudent(){
  const f=state.newStudentForm;
  if(!f.studentName.trim()){ f.error='Enter the student\'s name.'; render(); return; }
  if(schoolYearMissing(f.year)){ f.error='Choose a school year.'; render(); return; }
  if(!f.startDate){ f.error='Choose a start date.'; render(); return; }
  if(toKey(new Date(f.startDate))<toKey(simNow())){ f.error='Start date can\'t be in the past.'; render(); return; }
  // Same-name check — see activeStudentsNamed(). Stops here and shows the choice in the form
  // (renderNewStudentModal) until front desk either edits the existing student instead or confirms.
  const sameName=activeStudentsNamed(f.studentName);
  if(sameName.length && !f.duplicateConfirmed){ f.duplicateOf=sameName.map(function(s){ return s.id; }); render(); return; }
  let parentId=null;
  // Set only when creating a brand-new parent alongside this student — its actual remote insert is
  // deferred and chained as the FIRST step of the student's own dbWrite below (see there for why:
  // students.parent_id is a real foreign key to parents(id), and firing these as two independent,
  // unordered requests risked the student's insert reaching Postgres before the parent's had
  // committed, failing on that foreign key — Sept 2026, root cause of "when adding a student i'm
  // getting an error code" / "it still says change is visible here but may not have saved").
  let newParentInsert=null;
  if(f.parentMode==='existing'){
    if(!f.parentId){ f.error='Choose a parent, or switch to “New parent”.'; render(); return; }
    parentId=f.parentId;
  } else {
    if(!f.parentName.trim() || !f.parentEmail.trim()){ f.error='Enter the parent\'s name and email.'; render(); return; }
    const existingParent=parents.find(function(p){ return p.email.toLowerCase()===f.parentEmail.trim().toLowerCase(); });
    if(existingParent){
      f.error='A parent with that email already exists — pick “Existing parent” instead.';
      render(); return;
    }
    const newParent={id:newId()||('p'+(nextParentId++)), name:f.parentName.trim(), email:f.parentEmail.trim(), studentIds:[]};
    parents.push(newParent);
    newParentInsert=function(){ return supabaseClient.from('parents').insert({id:newParent.id, name:newParent.name, email:newParent.email}); };
    parentId=newParent.id;
  }
  const newStudent={id:newId()||('s'+(nextStudentId++)), name:f.studentName.trim(), year:Number(f.year), baseYear:Number(f.year), yearBaseline:schoolYearIndex(simNow()), duration:Number(f.duration), sessionsPerWeek:Number(f.sessionsPerWeek), parentId, startDate:new Date(f.startDate), recurring:f.recurring.map(function(r){ return {weekday:r.weekday, start:r.start}; }), holds:[]};
  // Hold spot (Oct 2026) — see SPOT_HOLD_DAYS / confirmSpotHold / releaseSpotHold.
  if(f.holdSpot){ newStudent.heldUntil=addDays(new Date(toKey(simNow())), SPOT_HOLD_DAYS); newStudent.heldNewParent=!!newParentInsert; }
  // A Preferred Pod chosen at enrollment (5.30, per Allie) isn't a separate field/column — it's just
  // one of the student's very first standing Pod pins, written the same way "Change Pod"
  // (openStudentPodForm/saveStudentPodAssignment) writes any other one, effective from day one. That
  // means studentAssignedPodOn() picks it up automatically everywhere a pin already mattered
  // (recurring pre-booking below, check-in's auto-suggest for an unassigned session, and the booking
  // modal's own suggestBookingPod()) with no extra plumbing, and a later "Change Pod" naturally
  // supersedes it — it'll always have a later effectiveFrom, and studentAssignedPodOn() already
  // resolves ties that way. No fallback if a preferred Pod turns out to be unstaffed or full for its
  // slot (same "front desk's own explicit call" rule pickBestPod applies to every pin) — that
  // occurrence is simply left unassigned, visible in the Schedule tab like any other coverage gap.
  //
  // Revised Sept 2026, per Allie: "the preferred pods need to be set up per session, not overall" —
  // each recurring row now carries its own preferredPodId, so this writes one weekday-scoped pin per
  // row that has one chosen, instead of a single pin applying to every session alike (weekday:null).
  // studentAssignedPodOn() already resolves pins per weekday (it's the same mechanism the day-specific
  // "Change Pod" pin uses), so no changes were needed there. If two rows land on the same weekday
  // (a student with two sessions the same day), only one pin can apply to that whole weekday — the
  // later entry in this array wins, same tie-break studentAssignedPodOn() always uses.
  const preferredPodAssignments=f.recurring
    .filter(function(r){ return r.preferredPodId; })
    .map(function(r){ return {podId:r.preferredPodId, effectiveFrom:new Date(toKey(simNow())), weekday:r.weekday}; });
  if(preferredPodAssignments.length) newStudent.podAssignments=preferredPodAssignments;
  students.push(newStudent);
  // Every remote write below is chained into ONE ordered sequence — parent (if new) -> student ->
  // recurring slots -> pod assignments -> the recurring sessions generateRecurringSessions() creates
  // further down — rather than each firing as its own independent, unordered request. Several of
  // these reference the row before them as a real foreign key (parent_id, student_id), so an
  // out-of-order arrival at Postgres previously meant an otherwise-successful enrollment could still
  // fail here with a foreign-key violation (Sept 2026 fix — see newParentInsert/deferredSessions
  // above). Purely a remote-persistence-ordering fix: every local/optimistic update below (pushing to
  // `students`, generating sessions into `sessions`, the toast) still happens immediately, same as always.
  const deferredSessions=[];
  dbWrite('enrolling a new student', function(){
    const afterParent = newParentInsert? newParentInsert() : Promise.resolve({error:null});
    return afterParent.then(function(r){
      if(r && r.error) return r;
      return supabaseClient.from('students').insert({
        id:newStudent.id, parent_id:newStudent.parentId, name:newStudent.name, year:newStudent.year, base_year:newStudent.baseYear,
        year_baseline:newStudent.yearBaseline, duration:newStudent.duration, sessions_per_week:newStudent.sessionsPerWeek,
        start_date:toKey(newStudent.startDate),
        held_until: newStudent.heldUntil? toKey(newStudent.heldUntil) : null, held_new_parent: !!newStudent.heldNewParent
      });
    }).then(function(r){
      if(r.error || !newStudent.recurring.length) return r;
      return supabaseClient.from('student_recurring_slots').insert(newStudent.recurring.map(function(rec){ return {student_id:newStudent.id, weekday:rec.weekday, start_min:rec.start}; }));
    }).then(function(r){
      if(r.error || !newStudent.podAssignments || !newStudent.podAssignments.length) return r;
      return supabaseClient.from('student_pod_assignments').insert(newStudent.podAssignments.map(function(a){
        return {student_id:newStudent.id, pod_id:a.podId, effective_from:toKey(a.effectiveFrom), weekday:a.weekday};
      }));
    }).then(function(r){
      if(r.error || !deferredSessions.length) return r;
      return supabaseClient.from('sessions').insert(deferredSessions.map(function(s){ return {
        id:s.id, student_id:s.studentId, pod_id:s.podId, online:s.online, instructor_id:s.instructorId,
        instructor_id_2:s.instructorId2, handoff_min:s.handoff,
        the_date:toKey(s.date), start_min:s.start, duration:s.duration, status:s.status,
        booked_by:s.bookedBy, credit_id:s.creditId, is_recurring:true
      }; }));
    });
  });
  const parent=parents.find(function(p){ return p.id===parentId; });
  parent.studentIds.push(newStudent.id);
  const made=generateRecurringSessions(newStudent, HORIZON_WEEKS, deferredSessions);
  const uncovered=slotsWithoutCoverage(newStudent.recurring, newStudent.duration, newStudent.year);
  if(newStudent.heldUntil){
    toast('Spot held for '+newStudent.name+' ('+recurringSummary(newStudent)+') until '+fmtShort(newStudent.heldUntil)+'. Use "Confirm enrolment" on the Students list once '+parent.name+' decides — their sessions get booked then. If not confirmed by '+fmtShort(newStudent.heldUntil)+', '+newStudent.name+' is removed automatically.', 10000);
  } else if(uncovered.length){
    toast(newStudent.name+' enrolled, but no Pod '+newStudent.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — 0 session(s) could be pre-booked for that time yet. Assign coverage on the Schedule tab, then reopen '+newStudent.name+'\'s regular schedule and save it again.', 9000);
  } else if(preferredPodAssignments.length && made===0){
    // Some Pod generically covers every chosen slot (uncovered came back empty) — so the reason
    // nothing got pre-booked is specifically that a Preferred Pod picked above doesn't have room
    // (or coverage) at its slot, and a pin never falls back to a different Pod on its own (same
    // rule as "Change Pod" — see the comment above where podAssignments gets set). Worth calling
    // out by name here, since "0 pre-booked" alone would otherwise look like a plain coverage gap.
    const pinnedNames=preferredPodAssignments.map(function(a){ return findPod(a.podId).name; }).filter(function(n,i,arr){ return arr.indexOf(n)===i; });
    toast(newStudent.name+' enrolled, but the Preferred Pod'+(pinnedNames.length>1?'s':'')+' chosen ('+pinnedNames.join(', ')+') don\'t have room (or coverage) at '+describeUncoveredSlots(newStudent.recurring)+' — 0 session(s) pre-booked. Pick different Preferred Pods via "Change Pod", or leave sessions on auto-assign.', 9000);
  } else {
    const startingToday = toKey(newStudent.startDate)===toKey(simNow());
    toast(newStudent.name+' enrolled'+(startingToday? '' : ' — starting '+fmtShort(newStudent.startDate))+' — '+f.sessionsPerWeek+'x/week, '+f.duration+' min, with '+parent.name+'. '+made+' standing session(s) pre-booked.');
  }
  state.newStudentForm=null;
  render();
}

// Editing an existing student's basic details (5.31, per Allie: "I need the option to edit existing
// Students... change their names, emails, etc") — deliberately separate from openRecurringForm
// (their day/time pattern) and openPlanChangeForm (a dated frequency/stop change): this is just
// fixing a typo'd name, correcting their school year, or moving them under a different parent
// record, none of which need the effective-dated regeneration machinery those other two forms carry.
// A student has no email of their own — that's their parent's — so there's nothing email-shaped to
// edit here; "reassign parent" covers the other half of "who this student belongs to".
function openEditStudentForm(studentId){
  const student=findStudent(studentId);
  state.editStudentForm={studentId, name:student.name, year:student.year, parentId:student.parentId, error:''};
  render();
}
function closeEditStudentForm(){ state.editStudentForm=null; render(); }
function setEditStudentField(field, value){ state.editStudentForm[field]=value; state.editStudentForm.error=''; render(); }
function saveEditStudent(){
  const f=state.editStudentForm;
  const student=findStudent(f.studentId);
  if(!f.name.trim()){ f.error='Enter the student\'s name.'; render(); return; }
  if(schoolYearMissing(f.year)){ f.error='Choose a school year.'; render(); return; }
  if(!f.parentId){ f.error='Choose a parent.'; render(); return; }
  student.name=f.name.trim();
  // A plain student.year=... would get silently clobbered the next time applyPromotions() runs
  // (advancing the clock, or any real day rollover) — that recomputes year fresh from baseYear/
  // yearBaseline every time, exactly the way saveNewStudent() sets them at enrollment. Re-pinning
  // both here to "this corrected year, as of today" makes the edit stick and promotes correctly
  // forward from it, instead of reverting to whatever the old (wrong) year would have promoted to.
  student.year=Number(f.year);
  student.baseYear=Number(f.year);
  student.yearBaseline=schoolYearIndex(simNow());
  const parentChanged = f.parentId!==student.parentId;
  if(parentChanged){
    const oldParent=findParent(student.parentId);
    if(oldParent) oldParent.studentIds=(oldParent.studentIds||[]).filter(function(id){ return id!==student.id; });
    const newParent=findParent(f.parentId);
    newParent.studentIds=newParent.studentIds||[];
    if(newParent.studentIds.indexOf(student.id)===-1) newParent.studentIds.push(student.id);
    student.parentId=f.parentId;
    // If the new main parent was linked as an "other parent", that link is now redundant (Oct 2026).
    if(studentGuardians.some(function(g){ return g.studentId===student.id && g.parentId===f.parentId; })){
      studentGuardians=studentGuardians.filter(function(g){ return !(g.studentId===student.id && g.parentId===f.parentId); });
      dbWrite('tidying a now-redundant parent link', function(){ return supabaseClient.from('student_guardians').delete().eq('student_id', student.id).eq('parent_id', f.parentId); });
    }
    refreshParentStudentIds();
  }
  dbWrite('editing student details', function(){ return supabaseClient.from('students').update({
    name:student.name, year:student.year, base_year:student.baseYear, year_baseline:student.yearBaseline, parent_id:student.parentId
  }).eq('id', student.id); });
  toast(student.name+'\'s details updated'+(parentChanged? ' — now under '+findParent(student.parentId).name : '')+'.');
  state.editStudentForm=null;
  render();
}

// Bringing on a new instructor (5.18): identity, their starting weekly availability (one row per
// weekday, toggled on/off, exactly the same shape as an ongoing availRule — saved with
// effectiveFrom:AVAIL_BASELINE so it behaves as their standing pattern from day one, not a future
// change), and a "years best suited" range. That range is a soft preference only (5.3) — it feeds
// Pod-matching/ranking tie-breaks and shows up as an FYI note, but per instructor "they can teach
// all", it never blocks a booking, a coverage assignment, or a Pod auto-pick.
function openNewInstructorForm(){
  const availability={};
  WEEKDAY_KEYS.forEach(function(day){ availability[day]={off:true, start:900, end:1140}; });
  state.newInstructorForm={ name:'', email:'', yearMin:1, yearMax:12, availability, inviteNow:true, error:'' };
  render();
}
function closeNewInstructorForm(){ state.newInstructorForm=null; render(); }
function setNIF(field, value){ state.newInstructorForm[field]=value; state.newInstructorForm.error=''; render(); }
function setNIFAvailability(weekday, field, value){
  const a=state.newInstructorForm.availability[weekday];
  a[field] = field==='off'? value : Number(value);
  if(a.end<=a.start){
    if(field==='start') a.end=Math.min(CENTER_CLOSE, a.start+START_STEP);
    else a.start=Math.max(CENTER_OPEN, a.end-START_STEP);
  }
  state.newInstructorForm.error='';
  render();
}
function saveNewInstructor(){
  const f=state.newInstructorForm;
  if(!f.name.trim()){ f.error='Enter the instructor\'s name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  if(instructors.some(function(i){ return i.email.toLowerCase()===f.email.trim().toLowerCase(); })){
    f.error='An instructor with that email already exists.'; render(); return;
  }
  if(Number(f.yearMax)<Number(f.yearMin)){ f.error='"Best suited to" can\'t be earlier than "Best suited from".'; render(); return; }
  const workingDays=WEEKDAY_KEYS.filter(function(day){ return !f.availability[day].off; });
  if(workingDays.length===0){ f.error='Turn on at least one weekday they\'re available.'; render(); return; }
  const availRules=workingDays.map(function(day){
    const a=f.availability[day];
    return {weekday:day, start:a.start, end:a.end, effectiveFrom:AVAIL_BASELINE};
  });
  const newInstructor={id:newId()||('i'+(nextInstructorId++)), name:f.name.trim(), email:f.email.trim(), yearMin:Number(f.yearMin), yearMax:Number(f.yearMax), availRules, oneOffs:[]};
  instructors.push(newInstructor);
  dbWrite('adding a new instructor', function(){ return supabaseClient.from('instructors').insert({
    id:newInstructor.id, name:newInstructor.name, email:newInstructor.email, year_min:newInstructor.yearMin, year_max:newInstructor.yearMax
  }).then(function(r){
    if(r.error || !availRules.length) return r;
    return supabaseClient.from('instructor_avail_rules').insert(availRules.map(function(a){
      return {instructor_id:newInstructor.id, weekday:a.weekday, effective_from:toKey(a.effectiveFrom), off:false, start_min:a.start, end_min:a.end};
    }));
  }); });
  toast(newInstructor.name+' added — available '+workingDays.join(', ')+'. Best suited for '+yearLabel(f.yearMin)+'–'+yearLabel(f.yearMax)+' (a preference only — they can be assigned any shift they\'re staffed for).');
  state.newInstructorForm=null;
  render();
  if(f.inviteNow) inviteLogin(newInstructor.email, 'instructor', newInstructor.id, newInstructor.name);
}

// Editing an existing instructor's name/email/"best suited for" range (5.31, per Allie) —
// deliberately separate from openStaffAvailManager (their actual weekly hours), same reasoning as
// keeping student detail edits separate from their schedule/plan forms. Same login-email caveat as
// editing a parent or staff member.
function openEditInstructorForm(instructorId){
  const instr=findInstructor(instructorId);
  state.editInstructorForm={instructorId, name:instr.name, email:instr.email, yearMin:instr.yearMin, yearMax:instr.yearMax, packUpCustomColors:!!instr.packUpCustomColors, combinedCapOverride: instr.combinedCapOverride!=null? String(instr.combinedCapOverride) : '', error:''};

function openRecurringForm(studentId){
  const student=findStudent(studentId);
  const starts=possibleStarts(student.duration);
  let slots = (student.recurring||[]).map(function(r){ return {weekday:r.weekday, start:r.start}; });
  while(slots.length<student.sessionsPerWeek) slots.push({weekday:'Mon', start:starts[0]});
  slots=slots.slice(0,student.sessionsPerWeek);
  // Snapshot of what each row actually was BEFORE this edit, kept untouched for the life of the
  // form purely to show "Currently: ..." next to each picker (see renderRecurringPickers) — slots
  // itself gets overwritten row by row as the pickers change, so without a separate copy there'd be
  // nothing left to compare against once you started editing.
  state.recurringForm={studentId, slots, originalSlots: slots.map(function(s){ return {weekday:s.weekday, start:s.start}; }), duration:student.duration};
  render();
}
function closeRecurringForm(){ state.recurringForm=null; render(); }
// Session length is editable here too (Oct 2026, per Allie: "when editing a students permanent
// schedule, i need to be able to change the session durations" — one length for all of a child's
// regular sessions, which is how students.duration already works). A longer session can't start as
// late, so any picked start time that no longer fits before close moves to the latest one that does.
function setRecurringDuration(v){
  const f=state.recurringForm;
  f.duration=Number(v);
  const starts=possibleStarts(f.duration);
  f.slots.forEach(function(s){
    if(starts.indexOf(s.start)===-1){
      const fits=starts.filter(function(t){ return t<=s.start; });
      s.start = fits.length? fits[fits.length-1] : starts[0];
    }
  });
  render();
}
function setRecurringSlot(idx, field, value){
  state.recurringForm.slots[idx][field] = field==='start'? Number(value) : value;
  render();
}
function saveRecurringForm(){
  const f=state.recurringForm;
  const student=findStudent(f.studentId);
  student.recurring = f.slots.map(function(s){ return {weekday:s.weekday, start:s.start}; });

  // New session length (Oct 2026) — set before the sessions are regenerated below, since they're
  // booked at student.duration. Make-up credits that don't record their own length were earned at
  // the OLD length, so that's stamped on them first rather than letting them silently change size.
  const durationChanged = f.duration && f.duration!==student.duration;
  if(durationChanged){
    const oldDuration=student.duration;
    const unsized=credits.filter(function(c){ return c.studentId===student.id && !c.minutes; });
    unsized.forEach(function(c){ c.minutes=oldDuration; });
    if(unsized.length) dbWrite('recording make-up credit lengths', function(){ return supabaseClient.from('credits').update({minutes:oldDuration}).in('id', unsized.map(function(c){ return c.id; })); });
    student.duration=f.duration;
    dbWrite('changing session length', function(){ return supabaseClient.from('students').update({duration:student.duration}).eq('id', student.id); });
  }

  // Persist the edited pattern to student_recurring_slots — the table loadAllData() actually
  // rebuilds student.recurring from on every page load. This form used to only ever change
  // student.recurring in memory, so the edit looked saved but would quietly revert to whatever was
  // last written here the next time anyone reloaded the app (found alongside the ghost-session bug
  // just above, Sept 2026) — delete-then-insert, same convention saveNewStudent() uses at signup.
  dbWrite('saving an edited regular schedule', function(){
    return supabaseClient.from('student_recurring_slots').delete().eq('student_id', student.id).then(function(){
      if(!student.recurring.length) return;
      return supabaseClient.from('student_recurring_slots').insert(student.recurring.map(function(rec){
        return {student_id:student.id, weekday:rec.weekday, start_min:rec.start};
      }));
    });
  });

  // Clear out every upcoming STANDING occurrence generated under the OLD pattern before rebuilding
  // from the new one. Found Sept 2026: editing a student's regular schedule here overwrote
  // student.recurring and generated fresh sessions for the new pattern, but never touched sessions
  // already generated under the old one — they just sat there indefinitely as live "scheduled"
  // bookings alongside the new ones (a student edited from Mon/Fri 4pm to Mon 3pm/Wed 4:45pm still
  // had real Mon/Fri 4pm sessions weeks into the future). Mirrors the exact clear-then-regenerate
  // approach applyTimeChange()/savePlanChange() already use for the "Stop / change plan" form; only
  // recurring:true placeholders are touched, so a one-off/make-up booking is never disturbed, and a
  // credit already redeemed against a cleared session is restored, same as any other cancellation.
  let clearedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled') return;
    if(toKey(s.date) < toKey(simNow())) return;
    s.status='cancelled';
    clearedCount++;
    dbWrite('cancelling a session for an edited regular schedule', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });

  const made=generateRecurringSessions(student, HORIZON_WEEKS);
  const uncovered=slotsWithoutCoverage(student.recurring, student.duration, student.year);
  if(uncovered.length){
    toast(student.name+'’s regular schedule saved, but no Pod '+student.name+' qualifies for (by age) is currently staffed for '+describeUncoveredSlots(uncovered)+' — those session(s) couldn\'t be pre-booked yet. Assign coverage on the Schedule tab, then reopen this schedule and save it again.', 9000);
  } else {
    toast(student.name+'’s regular schedule saved'+(durationChanged? ' — now '+student.duration+'-minute sessions' : '')+' — '+made+' upcoming session(s) pre-booked.'+(clearedCount? ' '+clearedCount+' old-schedule session(s) cleared.' : ''));
  }
  state.recurringForm=null;
  render();
}

/* ---------- student holds (front desk only) ---------- */
function openHoldForm(studentId){
  // grantMakeupCredits starts null, not false — a hold that turns out to touch any late-notice
  // session (see holdLateNoticeSessions below) can't save until front desk actually picks one of
  // the two options; see setHoldMakeupChoice.
  state.holdForm={studentId, start:toKey(simNow()), end:toKey(addDays(simNow(),7)), note:'', error:'', grantMakeupCredits:null};
  render();
}
function closeHoldForm(){ state.holdForm=null; render(); }
function setHoldField(field, value){
  state.holdForm[field]=value;
  state.holdForm.error='';
  // The start/end range (or which student it even applies to, now that "+ Hold" on the Holds tab
  // can open this with no student picked yet) decides which sessions (if any) fall inside the 7-day
  // billing-notice window, so any previous answer to "how should those be handled" no longer
  // necessarily applies — clear it and make them confirm again against the new range.
  if(field==='start' || field==='end' || field==='studentId'){ state.holdForm.grantMakeupCredits=null; }
  render();
}
function setHoldMakeupChoice(v){ state.holdForm.grantMakeupCredits=v; state.holdForm.error=''; render(); }
// Sept 2026, per Allie: "if front staff is placing a child on hold without sufficient notice, we
// should be prompted" — front desk placing a hold directly used to never issue make-up credits at
// all, full stop (see applyHold's own comment: "per desk discretion"). Now, whenever the date range
// they've entered would actually cancel a session that falls inside the 7-day-before-the-month
// billing-notice window (monthNoticeOk, same rule the parent-facing hold/cancel requests already
// use), front desk has to explicitly say whether that's fine as-is (notice was actually given some
// other way, payment's being adjusted, no make-up owed) or whether those specific sessions should
// become make-up credits instead — rather than the app silently doing the same "just cancel, no
// credit" thing regardless.
function holdLateNoticeSessions(studentId, startKey, endKey){
  if(!startKey || !endKey) return [];
  return sessions.filter(function(s){
    // Same condition applyHold() itself gates the credit-issuing branch on — a session already tied
    // to an existing credit (s.creditId) always just gets that credit restored regardless of notice
    // (see applyHold's own `if(s.creditId)` branch above the `else if` this mirrors), so it's not
    // actually a "which way do you want to handle this" decision at all — nothing new to choose.
    if(s.studentId!==studentId || s.status!=='scheduled' || s.creditId) return false;
    const dk=toKey(s.date);
    return dk>=startKey && dk<=endKey && !monthNoticeOk(s.date);
  });
}
// Shared by front desk placing a hold directly (saveHold) and front desk approving a parent's
// hold request (approveEnrollmentRequest) — same effect either way, just a different entry point.
// grantMakeupCredits gates whether late-notice credit logic applies at ALL (true only via a parent's
// own request; a front-desk-entered hold never auto-issues these, per desk discretion). When it's
// on, the actual "was there enough notice" check is per SESSION, not once for the whole hold — each
// session is tested against its own billing month's 1st, not just the hold's start date (Sept 2026,
// per Allie: "when approving a hold request that hasn't received enough notice... the missed
// sessions need to be automatically credited as make-up credits. Any sessions that fall in the
// period of sufficient notice, should just be automatically cancelled"). A hold spanning, say, late
// September into November can straddle both: September sessions (this cycle's billing already
// locked in) get a make-up credit, while November sessions (plenty of notice by now) just get a
// plain cancellation — exactly like an ordinary, well-notified hold.
// noticeFrom (Oct 2026, per Allie: "it needs to be done from when they were entered, not when they
// are approved") — for an approved parent request, notice is judged from when they SUBMITTED it, so
// a request sent in time stays in time however long it waits for approval. Defaults to today.
function applyHold(student, start, end, note, grantMakeupCredits, noticeFrom){
  const hold={id:newId()||('hold'+(nextSessionId++)), start:start, end:end, note:(note||'').trim(), creditsIssued:0};
  student.holds=student.holds||[];
  student.holds.push(hold);
  // Free up any of this student's own already-booked sessions that fall inside the hold window —
  // standing or one-off alike — so those Pod slots immediately show as available. A session paid
  // for with a make-up credit gets its credit restored (unless already past its own expiry),
  // same as any other cancelled make-up.
  let cancelledCount=0, madeUpCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || s.status!=='scheduled') return;
    const dk=toKey(s.date);
    if(dk<toKey(hold.start) || dk>toKey(hold.end)) return;
    s.status='cancelled';
    cancelledCount++;
    dbWrite('cancelling a session for a hold', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const credit=findCredit(s.creditId);
      if(credit && toKey(simNow())<=toKey(credit.expiryDate)){
        credit.status='available'; credit.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', credit.id); });
      }
    } else if(grantMakeupCredits && !monthNoticeOk(s.date, noticeFrom)){
      // Named to this specific missed session's own date, not the hold's overall start–end range —
      // a hold that straddles a late-notice month and a well-notified one only issues credits for
      // sessions in the former, so the note should point at the actual session, not the whole hold.
      // issuedDate is likewise the missed SESSION's own date, not simNow() (today, whenever the hold
      // happens to get entered/approved) — same convention every other absence-driven credit already
      // follows (closure cancellations and ordinary excused-absence credits, just above and below),
      // so the Credits section lists it against when it was actually earned, not when it was
      // processed (Sept 2026, per Allie: "when issuing makeup credits for hold periods with
      // insufficient notice... i need it to be issued for the missed sessions, not for when they were
      // put through").
      const issued=s.date, expiry=addMonths(issued,3);
      const c={id:newId()||('c'+(nextCreditId++)), studentId:student.id, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'excused-absence', note:'Missed during a late-notice hold — session on '+fmtShort(s.date), minutes:sessionBaseMinutes(s), minutesUsed:0};
      credits.push(c);
      madeUpCount++;
      dbWrite('issuing a make-up credit (hold)', function(){ return supabaseClient.from('credits').insert({
        id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
        status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note, minutes:c.minutes||null
      }); });
    }
  });
  hold.creditsIssued=madeUpCount;
  // Fired only now, once creditsIssued is actually known — the hold row itself was pushed to local
  // state above (so the UI reflects it immediately) but its remote insert waits until after the
  // cancel/credit sweep so credits_issued lands correct on the very first write, rather than 0
  // followed by a separate update (Sept 2026, per Allie: "how many makeup they got if any" — the new
  // Holds tab's billing-support view).
  dbWrite('placing a hold', function(){ return supabaseClient.from('student_holds').insert({
    id:hold.id, student_id:student.id, start_date:toKey(hold.start), end_date:toKey(hold.end), note:hold.note, credits_issued:hold.creditsIssued
  }); });
  toast(student.name+' placed on hold '+fmtShort(hold.start)+'–'+fmtShort(hold.end)
    +(cancelledCount>0? ' — '+cancelledCount+' session(s) freed up for one-off bookings.' : '.')
    +(madeUpCount>0? ' '+madeUpCount+' make-up credit(s) issued (late-notice hold).' : ''));
  return hold;
}
function saveHold(){
  const f=state.holdForm;
  if(!f.studentId){ f.error='Choose a student.'; render(); return; }
  const student=findStudent(f.studentId);
  if(!f.start || !f.end){ f.error='Choose a start and end date.'; render(); return; }
  if(f.end<f.start){ f.error='End date must be on or after the start date.'; render(); return; }
  // Mirrors the disabled-Confirm-button guard in renderHoldModal — kept here too since this is the
  // actual save path, not just the button state.
  if(holdLateNoticeSessions(student.id, f.start, f.end).length>0 && f.grantMakeupCredits===null){
    f.error='This hold includes a session inside the notice window — choose how to handle it below.';
    render();
    return;
  }
  applyHold(student, new Date(f.start), new Date(f.end), f.note, !!f.grantMakeupCredits);
  state.holdForm=null;
  render();
}
function removeHold(studentId, holdId){
  const student=findStudent(studentId);
  student.holds=(student.holds||[]).filter(function(h){ return h.id!==holdId; });
  dbWrite('removing a hold', function(){ return supabaseClient.from('student_holds').delete().eq('id', holdId); });
  const made=regenerateAllRecurring();
  toast('Hold removed'+(made>0? ' — '+made+' standing session(s) re-booked.' : '.'));
  render();
}

/* ---------- Holds tab (billing support) ---------- */
// Sept 2026, per Allie: "I need a new tab for holds. In there I need to keep track of which
// students are on hold, how many makeup they got if any and how many sessions were cancelled if
// any. This is for billing which i know we havent set up but will still help overall." Every hold
// ever placed (front desk direct or an approved parent request — both funnel through applyHold())
// stays on student.holds forever unless explicitly removed, so this is a straightforward ledger
// over data that already exists, plus one new persisted field (hold.creditsIssued) for the one
// number that genuinely can't be recomputed after the fact — the make-up-credit decision made at
// the moment the hold was placed.
function holdStatus(hold){
  const now=simNow();
  if(toKey(hold.end)<toKey(now)) return 'ended';
  if(toKey(hold.start)<=toKey(now)) return 'active';
  return 'upcoming';
}
// Every student's hold, flattened into one list with its owning student attached, most recent
// start date first — mirrors how the Credits tab flattens every credit across every student rather
// than making front desk hunt through each student's own record one at a time.
function allHoldsFlat(){
  const out=[];
  students.forEach(function(s){
    (s.holds||[]).forEach(function(h){ out.push({student:s, hold:h}); });
  });
  return out.sort(function(a,b){ return toKey(b.hold.start).localeCompare(toKey(a.hold.start)); });
}
// Splits a hold's effect on billing by calendar month. For any day that already has a real session
// row, uses its actual status (ground truth — respects excused absences, other holds, anything else
// that genuinely happened). For a day that doesn't have a row yet — typically because it's further
// out than HORIZON_WEEKS, the pre-booking horizon — falls back to asking studentPlanOn() (the same
// resolver every other schedule feature uses, so a dated plan change mid-hold is honoured exactly
// like everywhere else) whether that day would normally be one of the student's regular sessions at
// all, and whether it falls inside this hold or not.
//
// The fallback is what makes this correct arbitrarily far into the future rather than silently
// under-counting "scheduled" for months beyond the horizon — real occurrences the family is
// genuinely on track for, just not pre-booked into a row yet (Sept 2026, per Allie, after checking
// her own math against a longer hold: "how far into the future does this look? because ... there
// should be more in the scheduled count"). It respects the student's own enrolment start date too,
// so a month that started before they'd even enrolled never counts days from before then.
function holdMonthlyBreakdown(studentId, hold){
  const student=findStudent(studentId);
  const startKey=toKey(hold.start), endKey=toKey(hold.end);
  const startD=new Date(startKey), endD=new Date(endKey);
  const months=[];
  let y=startD.getFullYear(), m=startD.getMonth();
  while(y<endD.getFullYear() || (y===endD.getFullYear() && m<=endD.getMonth())){
    months.push({sortKey:y*12+m, label:new Date(y,m,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'}), cancelled:0, scheduled:0});
    m++; if(m>11){ m=0; y++; }
  }
  const findMonth=function(sortKey){ return months.find(function(x){ return x.sortKey===sortKey; }); };
  const seenDates={}; // dateKey -> true, so the pattern-based fallback below never double-counts a day that already has a real row
  // Collapse every raw session row down to one verdict per calendar date first. Repeated schedule
  // edits (saveRecurringForm, before task #87's fix) can leave several rows on file for the same
  // date — an old 'cancelled' ghost sitting alongside a newer 'attended' or 'scheduled' row, or vice
  // versa. Summing rows directly, or letting "cancelled" automatically win regardless of which row is
  // actually current, both over-count: a genuinely-attended date can still carry a stale cancelled row
  // from before a schedule edit. Real fetched rows carry a createdAt, so when it's available the row
  // most recently WRITTEN for that date is the one that reflects reality (task #253). Rows with no
  // createdAt at all for a given date (older data, or a manually-entered one-off) fall back to the
  // original "cancelled always wins" rule this function used before that fix.
  const rowsByDate={};
  sessions.forEach(function(s){
    if(s.studentId!==studentId) return;
    (rowsByDate[toKey(s.date)]=rowsByDate[toKey(s.date)]||[]).push(s);
  });
  const byDate={};
  Object.keys(rowsByDate).forEach(function(dk){
    const rows=rowsByDate[dk];
    const withTimestamp=rows.filter(function(r){ return !!r.createdAt; });
    const status=withTimestamp.length
      ? withTimestamp.reduce(function(latest,r){ return r.createdAt.getTime()>latest.createdAt.getTime()? r : latest; }).status
      : (rows.some(function(r){ return r.status==='cancelled'; })? 'cancelled' : rows[rows.length-1].status);
    if(status==='cancelled' && dk>=startKey && dk<=endKey){
      // A schedule that's since been edited (e.g. moved from Mon/Wed to Tue-only) can leave a stale
      // 'cancelled' row sitting on a weekday the student no longer really attends — that's not a real
      // session this hold cancelled, so it shouldn't count. Only accept it if the date falls on one of
      // the student's CURRENT regular weekdays as of that date (task #253).
      const parts=dk.split('-');
      const d=new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
      const weekday=WEEKDAY_KEYS[(d.getDay()+6)%7];
      const plan=studentPlanOn(studentId, d);
      if(weekday && (plan.recurring||[]).some(function(r){ return r.weekday===weekday; })){
        byDate[dk]={cancelled:true};
      }
    } else if(status==='scheduled' || status==='attended'){
      byDate[dk]={cancelled:false};
    }
  });
  Object.keys(byDate).forEach(function(dk){
    seenDates[dk]=true;
    const parts=dk.split('-'); // local-safe parse (new Date(dk) parses as UTC midnight and can land on the wrong local day)
    const d=new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    const entry=findMonth(d.getFullYear()*12+d.getMonth());
    if(!entry) return; // outside every month this hold touches — not relevant here
    if(byDate[dk].cancelled) entry.cancelled++;
    else entry.scheduled++;
  });
  months.forEach(function(entry){
    const y2=Math.floor(entry.sortKey/12), m2=entry.sortKey%12;
    const lastDay=new Date(y2, m2+1, 0).getDate();
    for(let day=1; day<=lastDay; day++){
      const date=new Date(y2, m2, day);
      const dk=toKey(date);
      if(seenDates[dk]) continue; // already counted for real above
      if(student.startDate && dk<toKey(student.startDate)) continue; // not enrolled yet
      if(isClosedDate(date)) continue; // centre closed — never a session either way
      const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7]; // undefined on a Sat/Sun — never matches a recurring slot below
      const plan=studentPlanOn(studentId, date); // resolves whichever plan (incl. any dated change) actually governs this date
      if(!(plan.recurring||[]).some(function(r){ return r.weekday===weekday; })) continue; // not one of their regular days
      if(dk>=startKey && dk<=endKey){
        entry.cancelled++; // falls inside THIS hold — would have happened but for it
      } else if(!isStudentOnHold(studentId, date)){
        // Still on track for that same month — not cancelled by this hold (or any other one).
        entry.scheduled++;
      }
    }
  });
  return months;
}

/* ---------- render: shell ---------- */
// Every state change re-renders by rebuilding the whole #app innerHTML from scratch (no virtual
// DOM/diffing) — simple and reliable, but naively doing that on every keystroke would tear down
// and recreate the very <input> the person is typing into, kicking focus out and forcing them to
// click back in before every single character. To avoid that: note which field (and cursor
// position) was focused, rebuild the HTML as usual, then find the same field in the new markup —
// by its position among the other text fields in the same modal, since these forms don't carry
// individual ids — and restore focus/cursor there. A plain click, dropdown change, or button press
// has nothing focused that this applies to, so it's a no-op the rest of the time.
// Speed log (Nov 2026, per Allie: "still a little slow ... two laptops") — front desk logins send one
// summary line every 5 minutes they're in use: how many redraws, average and slowest time, and how
// many sessions are loaded. No student or family details. Table: client_perf_log.
var perfStats={n:0, total:0, max:0, slow:0};
function notePerf(ms){
  perfStats.n++; perfStats.total+=ms; if(ms>perfStats.max) perfStats.max=ms; if(ms>150) perfStats.slow++;
}
function flushPerf(){
  if(!supabaseClient || !currentUser || currentUser.role!=='staff' || !perfStats.n) return;
  const row={role:currentUser.role, device:(navigator.userAgent||'').slice(0,120), renders:perfStats.n,
    avg_ms:Math.round(perfStats.total/perfStats.n), max_ms:Math.round(perfStats.max), slow_renders:perfStats.slow, sessions:sessions.length};
  perfStats={n:0, total:0, max:0, slow:0};
  supabaseClient.from('client_perf_log').insert(row).then(function(){}, function(){});
}
if(typeof window!=='undefined') setInterval(flushPerf, 300000);
function render(){
  const app=document.getElementById('app');
  const active = (typeof document!=='undefined') ? document.activeElement : null;
  // Only text/search/tel/password/textarea reliably support reading/setting a cursor position in
  // every browser — email/number/date inputs throw or silently misbehave on selectionStart in
  // several browsers (observed: cursor resets to 0 on every keystroke, so each new character gets
  // inserted at the very front instead of where it was typed — e.g. typing "send" comes out
  // "dnes"). Those types still get their focus restored below, just not a cursor position.
  const focusableTypes=['text','email','password','number','search','tel','date'];
  const selectableTypes=['text','search','tel','password'];
  const isTextField = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && focusableTypes.indexOf(active.type)>=0));
  const canSelect = active && (active.tagName==='TEXTAREA' || (active.tagName==='INPUT' && selectableTypes.indexOf(active.type)>=0));
  let restore=null;
  if(isTextField && app.contains(active)){
    const scope = (active.closest && active.closest('.modal')) || app;
    const fields = Array.prototype.slice.call(scope.querySelectorAll('input, textarea'));
    const idx = fields.indexOf(active);
    if(idx>=0){
      restore={ inModal: scope!==app, idx:idx, start:null, end:null };
      if(canSelect){
        try{ restore.start=active.selectionStart; restore.end=active.selectionEnd; }catch(e){}
      }
    }
  }
  // Keep the reader exactly where they were (Oct 2026, per Allie: "it keeps scrolling me halfway
  // down"). render() replaces the whole page — after most clicks, and on the 30s background refresh
  // — and the browser's scroll anchoring then latches onto whatever element it can find in the new
  // page, which can land anywhere. Remember the page's own scroll position and an open pop-up's
  // (.overlay scrolls independently) and put both back afterwards. Scroll anchoring is also switched
  // off in the CSS (overflow-anchor:none) so it can't fight this.
  const pageY=window.pageYOffset||document.documentElement.scrollTop||0;
  const prevOverlay=app.querySelector('.overlay');
  const overlayY=prevOverlay? prevOverlay.scrollTop : 0;
  // Fresh ratio numbers every screen update, so a shift edit (times, instructor, one-off cover)
  // shows straight away in the Availability Lookup and parents' options (Oct 2026).
  clearRatioCache();
  const perfStart=performance.now();
  app.innerHTML = renderTop() + renderTabs() + renderRole() + (state.toast? '<div class="toast">'+state.toast+'</div>':'') + renderFooter();
  notePerf(performance.now()-perfStart);
  if(Math.abs((window.pageYOffset||document.documentElement.scrollTop||0)-pageY)>1) window.scrollTo(0, pageY);
  const newOverlay=app.querySelector('.overlay');
  if(newOverlay && prevOverlay && overlayY) newOverlay.scrollTop=overlayY;
  if(restore){
    const scope = restore.inModal ? app.querySelector('.modal') : app;
    const el = scope && scope.querySelectorAll('input, textarea')[restore.idx];
    if(el){
      // {preventScroll:true} matters here (Sept 2026 fix — "click anywhere and the page jumps
      // halfway down on its own"): focus() on an element outside the current viewport otherwise
      // scrolls it into view as a side effect. That's fine right after a keystroke (the field IS
      // the viewport), but this restore also fires after a click on something else entirely —
      // clicking a non-focusable control (a collapsible section header, a plain label) never blurs
      // whatever text field was last focused, e.g. the check-in search box, so `active` above is
      // still that field even though the user's attention has clearly moved on. Without
      // preventScroll, every one of those unrelated clicks yanked the page back to wherever that
      // stale field happened to be sitting.
      el.focus({preventScroll:true});
      if(restore.start!=null && restore.end!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(restore.start, restore.end); }catch(e){}
      }
    }
  }
}

// Sept 2026, per Allie: "kicked out of dropdown boxes if I don't make a selection quickly" — a
// background refresh (the 500ms live-sync debounce after ANY other login's change, the 30s
// heartbeat, or the 30s checked-in-countdown tick, all below) used to call render() unconditionally.
// render() rebuilds the whole page from scratch, and while it knows how to put a text field's own
// focus/cursor back afterward, a <select> has no such recovery — recreating it while its native
// options list is open just closes that list outright, with nothing to reopen it. None of these
// three background refreshes need to repaint the screen the instant fresh data arrives — only to
// have it ready for whatever render happens next. So they call this instead of render() directly: it
// still fetches/applies the new data every time, just skips the visual rebuild while the person has
// an input, textarea, or select focused (mid-typing, or an open dropdown), and paints normally again
// on their very next interaction.
function isEditingAField(){
  const active=(typeof document!=='undefined') ? document.activeElement : null;
  return !!(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT'));
}
function renderUnlessEditing(){
  if(isEditingAField()) return;
  render();
}

/* ---------- STAFF ---------- */
function podCoverageSummary(podId, weekday, date){
  const dayOv=dayOverrideFor(podId, toKey(date));
  if(dayOv) return (dayOv.instructorId? findInstructor(dayOv.instructorId).name : 'Unassigned')+' '+rangeLabel(dayOv.start,dayOv.end-dayOv.start)+' · one-off';
  const blocks=podBlocksForDay(podId, weekday);
  if(blocks.length===0) return 'Unassigned';
  return blocks.map(function(b){
    const instrId=blockInstructorOn(b, date);
    return (instrId? findInstructor(instrId).name : 'Unassigned')+' '+blockRangeLabel(b);
  }).join(' → ');
}

// At-a-glance "who's covering what" — every Pod down the side, Mon-Fri across the top, for
// whichever week the Schedule tab is currently showing (This week / Next week toggle). Reuses the
// exact same podCoverageSummary() the day-by-day pod cards below already show one pod/day at a
// time, just laid out so the whole week's coverage (or any gaps in it) is visible without clicking
// through every day. A cell with no instructor assigned at all is called out in red, since that's

// The "regular" companion to the grid above — Mon-Fri column headers with no dates, so it doesn't

function renderRosteredShiftsGrid(){
  const today=simNow();

    + WEEKDAY_KEYS.map(function(wd){ return '<th>'+wd+'</th>'; }).join('')

    html+='<tr><td><b>'+pod.name+'</b></td>';

      const occurrence=nextRegularOccurrence(wd, today);

    });

// Total expected PHYSICAL headcount across the whole centre, bucketed into 15-min intervals across
// the afternoon (Sept 2026, per Allie: "one more section that shows me the number of kids expected
// in the centre split into 15 min intervals"). A staffing-planning view, not a live board — every
// non-cancelled session overlapping a given 15-min slot counts toward it — Online sessions are
// deliberately excluded, since this is specifically about who's physically walking in the door (not
// the day's total enrolment; Online already has its own occupancy badges elsewhere).
//
// Per-week, real calendar dates (Sept 2026, per Allie: "i also want expected headcount to be per
// week" — confirmed all 5 weekday rows should anchor to the SAME real calendar week, not each
// weekday's own independent next-occurrence date, which could straddle two different weeks
// depending on what day "from" happened to be). Mirrors the Today tab's day-by-day Schedule grid's
// own "This week"/"Next week" mechanism (state.weekOffset/getMonday/setWeek) exactly, but with its
// own dedicated state.expectedHeadcountWeekOffset field so the two week pickers move independently.
function renderExpectedHeadcountGrid(){
  const now=simNow();
  const monday=addDays(getMonday(now), state.expectedHeadcountWeekOffset*7);
  const weekDates=[0,1,2,3,4].map(function(i){ return addDays(monday,i); });
  const slots=[];
  for(let t=CENTER_OPEN; t<CENTER_CLOSE; t+=15) slots.push(t);

    + slots.map(function(t){ return '<th>'+minToLabel(t)+'</th>'; }).join('')
    + '</tr>';
  weekDates.forEach(function(date){
    const wd=WEEKDAY_KEYS[(date.getDay()+6)%7];

    html+='<tr><td><b>'+wd+'</b> <span class="small muted">'+date.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></td>';
    slots.forEach(function(t){
      const count=dayList.filter(function(s){ return s.start<t+15 && t<s.start+s.duration; }).length;
      html+='<td class="'+(count===0?'muted':'')+'" style="text-align:center">'+count+'</td>';
    });

  });

}
function setExpectedHeadcountWeek(offset){
