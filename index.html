<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Brand palette below is Five Dock's own design system (extracted from the
     Claude Design homepage export): red-500/600/700 as the brand accent family, a warm
     ink/paper neutral scale (not cool grey/blue), and Plus Jakarta Sans for display/heading
     type paired with Inter for body copy. Every existing selector below is unchanged — only
     the token VALUES were re-themed, so no markup or JS needed to change. */
  :root{
    --bg:#faf9f7; --surface:#ffffff; --surface-2:#f1efec; --border:#e3e0da; --text:#1a1a1a; --text-muted:#78716f;
    --primary:#ef3e33; --primary-text:#ffffff; --accent:#1a1a1a; --accent-bg:#f1efec;
    --success:#2f9e58; --success-bg:#e7f5ea; --danger:#b5121b; --danger-bg:#fce6e4;
    --warning:#9a640c; --warning-bg:#fdf2e0; --info:#4a4547; --info-bg:#e3e0da; --muted-bg:#e3e0da;
    --online:#1a6fb0; --online-bg:#dcefff; --purple:#7c3aed; --purple-bg:#f0e9fe;
    --radius:10px; --shadow:0 1px 2px rgba(24,21,22,.08), 0 4px 16px rgba(24,21,22,.06);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171513; --surface:#211e1b; --surface-2:#2b2723; --border:#3c3630; --text:#f5f3f0; --text-muted:#b0a89f;
      --primary:#ff5c50; --primary-text:#1a1a1a; --accent:#e8e2da; --accent-bg:#2b2723;
      --success:#57c37e; --success-bg:#1c3325; --danger:#ff6b61; --danger-bg:#3a1815;
      --warning:#f0b94a; --warning-bg:#3a2c10; --info:#b0a89f; --info-bg:#2b2723; --muted-bg:#2b2723;
      --online:#7fc4f5; --online-bg:#1b3a4a; --purple:#c4a3fb; --purple-bg:#2d2140;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171513; --surface:#211e1b; --surface-2:#2b2723; --border:#3c3630; --text:#f5f3f0; --text-muted:#b0a89f;
    --primary:#ff5c50; --primary-text:#1a1a1a; --accent:#e8e2da; --accent-bg:#2b2723;
    --success:#57c37e; --success-bg:#1c3325; --danger:#ff6b61; --danger-bg:#3a1815;
    --warning:#f0b94a; --warning-bg:#3a2c10; --info:#b0a89f; --info-bg:#2b2723; --muted-bg:#2b2723;
    --online:#7fc4f5; --online-bg:#1b3a4a; --purple:#c4a3fb; --purple-bg:#2d2140;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }
  .wrap{ max-width:1080px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ margin:0 0 4px; font-family:var(--font-display); font-weight:800; }
  h1{ font-size:1.3rem; }
  h2{ font-size:1.05rem; font-weight:700; }
  h3{ font-size:.95rem; margin-bottom:2px; font-weight:700; }
  p{ margin:0 0 10px; color:var(--text-muted); font-size:.88rem; line-height:1.5; }
  .muted{ color:var(--text-muted); }
  .top{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; }
  /* Logo has a white background baked into the source file, so it gets its own white chip —
     keeps it looking intentional against the page background in both light and dark mode. */
  .brand-logo{ display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .brand-logo img{ height:44px; width:auto; display:block; background:#ffffff; padding:6px 10px; border-radius:8px; box-shadow:var(--shadow); }
  .mathq-logo img{ height:50px; }
  .footer-logo{ justify-content:center; margin-bottom:10px; }
  .login-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:360px; text-align:center; }
  .login-card .brand-logo{ justify-content:center; }
  .login-card label{ text-align:left; margin-top:10px; }
  .login-card .btn{ width:100%; margin-top:16px; }
  .pill{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 10px; }
  .pill.online{ background:var(--online-bg); border-color:var(--online); color:var(--online); }

  .tabs{ display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; width:max-content; margin-bottom:16px; }
  .tab{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:.85rem; font-weight:700; font-family:var(--font-display); color:var(--text-muted); cursor:pointer; }
  .tab.active{ background:var(--primary); color:var(--primary-text); }

  /* Front desk's own internal section tabs (Sept 2026, per Allie: "front centre view to have each
     section as a separate tab maybe instead of collapsible sections") — deliberately a squarer,
     slightly less prominent pill than .tabs/.tab above (which switches between Front Desk/
     Instructor/Parent) so the two navigation levels stay visually distinct when stacked. Wraps
     onto a second line on narrow screens rather than overflowing. */
  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:4px; margin-bottom:16px; }
  .subtab{ border:none; background:transparent; padding:7px 14px; border-radius:7px; font-size:.82rem; font-weight:600; font-family:var(--font-display); color:var(--text-muted); cursor:pointer; }
  .subtab.active{ background:var(--primary); color:var(--primary-text); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  /* Collapsible front-desk sections: clicking a section's own title toggles it — everything in the
     card except the header row (buttons included) just gets hidden via CSS, so no section's markup
     had to be restructured to support this. */
  .sec-toggle{ cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:6px; }
  .sec-toggle .chev{ display:inline-block; transition:transform .15s ease; font-size:.75em; }
  .card.collapsed .chev{ transform:rotate(-90deg); }
  .card.collapsed > *:not(.card-head){ display:none !important; }
  .card.collapsed{ margin-bottom:8px; }

  .clock{ display:flex; align-items:center; gap:8px; font-size:.78rem; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 14px; box-shadow:var(--shadow); }
  .clock b{ color:var(--text); }
  .btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:6px 12px; border-radius:6px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:var(--font); }
  .btn:hover{ filter:brightness(0.97); }
  .btn.primary{ background:var(--primary); color:var(--primary-text); border-color:transparent; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ background:var(--danger-bg); color:var(--danger); border-color:transparent; }
  .btn.success{ background:var(--success-bg); color:var(--success); border-color:transparent; }
  .btn.sm{ padding:4px 9px; font-size:.72rem; border-radius:4px; }
  .btn:disabled{ opacity:.45; cursor:default; }

  .daypicker{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .daybtn{ border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:6px 12px; font-size:.78rem; cursor:pointer; color:var(--text); }
  .daybtn.active{ background:var(--primary); color:var(--primary-text); border-color:transparent; }
  .daybtn .d2{ display:block; font-size:.68rem; color:inherit; opacity:.75; }

  .pod-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; }
  .pod-card.singles{ border-style:dashed; }
  .pod-card .card-head{ margin-bottom:8px; }
  .sess-chip{ display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--border); border-left:4px solid var(--info); border-radius:8px; padding:7px 10px; margin-bottom:6px; font-size:.8rem; flex-wrap:wrap; }
  .sess-chip .time{ font-weight:700; display:inline-block; min-width:118px; }
  .sess-chip.status-attended{ border-left-color:var(--success); }
  .sess-chip.status-no-show{ border-left-color:var(--danger); background:var(--danger-bg); }
  .sess-chip.status-cancelled{ border-left-color:var(--border); opacity:.55; }
  .sess-chip.handoff{ border-left-color:var(--accent); }
  .sess-chip .actions{ display:flex; gap:4px; flex-wrap:wrap; }

  table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  th{ text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); border-bottom:1px solid var(--border); padding:6px 8px; }
  td{ padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }

  /* Make-up credits list (Nov 2026): search + filters, one row per child, ⋯ menu per credit. */
  .credit-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 6px; }
  .credit-toolbar input{ flex:1 1 220px; margin:0; }
  .credit-toolbar select{ flex:0 0 auto; width:auto; margin:0; }
  .credit-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .chip-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:4px 11px; font-size:.75rem; cursor:pointer; font-family:inherit; }
  .chip-btn .n{ color:var(--text-muted); font-weight:700; margin-left:2px; }
  .chip-btn.on{ background:var(--info-bg); border-color:var(--info); color:var(--info); font-weight:700; }
  .chip-btn.on .n{ color:var(--info); }
  tr.credit-kid{ cursor:pointer; }
  tr.credit-kid:hover td{ background:var(--muted-bg); }
  tr.credit-kid td{ vertical-align:middle; }
  tr.credit-kid .chev{ display:inline-block; width:12px; color:var(--text-muted); }
  tr.credit-kid.open td{ border-bottom:none; }
  tr.credit-kid-detail > td{ padding:0 0 10px 22px; }
  tr.credit-kid-detail table{ background:var(--muted-bg); border-radius:8px; }
  td.credit-actions{ white-space:nowrap; text-align:right; }
  .row-menu{ display:inline-block; position:relative; margin-left:4px; vertical-align:middle; }
  .row-menu > summary{ list-style:none; cursor:pointer; padding:2px 8px; border:1px solid var(--border); border-radius:6px; font-weight:700; line-height:1.2; background:var(--surface); }
  .row-menu > summary::-webkit-details-marker{ display:none; }
  .row-menu-list{ position:absolute; right:0; top:calc(100% + 4px); z-index:20; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); min-width:220px; padding:4px; text-align:left; }
  .row-menu-list button{ display:block; width:100%; text-align:left; background:none; border:none; padding:7px 10px; border-radius:6px; font-size:.8rem; cursor:pointer; color:var(--text); font-family:inherit; }
  .row-menu-list button:hover{ background:var(--muted-bg); }
  .row-menu-list button.danger{ color:var(--danger); }
  .inline-help{ display:inline; }
  .inline-help > summary{ display:inline; font-size:inherit; cursor:pointer; color:var(--info); text-decoration:underline; }
  .inline-help[open]{ display:block; margin-top:6px; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:.7rem; font-weight:700; }
  .badge.available{ background:var(--success-bg); color:var(--success); }
  .badge.soon{ background:var(--warning-bg); color:var(--warning); }
  .badge.expired{ background:var(--muted-bg); color:var(--text-muted); }
  .badge.booked{ background:var(--info-bg); color:var(--info); }
  .badge.completed{ background:var(--muted-bg); color:var(--text-muted); }
  .badge.full{ background:var(--danger-bg); color:var(--danger); }
  .badge.handoff{ background:var(--accent-bg); color:var(--accent); }
  .badge.hold{ background:var(--warning-bg); color:var(--warning); }
  /* Distinct from .badge.hold's amber "pausing" look — stopping outright is the more final of the
     two, so it borrows the same red used for "Full"/danger elsewhere (Sept 2026, per Allie: "when a
     student stops attending, much like when they are on hold, writing under name finishing date"). */
  .badge.stopping{ background:var(--danger-bg); color:var(--danger); }
  /* A brand-new student's very first day (Sept 2026, per Allie: "when enroling a new student, i need
     it to let me set start date... i then need it to come up as a warning... i also want it to say
     first day during their first session when sitting with an instructor") — its own colour so it
     reads as a friendly heads-up, distinct from the hold/stopping badges above. */
  .badge.firstday{ background:var(--purple-bg); color:var(--purple); }
  /* One instructor's own custom pack-up countdown (Sept 2026, per Allie: "orange at 15 mins, red at
     5 minutes, purple from 0" — for Harry only, see instr.packUpCustomColors). The orange/red tiers
     reuse .badge.soon/.badge.full above (already the right colours); this is the one genuinely new
     tier, for "leaving now" and overdue. */
  .badge.pack-purple{ background:var(--purple-bg); color:var(--purple); }

  .banner{ border-radius:8px; padding:10px 12px; font-size:.8rem; margin-bottom:12px; display:flex; gap:8px; align-items:flex-start; }
  .banner.warn{ background:var(--warning-bg); color:var(--warning); }
  .banner.info{ background:var(--info-bg); color:var(--info); }
  .banner.danger{ background:var(--danger-bg); color:var(--danger); }
  .banner.accent{ background:var(--accent-bg); color:var(--accent); }
  .banner.parent-announcement{ font-size:.95rem; display:block; padding:12px 14px; }
  .banner.parent-announcement a{ color:inherit; font-weight:700; }

  .avail-grid{ display:grid; grid-template-columns: 90px repeat(4,1fr); gap:6px; }
  /* Who's here right now board (Sept 2026) — same look as .avail-grid (grid + colored .avail-cell
     blocks) but with a variable column count (one per occupied Pod, computed inline per render)
     rather than a fixed 4, so it isn't affected by .avail-grid's own mobile breakpoint below. */
  .liveboard-grid{ display:grid; gap:6px; }
  .avail-cell{ border:1px solid var(--border); border-radius:8px; padding:8px 4px; text-align:center; font-size:.72rem; background:var(--surface-2); color:var(--text-muted); }
  .avail-cell.on{ background:var(--success-bg); color:var(--success); border-color:var(--success); font-weight:700; }
  .avail-cell.full-cell{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); font-weight:700; }
  .avail-cell.opening-cell{ background:var(--warning-bg); color:var(--warning); border-color:var(--warning); font-weight:700; }
  .avail-cell.nostaff-cell{ font-style:italic; }
  .avail-cell.online-cell{ background:var(--online-bg); color:var(--online); border-color:var(--online); font-weight:700; }
  .cal-head{ font-size:.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; padding:6px 4px; }
  .cal-row-label{ display:flex; flex-direction:column; justify-content:center; font-size:.78rem; font-weight:600; padding:6px; background:var(--surface-2); border-radius:8px; }

  .login-box{ max-width:340px; margin:20px auto; }
  input[type=email], input[type=password], input[type=text], input[type=date], select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:.85rem; margin-bottom:10px;
  }
  label{ font-size:.75rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px; }

  /* align-items:flex-start + margin:auto (Oct 2026, per Allie: "the pop-up box sits too high on the
     page") — plain centring pushed the top of a pop-up taller than the screen (e.g. Add student)
     above the scrollable area, out of reach. Auto margins still centre short pop-ups, but a tall one
     now starts at the top and scrolls normally. */
  .overlay{ position:fixed; inset:0; background:rgba(10,12,16,.45); display:flex; align-items:flex-start; justify-content:center; padding:16px; z-index:50; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); max-width:460px; width:100%; padding:18px 20px; border:1px solid var(--border); margin:auto; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  /* Oct 2026: whole-page re-renders confuse the browser's scroll anchoring (it can jump halfway down) — render() restores the scroll position itself instead. */
  html, body{ overflow-anchor:none; }
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.8rem; box-shadow:var(--shadow); z-index:60; max-width:80vw; text-align:center; }

  .slot-opt{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:.8rem; }
  .credit-card{ border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .credit-card.st-available, .credit-card.st-soon{ border-left-color:var(--success); }
  .credit-card.st-booked{ border-left-color:var(--info); }
  .credit-card.st-expired, .credit-card.st-completed{ border-left-color:var(--text-muted); }
  .credit-card .row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .small{ font-size:.72rem; }
  .empty-note{ font-size:.8rem; color:var(--text-muted); padding:6px 0 10px; }

  /* ---------- Parent dashboard restyle ---------- */
  .parent-card{ padding-top:18px; padding-bottom:18px; }
  .parent-header{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .avatar-circle{ width:50px; height:50px; border-radius:50%; background:var(--accent-bg); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; flex-shrink:0; letter-spacing:.02em; }
  .parent-header h2{ margin:0; }
  .section-label{ font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:20px 0 10px; }
  .parent-card > .section-label:first-of-type{ margin-top:4px; }
  .session-list{ display:flex; flex-direction:column; gap:8px; }
  .session-row{ display:flex; align-items:center; gap:14px; border:1px solid var(--border); border-radius:10px; padding:10px 14px; flex-wrap:wrap; }
  .session-date-chip{ width:50px; text-align:center; flex-shrink:0; }
  .session-date-chip .sd-day{ font-size:.62rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); }
  .session-date-chip .sd-num{ font-size:1.15rem; font-weight:800; line-height:1.1; }
  .session-row .session-main{ flex:1; min-width:140px; }
  .makeup-summary{ display:flex; gap:24px; align-items:center; flex-wrap:wrap; border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; background:var(--surface-2); }
  .makeup-count{ font-size:2rem; font-weight:800; color:var(--accent); line-height:1; }
  .makeup-count-label{ font-size:.72rem; color:var(--text-muted); }
  .footer-note{ font-size:.72rem; color:var(--text-muted); margin-top:24px; text-align:center; }
  .recurring-row{ margin-bottom:8px; }
  .hours-row{ display:flex; align-items:flex-end; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .hours-row .day-toggle{ flex:0 0 108px; }
  .hours-row .day-toggle label.chk{ display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:400; color:var(--text); }
  .hours-row > div:not(.day-toggle){ flex:1; min-width:110px; }
  .block-row{ display:flex; align-items:flex-end; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .block-row > div{ flex:1; min-width:100px; }
  @media (max-width:640px){
    .avail-grid{ grid-template-columns: 60px repeat(4,1fr); }
    .row2{ flex-direction:column; }
  }
</style>

<div class="wrap" id="app"></div>

<!-- Only reachable from a real browser hitting the real internet — harmless to leave in when this
     file is opened as a Claude Artifact preview or run through the Node smoke tests, since both of
     those environments simply won't have `window.supabase`, and the app below falls back to its
     built-in demo data whenever that's the case (see the LIVE-MODE check at the bottom of the
     script). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ---------- Supabase (live mode) ---------- */
// Publishable/anon key only — safe to ship in browser code, since every table it can reach is
// still governed by the Row Level Security policies in supabase_schema.sql. The service_role/
// secret key must NEVER appear here or anywhere else client-side.
// Supabase appends "#access_token=...&type=invite" or "...&type=recovery" to the redirect URL for
// an invite link or a password-reset link. Captured as the very first thing this script does —
// before window.supabase.createClient() runs and has any chance to process/clear the URL — so it's
// reliable regardless of exactly which auth event name a given supabase-js version fires for each
// case. (This was previously computed after createClient() ran, which let the SDK occasionally win
// the race and strip the hash first, silently skipping the "set your password" screen entirely.)
var AUTH_REDIRECT_TYPE = (function(){
  if(typeof window==='undefined' || !window.location || !window.location.hash) return null;
  // Must require "&" or "#" right before "type=" — the hash also contains "token_type=bearer",
  // and an unanchored /type=(\w+)/ matches the tail of "token_type" first (since it appears
  // earlier in the string), silently capturing "bearer" instead of the real "invite"/"recovery".
  const m=window.location.hash.match(/[#&]type=(\w+)/);
  return m? m[1] : null;
})();

// Scanner-proof invite / reset links (Oct 2026). Work email systems (Microsoft "Safe Links" etc.)
// open every link in an email to check it — and an invite/reset link only works ONCE, so the
// scanner used it up and the parent then got "invalid or has expired" and a plain sign-in screen
// (auth logs, 2026-10-12: a Microsoft server opened a parent's reset link 23 seconds before she
// did). The Invite and Reset-password email templates now link to the app with
// ?token_hash=...&type=invite|recovery instead of a one-click sign-in link; opening the page doesn't
// use the link up — it's only spent when the person actually submits their new password
// (setNewPassword -> verifyOtp), which a scanner never does. EMAIL_LINK keeps that token.
var EMAIL_LINK = (function(){
  if(typeof window==='undefined' || !window.location) return null;
  const q=new URLSearchParams(window.location.search||'');
  const th=q.get('token_hash'), t=q.get('type');
  return (th && (t==='invite' || t==='recovery'))? {tokenHash:th, type:t} : null;
})();
// A link that was already used/expired comes back with #error_code=otp_expired (old-style links).
var AUTH_LINK_ERROR = (function(){
  if(typeof window==='undefined' || !window.location || !window.location.hash) return null;
  const m=window.location.hash.match(/[#&]error_code=([\w-]+)/);
  return m? m[1] : null;
})();

// A real UUID when live (so a newly-created record's local id already matches what Postgres will
// store — no reconciliation needed), or null in demo/offline mode so callers fall back to the
// original 'sess'+(nextSessionId++) style counters unchanged.
function newId(){ return (currentUser && typeof crypto!=='undefined' && crypto.randomUUID) ? crypto.randomUUID() : null; }

// Fire-and-forget write to Supabase: the UI already updated optimistically (same as the old
// local-only behaviour), this just persists it in the background. A failed write is logged and
// surfaced with a toast, but — for this first pass — doesn't roll back the local change; if that
// ever matters in practice (e.g. someone's offline), it's the next thing to harden.
//
// Retries once, after a short pause, before giving up (Sept 2026, per Allie: "couldn't save to
// server filling in previously unassigned standing session"). That specific write comes from
// regenerateAllRecurring()'s self-heal pass (see generateRecurringSessions' "dup.podId==null"
// branch) — fixing one Pod/rostered-shift gap can make MANY previously-unassigned occurrences
// across several weeks/students all self-heal at once, each firing its own fire-and-forget write
// in the same synchronous loop, which can burst past what a transient connection hiccup or a brief
// rate-limit can absorb. A single retry after a short pause is cheap insurance against exactly that
// kind of momentary blip, without adding real complexity — genuinely down/broken writes still
// surface the toast after the second attempt, same as before.
// onDuplicateConflict (optional 4th param) — Sept 2026, per Allie: "i just assigned a closed day for
// public holiday, and every kid got 2 make up for the same day". Root cause: two staff tabs open at
// once (the app explicitly supports this — see subscribeToLiveUpdates()) can each independently run
// regenerateAllRecurring() around the same moment; each tab only checks ITS OWN in-memory `sessions`
// array for an existing occurrence before inserting a new one, so if neither tab has yet heard about
// the other's brand-new insert (live sync is debounced ~500ms plus network time), both insert a real
// standing session for the exact same student/date/slot — a true duplicate that a closure two ticks
// later then dutifully cancels and credits twice. A new partial unique index on `sessions` (see
// add_sessions_dup_guard.sql) now makes the database itself refuse the LOSING tab's insert with a
// Postgres unique-violation (code 23505) instead of silently accepting a second row. That's not a
// real failure — the winning tab's row already covers this occurrence — so a caller can pass
// onDuplicateConflict to handle it quietly (clean up its own optimistic local state) instead of
// retrying (which would just fail again forever) or showing the generic "couldn't save" toast.
// Oct 2026: also 23P01 — the sessions_no_student_overlap exclusion constraint
// (add_sessions_no_overlap_guard.sql) refusing a session that overlaps one the student already has
// that day. Typically a device that hadn't yet picked up a regular-time change re-booking the OLD
// time (Noelle Sukkar 15:15 alongside her new 15:35, and ~58 others). Unlike 23505 it's retried once
// first: within this same tab, a time change fires its "cancel old session" and "insert new session"
// writes concurrently, so the insert can briefly land before its own cancel has committed. Only if
// the retry is refused too is it treated as the benign, stale-copy case.
function isBenignConflict(err, isRetry){
  return !!err && (err.code==='23505' || (err.code==='23P01' && isRetry));
}
function dbWrite(label, promiseFn, _isRetry, onDuplicateConflict){
  if(!supabaseClient || !currentUser) return; // demo/offline mode — local-only, exactly as before
  promiseFn().then(function(r){
    if(r && r.error){
      if(onDuplicateConflict && isBenignConflict(r.error, _isRetry)){ console.log('Benign duplicate-write conflict ('+label+') — another tab already created this.'); onDuplicateConflict(); return; }
      console.error('Supabase write failed ('+label+'):', r.error);
      if(!_isRetry){ setTimeout(function(){ dbWrite(label, promiseFn, true, onDuplicateConflict); }, 1500); return; }
      toast("Couldn't save to the server — "+label+'. Your change is visible here but may not have saved.');
    }
  }).catch(function(err){
    if(onDuplicateConflict && isBenignConflict(err, _isRetry)){ console.log('Benign duplicate-write conflict ('+label+') — another tab already created this.'); onDuplicateConflict(); return; }
    console.error('Supabase write failed ('+label+'):', err);
    if(!_isRetry){ setTimeout(function(){ dbWrite(label, promiseFn, true, onDuplicateConflict); }, 1500); return; }
    toast("Couldn't save to the server — "+label+'. Your change is visible here but may not have saved.');
  });
}

/* ---------- date + time helpers ---------- */
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); const day=x.getDate(); x.setMonth(x.getMonth()+n); if(x.getDate()!==day) x.setDate(0); return x; }
function toKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtShort(d){ return d.toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'}); }
function fmtLong(d){ return d.toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
function getMonday(d){ const x=new Date(d); const day=x.getDay(); const diff = x.getDate()-day+(day===0?-6:1); x.setDate(diff); return x; }
function daysUntil(from,to){ return Math.round((new Date(toKey(to))-new Date(toKey(from)))/86400000); }
// Parent-submitted hold/cancel-enrolment requests (5.20) need at least a week's notice before the
// 1st of whichever month the requested date falls in — billing runs at the start of the month, so
// front desk needs that lead time to adjust it. A hold spanning multiple months only needs
// checking against its START date: if that month's 1st is far enough out, every later month
// touched by the hold is automatically fine too.
var MONTH_NOTICE_DAYS=7;
function monthNoticeOk(date, from){
  const monthStart=new Date(date.getFullYear(), date.getMonth(), 1);
  return daysUntil(from||simNow(), monthStart) >= MONTH_NOTICE_DAYS;
}
// The soonest date a parent-submitted request could legally take effect right now — used both to
// validate a submission and to default the date picker to something that will actually be
// accepted, rather than making them guess-and-check.
function earliestMonthNoticeDate(){
  const now=simNow();
  let monthStart=new Date(now.getFullYear(), now.getMonth()+1, 1);
  while(daysUntil(now, monthStart) < MONTH_NOTICE_DAYS){ monthStart=new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 1); }
  return monthStart;
}
// A permanent day/time change is a completely different kind of request from a hold or cancelling
// enrolment (Sept 2026, per Allie: "the 1 week only applies to holds and cancellations, to change
// days and times no notice required (other than 10am)") — it has no billing-cycle impact at all, so
// none of MONTH_NOTICE_DAYS applies here. The only limit is same-day: once it's past this cutoff,
// front desk and instructors have already planned around today's existing session list, so a change
// can no longer take effect today — the earliest becomes tomorrow instead. Uses the real wall-clock
// time of day (not simNow(), which only affects the simulated demo-clock DATE), same convention as
// every other same-day cutoff in the app (e.g. checkInMaxArrival()).
var TIME_CHANGE_SAME_DAY_CUTOFF_MIN=600; // 10:00am
function earliestTimeChangeDate(){
  return nowMinutesOfDay()<TIME_CHANGE_SAME_DAY_CUTOFF_MIN ? simNow() : addDays(simNow(), 1);
}
function timeChangeDateOk(date){
  return toKey(date) >= toKey(earliestTimeChangeDate());
}
function sameDay(a,b){ return toKey(a)===toKey(b); }

// Which "school-year cohort" a date belongs to, for automatic year promotion. Approximates the
// Australian school year starting Feb 1 — a date in January still belongs to the previous
// cohort, since the new school year hasn't started yet. (The exact cutoff date is a policy
// decision for the real build, e.g. matching term-1 start; Feb 1 is a reasonable default.)
function schoolYearIndex(date){
  const y=date.getFullYear();
  const cutoff=new Date(y,1,1); // Feb 1
  return date<cutoff ? y-1 : y;
}

function timeStrToMin(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function minToTimeStr(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function minToLabel(min){
  let h=Math.floor(min/60), m=min%60;
  const period = h>=12? 'pm':'am';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+(m? ':'+String(m).padStart(2,'0') : '')+period;
}
// End capped at closing (Oct 2026, per Allie: "if a child is scheduled to finish after 7, it should still only ever say 7pm").
function rangeLabel(start,duration){ return minToLabel(start)+'–'+minToLabel(Math.min(start+duration, CENTER_CLOSE)); }
// A Pod shift block's own range label — same as rangeLabel(), but a block flagged closesLate
// (Sept 2026, per Allie: "add an extra time after 7pm called Close", extended from front-desk staff
// shifts to Pod shift blocks too) always shows "Close" instead of its numeric end time. closesLate
// is purely a display flag — the block's own `end` is always forced to CENTER_CLOSE underneath (see
// setPodBlockTime()), so every capacity/coverage calculation elsewhere is completely unaffected and
// needs no changes of its own.
function blockRangeLabel(b){ return b.closesLate? minToLabel(b.start)+'–Close' : rangeLabel(b.start, b.end-b.start); }
// e.g. 90 -> "1h 30m", 60 -> "1h", 45 -> "45m". Used for the attendance log's per-instructor time
// summary — total minutes taught rarely lands on a clean hour, so this always reads naturally.
function hoursMinutesLabel(mins){
  const h=Math.floor(mins/60), m=mins%60;
  if(h===0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}

// efficient shift durations?"). Hard rules she gave directly: a student may wait up to
// SHIFT_WAIT_TOLERANCE minutes for their instructor to arrive (so a shift needn't start right when
// the first booking does; raised from 10 to 15 minutes — "change the 10min alone rule to 15 min
// alone"), every shift must still run at least 2 hours regardless of how short the actual demand
// window is, and an instructor may run over the 1:8 ratio by one kid for up to
// INSTRUCTOR_OVERLOAD_TOLERANCE_MIN minutes — "an instructor can be overload for about 10 min to
// help pack up another kid" — so a departing kid overlapping a newly-arriving one for a brief
// handover doesn't by itself require a second instructor. (The "Suggested shift durations" section
// that used to apply these constants was removed Sept 2026, per Allie — these are now unused
// leftover constants, kept in case a similar staffing-suggestion feature comes back.)
var SHIFT_WAIT_TOLERANCE=15; // minutes a student may wait for their instructor to arrive
var MIN_SHIFT_MINUTES=120;   // minimum shift length (2 hours)
var INSTRUCTOR_OVERLOAD_TOLERANCE_MIN=10; // minutes an instructor may briefly run over the 1:8 ratio by one kid, to help a departing kid pack up while a new one settles in
// A brief lull in demand at a given instructor level (e.g. a dip from 5 needed down to 2, then back
// up to 5 shortly after) isn't worth sending an instructor home and calling a new one back in for —
// bridge gaps this short into one continuous run BEFORE padding to MIN_SHIFT_MINUTES, so two short
// bursts sitting close together don't each get padded toward each other and merge into one shift
// stretching all the way to close (Sept 2026, per Allie, re: a Tuesday 5-5:30pm dip that made three
// different instructor levels all display as "3:45pm-7pm" instead of their real, shorter needs).
// Raised from 30 to 60 minutes (Sept 2026, per Allie: "cant you change it to be more efficient?") —
// every extra instructor level that DOESN'T bridge gets its own fresh MIN_SHIFT_MINUTES floor, so the
// wider this is, the fewer separate 2-hour commitments the suggestion piles up; the tradeoff is more
// built-in idle time within a bridged shift during the lull itself.
var SHORT_GAP_MERGE_MINUTES=60;

var MAKEUP_SAME_DAY_CUTOFF=600; // 10:00am

// One-click account setup (front desk only): creates the real Supabase Auth login and emails an
// invite the person uses to set their own password — replacing the old two-step "add them in the
// Supabase dashboard, then paste SQL to link their role" process. Unlike dbWrite(), this isn't
// fire-and-forget — front desk is actively waiting to know whether the invite actually went out,
// so it always leaves a toast either way.
// Oct 2026, per Allie: "invite login button not working on first click" — it was working, but the
// invite function takes 2–3s (cold start + sending the email) and the app showed nothing until it
// finished, so it looked dead and got clicked again (auth logs: two invites to one parent 4s
// apart). Now the Login cell flips to "Sending…" straight away, and a second click is ignored while
// the first is still in flight.
var inviteInFlight={};
function recordForLogin(role, linkedId){
  if(role==='instructor') return findInstructor(linkedId);
  if(role==='parent') return parents.find(function(x){ return x.id===linkedId; });
  if(role==='staff') return staffMembers.find(function(x){ return x.id===linkedId; });
  return null;
}
function inviteLogin(email, role, linkedId, personName){
  if(!supabaseClient || !currentUser){ toast('Invites only work when signed in to the live app.'); return; }
  const key=role+':'+linkedId;
  if(inviteInFlight[key]) return;
  inviteInFlight[key]=true;
  const rec=recordForLogin(role, linkedId);
  const before=rec? rec.authUserId : null;
  if(rec) rec.authUserId='sending';
  toast('Sending invite to '+email+'…', 8000);
  supabaseClient.functions.invoke('invite-user', {body:{email:email, role:role, linkedId:linkedId}}).then(function(r){
    delete inviteInFlight[key];
    const errMsg = (r && r.error && r.error.message) || (r && r.data && r.data.error);
    if(errMsg){ if(rec && rec.authUserId==='sending') rec.authUserId=before; toast('Could not invite '+personName+' — '+errMsg, 7000); return; }
    if(role==='instructor'){ const i=findInstructor(linkedId); if(i) i.authUserId='pending'; }
    if(role==='parent'){ const p=parents.find(function(x){ return x.id===linkedId; }); if(p) p.authUserId='pending'; }
    if(role==='staff'){ const s=staffMembers.find(function(x){ return x.id===linkedId; }); if(s) s.authUserId='pending'; }
    toast('Invite sent to '+email+' — they\'ll get an email to set their own password.');
    render();
    loadLoginStatuses().then(renderUnlessEditing);
  }).catch(function(err){
    delete inviteInFlight[key];
    if(rec && rec.authUserId==='sending') rec.authUserId=before;
    toast('Could not invite '+personName+' — '+(err&&err.message?err.message:'unknown error'));
  });
}
// Invite status for the Login column on the Parents / Instructors / Front desk staff lists (Oct 2026,
// per Allie: "when sending invite out to parents, can it say sent or something until the parents set
// a password and access the site?"). An invite links the record to a new login immediately, so
// authUserId alone can't tell "invited" from "actually using it" — that comes from the staff-only
// login_statuses() database function (add_login_statuses.sql), keyed by auth user id.
var loginStatusByAuthId=null; // null = not loaded (or not staff) — the Login column then falls back to "Active"
function loadLoginStatuses(){
  if(!supabaseClient || !currentUser || currentUser.role!=='staff') return Promise.resolve();
  return supabaseClient.rpc('login_statuses').then(function(r){
    if(r.error){ console.error('Could not load login statuses', r.error); return; }
    const m={};
    (r.data||[]).forEach(function(row){
      m[row.auth_user_id]={invitedAt: row.invited_at? new Date(row.invited_at) : null, lastSignInAt: row.last_sign_in_at? new Date(row.last_sign_in_at) : null};
    });
    loginStatusByAuthId=m;
  });
}
// resendButtonHtml (Oct 2026): offered next to "Invite sent" for anyone who hasn't got in yet —
// invite links are single-use and short-lived, and some mail apps use them up by pre-scanning.
function loginStatusCellHtml(authUserId, inviteButtonHtml, resendButtonHtml){
  if(!supabaseClient) return '<span class="small muted">—</span>';
  if(!authUserId) return inviteButtonHtml;
  if(authUserId==='sending') return '<span class="badge soon">Sending…</span>';
  const sent='<span class="badge soon" title="They haven\'t set a password and signed in yet">Invite sent</span>';
  const resend=resendButtonHtml? ' '+resendButtonHtml : '';
  if(authUserId==='pending') return sent+' <span class="small muted">just now</span>';
  if(!loginStatusByAuthId) return '<span class="badge available">Active</span>';
  const st=loginStatusByAuthId[authUserId];
  if(!st) return sent+resend; // linked but not in the last status load — almost always a brand-new invite
  if(st.lastSignInAt) return '<span class="badge available" title="Last signed in '+fmtShort(st.lastSignInAt)+'">Active</span>';
  return sent+(st.invitedAt? ' <span class="small muted">'+fmtShort(st.invitedAt)+'</span>' : '')+resend;
}
function resendInviteButtonHtml(email, role, linkedId, name){
  return '<button class="btn sm ghost" onclick="resendInvite(\''+email+'\',\''+role+'\',\''+linkedId+'\',\''+String(name).replace(/'/g,"\\'")+'\')" title="Send them a fresh link — the old one may have expired or been used up">Resend</button>';
}
function resendInvite(email, role, linkedId, personName){
  if(!supabaseClient || !currentUser){ toast('Invites only work when signed in to the live app.'); return; }
  if(!confirm('Send '+personName+' a fresh sign-up link at '+email+'?\n\nAny earlier link they were sent will stop working.')) return;
  supabaseClient.functions.invoke('invite-user', {body:{email:email, role:role, linkedId:linkedId, resend:true}}).then(function(r){
    const errMsg = (r && r.error && r.error.message) || (r && r.data && r.data.error);
    if(errMsg){ toast('Could not resend to '+personName+' — '+errMsg, 7000); return; }
    toast((r.data && r.data.mode==='password_setup')
      ? 'Sent '+personName+' a link to set their password ('+email+').'
      : 'New invite sent to '+email+'.', 6000);
    loadLoginStatuses().then(renderUnlessEditing);
  }).catch(function(err){ toast('Could not resend to '+personName+' — '+(err&&err.message?err.message:'unknown error')); });
}
function deactivateInstructor(instrId){
  const instr=findInstructor(instrId);
  instr.active=false;
  dbWrite('deactivating an instructor', function(){ return supabaseClient.from('instructors').update({active:false}).eq('id', instrId); });
  toast(instr.name+' deactivated — no longer offered for new bookings, coverage, or shift assignments. Their existing rostered shifts aren\'t touched automatically; reassign those from the Pod schedule or coverage tools.');
  render();
}
function reactivateInstructor(instrId){
  const instr=findInstructor(instrId);
  instr.active=true;
  dbWrite('reactivating an instructor', function(){ return supabaseClient.from('instructors').update({active:true}).eq('id', instrId); });
  toast(instr.name+' reactivated.');
  render();
}

// directly since capacity math itself doesn't care how a Pod came to be staffed for the window.
function termBreakPickBestPod(termBreak, weekday, dateKey, start, duration){
  for(let i=0;i<pods.length;i++){
    const podId=pods[i].id;
    const instructorId=termBreakCoverageFor(termBreak, podId, weekday);
    if(!instructorId) continue;

// Aggregate open seats across every Pod covered during this window of this term break — the summer-
// hours counterpart to openSeatsAt(), reusing the exact same peakInWindow/podCapacity/unassigned-
// headcount math, just driven by termBreakCoverageFor() instead of the regular podCoverageBoundary.
function termBreakOpenSeatsAt(termBreak, weekday, dateKey, blockStart, blockLen){
  let seats=0, staffed=0;
  const blockEnd=blockStart+blockLen;
  pods.forEach(function(pod){
    if(!termBreakCoverageFor(termBreak, pod.id, weekday)) return;
    staffed++;
    const peak=peakInWindow(pod.id, dateKey, blockStart, blockEnd);
    seats += Math.max(0, podCapacity(pod.id)-peak);
  });
  seats = Math.max(0, seats - unassignedPeakInWindow(dateKey, blockStart, blockEnd));
  return {seats, staffed};
}
// One reference date per weekday within a term break's own range — same idea as
// nextRegularOccurrence() (one real occurrence per weekday, not a shifting week-by-week number),
// just bounded to the break's own start/end instead of always the very next calendar occurrence,
// since a term break's coverage is a flat weekday map that only actually applies inside that range
// (Sept 2026, per Allie: "in summer tab, I need an availability table as well").
function termBreakDateForWeekday(termBreak, weekday){
  const from = toKey(simNow())>toKey(termBreak.startDate)? simNow() : termBreak.startDate;
  let d=nextDateForWeekday(from, weekday);
  while(toKey(d)<=toKey(termBreak.endDate) && closedDayFor(d)){ d=addDays(d,7); }

    // past — fall back to the first occurrence of this weekday within the range regardless, so the
    // grid still shows something meaningful rather than nothing at all.
    d=nextDateForWeekday(termBreak.startDate, weekday);
  }
  return d;
}

  for(let d=new Date(toKey(t.startDate)); toKey(d)<=toKey(t.endDate); d=addDays(d,1)){
    if(WEEKDAY_KEYS[(d.getDay()+6)%7]===weekday && !isClosedDate(d)) out.push(toKey(d));
  }
  return out;
}
function summerDraft(instrId, t){
  state.summerDrafts=state.summerDrafts||{};
  const k=instrId+'|'+t.id;
  if(!state.summerDrafts[k]){
    const saved=summerAvailFor(instrId, t.id);
    state.summerDrafts[k]={weekdays:saved? saved.weekdays.slice() : [], awayDates:saved? saved.awayDates.slice() : [], note:saved? saved.note : '', newAway:''};
  }
  return state.summerDrafts[k];
}
function toggleSummerWeekday(instrId, tbId, wd, on){
  const t=termBreaks.find(function(x){ return x.id===tbId; }); const d=summerDraft(instrId, t);
  d.weekdays=d.weekdays.filter(function(x){ return x!==wd; }); if(on) d.weekdays.push(wd);
  d.weekdays.sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a)-WEEKDAY_KEYS.indexOf(b); });

}
function setSummerDraftField(instrId, tbId, field, value){

function addTermBreak(label, startDate, endDate, morningStart, morningEnd){
  // visibleToParents starts false — front desk can build out the date range and coverage roster
  // over however many sessions that takes, without a half-finished setup being visible to (or
  // bookable by) parents the moment it's added. A separate "Make visible to parents" toggle below
  // is what actually announces it to families, on the front desk's own schedule (Sept 2026, per
  // Allie: "I need it to have a toggle on/off for when this information becomes available to
  // parents"). The standing-session skip itself is NOT gated by this — that's a real physical fact
  // about the centre's hours for these dates, independent of whether parents have been told yet.
  const t={id:newId()||('tb'+(nextTermBreakId++)), label:(label||'').trim()||'Summer hours', startDate:startDate, endDate:endDate, morningStart:morningStart, morningEnd:morningEnd, visibleToParents:false, coverage:{}};
  termBreaks.push(t);
  dbWrite('adding summer hours', function(){ return supabaseClient.from('term_breaks').insert({
    id:t.id, label:t.label, start_date:toKey(t.startDate), end_date:toKey(t.endDate), morning_start:t.morningStart, morning_end:t.morningEnd, visible_to_parents:false
  }); });
  // Anything already pre-booked into the new window (only possible if this was set up less than
  // HORIZON_WEEKS out) is cancelled outright — no make-up credit, since nothing was actually missed;
  // the family just has a morning slot to book instead — then the standing generator re-runs so it
  // correctly skips the rest of the range going forward.
  const startKey=toKey(t.startDate), endKey=toKey(t.endDate);
  let cancelled=0;
  sessions.forEach(function(s){
    if(s.status!=='scheduled' || !s.recurring) return;
    const dk=toKey(s.date);
    if(dk<startKey || dk>endKey) return;
    s.status='cancelled';
    cancelled++;
    dbWrite('cancelling a standing session for summer hours', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
  });
  regenerateAllRecurring();
  toast('Summer hours added: '+fmtShort(t.startDate)+'–'+fmtShort(t.endDate)+', '+minToLabel(t.morningStart)+'–'+minToLabel(t.morningEnd)+(cancelled>0? ' — '+cancelled+' already-booked standing session'+(cancelled===1?'':'s')+' in that range cleared (no make-up credit — parents can book a morning session instead).' : '.'));
  return t;
}

// A parent-booked morning session during an active term break (Sept 2026, per Allie: "I need your

function openTermBreakBookingForm(studentId){
  const now=simNow();
  // Only ever a break front desk has switched on for parents (see setTermBreakVisibility) — the
  // parent view's own link is already gated the same way, so this only matters against someone
  // calling it directly (e.g. a stale link left open from before front desk turned visibility off).
  const visibleBreaks=termBreaks.filter(function(t){ return t.visibleToParents; });
  const tb=visibleBreaks.find(function(t){ return termBreakOn(now)===t; })
    || visibleBreaks.filter(function(t){ return toKey(t.startDate)>=toKey(now); }).sort(function(a,b){ return toKey(a.startDate).localeCompare(toKey(b.startDate)); })[0]; // current, or the soonest upcoming one
  if(!tb){ toast('No summer hours period is available to book right now.'); render(); return; }
  const student=findStudent(studentId);
  if(studentTermBreakRemaining(tb, studentId)<=0){ toast('No summer session credits left for '+student.name+' this period.'); render(); return; }
  state.termBreakBookingForm={studentId:studentId, termBreakId:tb.id, date:toKey(tb.startDate)<toKey(now)? toKey(now) : toKey(tb.startDate), start:null, duration:student.duration, error:''};
  // Land on the first real weekday >= the default date, same idea as the rest of the app's date pickers.
  while(WEEKDAY_KEYS.indexOf(WEEKDAY_KEYS[(new Date(state.termBreakBookingForm.date).getDay()+6)%7])===-1 || isClosedDate(new Date(state.termBreakBookingForm.date))){
    state.termBreakBookingForm.date=toKey(addDays(new Date(state.termBreakBookingForm.date),1));
    if(state.termBreakBookingForm.date>toKey(tb.endDate)) break; // give up — renderer will just show "no slots" for an all-closed range
  }
  render();
}

// Cancelling a summer-hours session now works like a regular one (Oct 2026, per Allie: "summer
// hours should still cancel with credits" — she chose a make-up credit over handing the session
// back to the summer allowance): with notice (any earlier day, or the same day before the 10am
// cutoff) it earns a make-up credit valid 3 months; after the cutoff it still cancels, without one.
// Either way it stays counted as used from the summer allowance (parent_cancelled — see
// studentTermBreakUsed), so the session isn't given back twice.
function parentCancelTermBreakSession(sessionId){
  const sess=findSession(sessionId);
  if(!sess || sess.status!=='scheduled' || !sess.termBreak) return;
  const student=findStudent(sess.studentId);
  const pastCutoff = toKey(sess.date)===toKey(simNow()) && sameDayMakeUpCutoffPassed();
  const issued=sess.date, expiry=addMonths(issued,3);
  if(!confirm('Cancel '+student.name+'\'s summer session on '+fmtLong(sess.date)+' at '+minToLabel(sess.start)+'?\n\n'
    +'This still counts as one of '+student.name+'\'s summer sessions. '
    +(pastCutoff
      ? 'It\'s after the 10:00am same-day cutoff, so this cancellation will NOT come with a make-up credit.'
      : 'You\'ll get a make-up credit valid until '+fmtShort(expiry)+'.'))) return;
  sess.status='cancelled';
  sess.parentCancelled=true;
  dbWrite('cancelling a summer-hours session (parent)', function(){ return supabaseClient.from('sessions').update({status:'cancelled', parent_cancelled:true}).eq('id', sess.id); });
  if(pastCutoff){
    toast('Summer session cancelled — no make-up credit was issued since it\'s after the 10:00am same-day cutoff.', 6000);
    render();
    return;
  }
  const c={id:newId()||('c'+(nextCreditId++)), studentId:sess.studentId, issuedDate:issued, expiryDate:expiry, status:'available', redeemedSessionId:null, warningSent:false, source:'parent-cancel', note:'Cancelled summer-hours session', minutes:sessionBaseMinutes(sess), minutesUsed:0};
  credits.push(c);
  dbWrite('issuing a make-up credit (summer session)', function(){ return supabaseClient.from('credits').insert({
    id:c.id, student_id:c.studentId, issued_date:toKey(c.issuedDate), expiry_date:toKey(c.expiryDate),
    status:c.status, redeemed_session_id:c.redeemedSessionId, warning_sent:c.warningSent, source:c.source, note:c.note, minutes:c.minutes||null
  }); });
  toast('Summer session cancelled — a make-up credit was added, valid until '+fmtShort(expiry)+'.', 6000);
  render();
}

// How many Monday-aligned weeks a term break's date range touches — the basis for each student's
// summer session credit tally below (Sept 2026, per Allie: credits = the student's normal
// sessions/week x however many weeks the break spans, so a 2x/week student gets 2 credits per week
// of break, a 1x/week student gets 1).
function termBreakWeekCount(tb){
  let count=0;
  let mon=getMonday(tb.startDate);
  const lastMon=getMonday(tb.endDate);
  while(toKey(mon)<=toKey(lastMon)){ count++; mon=addDays(mon,7); }
  return count;
}
function studentTermBreakCredits(tb, studentId){
  const student=findStudent(studentId);
  if(!student || !tb) return 0;
  return (student.sessionsPerWeek||0) * termBreakWeekCount(tb);
}
// Every non-cancelled summer session this student has on the books within this break's own date
// range — recurring-generated or singular, doesn't matter, they draw from the same tally.
function studentTermBreakUsed(tb, studentId){
  if(!tb) return 0;
  const startKey=toKey(tb.startDate), endKey=toKey(tb.endDate);
  return sessions.filter(function(s){
    const dk=toKey(s.date);
    // A summer session the parent cancelled still counts as used — they get a make-up credit for it
    // instead (Oct 2026); one front desk cancelled (or a closure) frees the allowance back up.
    return s.studentId===studentId && s.termBreak && (s.status!=='cancelled' || s.parentCancelled) && dk>=startKey && dk<=endKey;
  }).length;
}
function studentTermBreakRemaining(tb, studentId){
  return Math.max(0, studentTermBreakCredits(tb, studentId) - studentTermBreakUsed(tb, studentId));
}
// The distinct weekday/time pairs this student currently has a standing recurring summer pick for —
// used both to show what's already set up and to enforce the cap (Sept 2026, per Allie: capped at
// whatever the student's normal sessions/week already is — "if they were already enroled for 2x per
// week then 2, but if it was only 1, then 1").
function studentTermBreakRecurringPicks(tb, studentId){
  if(!tb) return [];
  const startKey=toKey(tb.startDate), endKey=toKey(tb.endDate);
  const seen={}, picks=[];
  sessions.filter(function(s){
    const dk=toKey(s.date);
    return s.studentId===studentId && s.termBreak && s.recurring && s.status!=='cancelled' && dk>=startKey && dk<=endKey;
  }).forEach(function(s){
    const weekday=WEEKDAY_KEYS[(s.date.getDay()+6)%7];
    const key=weekday+'|'+s.start;
    if(!seen[key]){ seen[key]=true; picks.push({weekday:weekday, start:s.start}); }
  });
  return picks;
}
// A parent picking ONE recurring weekday/time for the break (Sept 2026, per Allie: "the option to
// book either recurring days and times, or singular days and times") — confirming it immediately
// books every matching week at once (see confirmTermBreakRecurringBooking below), rather than just
// pre-filling the singular picker week by week.
function openTermBreakRecurringForm(studentId){
  const now=simNow();
  const visibleBreaks=termBreaks.filter(function(t){ return t.visibleToParents; });
  const tb=visibleBreaks.find(function(t){ return termBreakOn(now)===t; })
    || visibleBreaks.filter(function(t){ return toKey(t.startDate)>=toKey(now); }).sort(function(a,b){ return toKey(a.startDate).localeCompare(toKey(b.startDate)); })[0];
  if(!tb){ toast('No summer hours period is available to book right now.'); render(); return; }
  const student=findStudent(studentId);
  const picks=studentTermBreakRecurringPicks(tb, studentId);
  if(picks.length>=(student.sessionsPerWeek||0)){ toast('You already have the most recurring summer times '+student.name+' can have at once ('+picks.length+').'); render(); return; }
  state.termBreakRecurringForm={studentId:studentId, termBreakId:tb.id, weekday:'Mon', start:null, duration:student.duration, error:''};
  render();
}
function closeTermBreakRecurringForm(){ state.termBreakRecurringForm=null; render(); }
function setTermBreakRecurringField(field, value){
  const f=state.termBreakRecurringForm; if(!f) return;
  f[field] = (field==='start') ? (value===''? null : Number(value)) : value;
  if(field==='weekday'){ f.start=null; } // whichever time was picked may no longer be on this weekday's grid
  f.error='';
  render();
}
function confirmTermBreakRecurringBooking(){
  const f=state.termBreakRecurringForm; if(!f) return;
  const tb=termBreaks.find(function(t){ return t.id===f.termBreakId; });
  if(!tb){ f.error='This summer hours period no longer exists.'; render(); return; }
  if(!tb.visibleToParents){ f.error='This summer hours period isn\'t available for booking right now.'; render(); return; }
  if(f.start==null){ f.error='Choose a time.'; render(); return; }
  const student=findStudent(f.studentId);
  const existingPicks=studentTermBreakRecurringPicks(tb, f.studentId);
  if(existingPicks.length>=(student.sessionsPerWeek||0)){ f.error='You already have the most recurring summer times '+student.name+' can have at once.'; render(); return; }
  if(existingPicks.some(function(p){ return p.weekday===f.weekday && p.start===f.start; })){ f.error='Already set up for this day and time.'; render(); return; }
  let remaining=studentTermBreakRemaining(tb, f.studentId);
  if(remaining<=0){ f.error='No summer session credits left to use for a recurring time.'; render(); return; }
  // Every occurrence of this weekday within the break, from today (or the break's start, whichever
  // is later) through its end — generated all at once since a term break is short and fully known up
  // front, unlike the rolling HORIZON_WEEKS the regular standing schedule uses.
  const now=simNow();
  let d=new Date(toKey(tb.startDate)<toKey(now)? toKey(now) : toKey(tb.startDate));
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==f.weekday){
    d=addDays(d,1);
    if(toKey(d)>toKey(tb.endDate)){ f.error='No more '+f.weekday+'s left in this summer hours period.'; render(); return; }
  }
  let booked=0, skippedNoRoom=0;
  while(toKey(d)<=toKey(tb.endDate)){
    if(remaining<=0) break;
    if(!isClosedDate(d)){
      const dateKey=toKey(d);
      const pick=termBreakPickBestPod(tb, f.weekday, dateKey, f.start, f.duration);
      if(!pick){ skippedNoRoom++; }
      else{
        const sess={id:newId()||('sess'+(nextSessionId++)), studentId:student.id, podId:pick.podId, online:false, instructorId:pick.instructorId, instructorId2:null, handoff:null, date:new Date(d), start:f.start, duration:f.duration, status:'scheduled', bookedBy:'parent', creditId:null, recurring:true, termBreak:true};
        sessions.push(sess);
        dbWrite('booking a recurring summer-hours session', function(){ return supabaseClient.from('sessions').insert({
          id:sess.id, student_id:sess.studentId, pod_id:sess.podId, online:false, instructor_id:sess.instructorId,
          instructor_id_2:null, handoff_min:null, the_date:toKey(sess.date), start_min:sess.start, duration:sess.duration,
          status:sess.status, booked_by:sess.bookedBy, credit_id:null, is_recurring:true, term_break:true
        }); });
        booked++;
        remaining--;
      }
    }
    d=addDays(d,7);
  }
  if(booked===0){
    f.error = skippedNoRoom>0 ? 'That day/time is full every week it\'s offered — try a different time.' : 'Nothing could be booked for that day/time.';
    render(); return;
  }
  let msg='Booked '+booked+' '+f.weekday+' session'+(booked===1?'':'s')+' at '+minToLabel(f.start)+'.';
  if(skippedNoRoom>0) msg+=' '+skippedNoRoom+' week'+(skippedNoRoom===1?' was':'s were')+' already full.';
  toast(msg);
  state.termBreakRecurringForm=null;
  render();
}
// Undoes one recurring pick — cancels every upcoming (not yet past, still 'scheduled') session it
// generated, freeing those summer credits back up so the family can rebook a different day/time.
// No make-up credit, same reasoning as any other summer-hours cancellation.
function removeTermBreakRecurringPick(studentId, weekday, start){
  const student=findStudent(studentId);
  if(!confirm('Remove '+student.name+'\'s recurring '+weekday+' '+minToLabel(start)+' summer sessions? Any already booked for future weeks will be cancelled (no make-up credit — this frees the summer credits back up to rebook a different day/time).')) return;
  let cancelled=0;
  sessions.forEach(function(s){
    if(s.studentId!==studentId || !s.termBreak || !s.recurring || s.status!=='scheduled') return;
    const wd=WEEKDAY_KEYS[(s.date.getDay()+6)%7];
    if(wd!==weekday || s.start!==start) return;
    s.status='cancelled';
    cancelled++;
    dbWrite('removing a recurring summer-hours session', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
  });
  toast(cancelled>0? 'Removed — '+cancelled+' upcoming session'+(cancelled===1?'':'s')+' freed back up.' : 'Nothing upcoming to remove for that day/time.');
  render();
}

// Who's actually covering a shift block on a given date — the assignment with the latest
// effectiveFrom on or before that date. Returns null if the block didn't exist yet / has no
// assignment history reaching back that far (e.g. a brand-new block whose first assignment is
// itself dated in the future).
function blockInstructorOn(block, date){
  const dateKey=toKey(date);
  // A same-day coverage swap (see "shift coverage requests" below) always wins for its exact date —
  // same one-off-beats-ongoing resolution order as instructor availability — then the regular
  // dated assignment history applies for every other date, untouched.
  const oneOff=(block.oneOffCoverage||[]).find(function(o){ return toKey(o.date)===dateKey; });
  if(oneOff) return oneOff.instructorId;
  return blockInstructorOngoing(block, date);
}
// Same resolution as blockInstructorOn(), minus the same-day swap check — "who's ROSTERED onto this
// block," ignoring any one-off exception in effect for this particular date. Used by the static
// rostered-shifts grid (renderRosteredShiftsGrid) so it always reads as the standing pattern, not
// whatever happens to be swapped for today specifically.
function blockInstructorOngoing(block, date){
  const dateKey=toKey(date);
  const candidates=block.assignments.filter(function(a){ return toKey(a.effectiveFrom)<=dateKey; });
  if(candidates.length===0) return null;
  candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
  return candidates[candidates.length-1].instructorId;
}
// Which instructors have themselves declared availability covering this block's day/time as of a
// given date — used to keep the "assign an instructor" picker limited to real candidates only.
// Takes `weekday` explicitly rather than deriving it from `date.getDay()` (as instructorAvailabilityOn
// does) — `date` here is usually an assignment's effective-from cutoff, which need not itself fall on
// the block's weekday (e.g. lining up a Wednesday shift "starting today" when today's a Friday). A
// one-off exception on that exact calendar date still overrides, same as instructorAvailabilityOn.
function qualifyingInstructorsForBlock(weekday, block, date){
  const dateKey=toKey(date);
  return instructors.filter(function(instr){
    if(instr.active===false) return false; // deactivated instructors are never offered for a new shift/coverage
    const oneOff=instr.oneOffs.find(function(o){ return toKey(o.date)===dateKey; });
    if(oneOff) return !oneOff.off && block.start>=oneOff.start && block.end<=oneOff.end;
    const candidates=instr.availRules.filter(function(r){ return r.weekday===weekday && toKey(r.effectiveFrom)<=dateKey; });
    if(candidates.length===0) return false;
    candidates.sort(function(a,b){ return toKey(a.effectiveFrom).localeCompare(toKey(b.effectiveFrom)); });
    const active=candidates[candidates.length-1];
    return !active.off && block.start>=active.start && block.end<=active.end;
  });
}
