    +'<p>You can only see and manage your own availability — not other instructors\'.</p></div>';
  // Two tabs (Oct 2026, per Allie): My shifts (today's Pod, the next 2 weeks, one-off shifts,
  // coverage) and Availability (ongoing + one-off availability changes).
  // Nov 2026: a third tab, Summer, for their summer-hours availability.
  const tab=(state.instructorTab==='availability'||state.instructorTab==='summer')? state.instructorTab : 'shifts';
  const summerPending=upcomingTermBreaks().filter(function(t){ return !summerAvailFor(instr.id, t.id); }).length;
  html+='<div class="subtabs"><button class="subtab'+(tab==='shifts'?' active':'')+'" onclick="setInstructorTab(\'shifts\')">My shifts</button>'
    +'<button class="subtab'+(tab==='availability'?' active':'')+'" onclick="setInstructorTab(\'availability\')">Availability</button>'
    +'<button class="subtab'+(tab==='summer'?' active':'')+'" onclick="setInstructorTab(\'summer\')">Summer'+(summerPending?' <span class="badge soon" style="margin-left:4px">'+summerPending+'</span>':'')+'</button></div>';
  if(tab==='summer') return html+renderInstructorSummerTab(instr);
  if(tab==='availability'){
    html+=renderAvailabilityManager(instr, 'My availability', 'Your usual weekly hours. Use an ongoing change for something that applies from a date onwards, or a one-off change for a single day.');
    html+=renderAvailRuleModal();
    html+=renderOneOffModal();
    return html;
  }

  const myPodIdsToday=instructorPodIdsToday(instr.id);
  const checkedInAtMyPods=checkedInAtInstructorPodToday(instr.id);
  // A lone student turning orange at 5 minutes is plenty of notice; a genuine rush — 3 or more
  // leaving at the exact same time — needs the earlier 10-minute warning instead, since that's a
  // few check-outs to get through at once (Sept 2026, per Allie: "if you have 3 or more students
  // leaving at the same time, can it go orange with 10 min to go, 5 min otherwise"). Grouped by
  // each student's own actual exit time (not their scheduled one), same value the countdown itself
  // is built from.
  const exitTimeCounts={};
  checkedInAtMyPods.forEach(function(s){
    const exit=s.actualEnd!=null? s.actualEnd : s.start+s.duration;
    exitTimeCounts[exit]=(exitTimeCounts[exit]||0)+1;
  });
  html+='<div class="card"><h2>My Pod today</h2><p>Students checked in today at the Pod(s) you\'re covering. If one needs to be somewhere else, move them to another Pod here — front desk sees the change immediately.</p>';
  if(myPodIdsToday.length===0){ html+='<div class="empty-note">You\'re not rostered to cover a Pod today.</div>'; }
  else if(checkedInAtMyPods.length===0){ html+='<div class="empty-note">Nobody\'s checked in yet today.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Pod</th><th>Time</th><th>Time left</th><th></th></tr>'
      +checkedInAtMyPods.map(function(s){
        const student=findStudent(s.studentId);
        const pod=findPod(s.podId);
        const locLabel=s.online? 'Online' : (pod? pod.name : '—');
        const exit=s.actualEnd!=null? s.actualEnd : s.start+s.duration;
        const soonThreshold=exitTimeCounts[exit]>=3? 10 : 5;
        // Harry's own board uses his custom 3-tier scheme instead of the standard 2-tier one — see
        // countdownInfoPackUpCustom() (Sept 2026, per Allie, for him only).
        const cd=instr.packUpCustomColors? countdownInfoPackUpCustom(exit) : countdownInfo(exit, soonThreshold);
        // Actual (check-in-adjusted) times, not the original scheduled window — this row is only
        // ever a student who's already checked in (checkedInAtInstructorPodToday() filters to
        // status==='attended'), so actualStart/actualEnd are always set by then. Previously showed
        // rangeLabel(s.start,s.duration) — the plain scheduled range — which silently disagreed with
        // front desk's own "Checked in today" panel (renderCheckedInPanel()) any time a check-in was
        // late/early or its exit time was manually adjusted (Sept 2026, per Allie: "the instructor
        // view of sign out times are different to front staff view").
        const timeLabel=(s.actualStart!=null && s.actualEnd!=null)? minToLabel(s.actualStart)+'–'+minToLabel(s.actualEnd) : rangeLabel(s.start,s.duration);
        // Flags this as the student's very first session at the centre — worth an instructor
        // knowing on sight, not just something front desk sees on their own Today tab (Sept 2026,
        // per Allie: "i also want it to say first day during their first session when sitting with
        // an instructor").
        const firstDayTag=isStudentStartingToday(student)? ' <span class="badge firstday">First day!</span>' : '';
        return '<tr><td>'+student.name+firstDayTag+' <span class="small muted">'+yearLabel(student.year)+'</span></td><td>'+locLabel+'</td><td>'+timeLabel+'</td>'
          +'<td><span class="badge '+cd.cls+'">'+cd.label+'</span></td>'
          +'<td><button class="btn sm" onclick="openCheckOut(\''+s.id+'\')">Check out</button> '
          +'<button class="btn sm ghost" onclick="openMoveForm(\''+s.id+'\')">Move pod</button></td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  html+=renderMoveModal();
  // Instructors can now check out their own students directly (Sept 2026, per Allie: "can we do it
  // so the instructors can check out the kids on their pod as well as front staff") — same modal
  // front desk uses, but scoped to just this instructor's own checked-in students (see
  // checkedInPresentForCurrentViewer()), not the whole centre.
  html+=renderCheckOutModal();

  // Rostered shifts — the next 2 weeks, by date (Oct 2026, per Allie).
  const ahead=instructorShiftsAhead(instr.id);
  const todayKey=toKey(simNow());
  const dateCell=function(d){ const dk=toKey(d); return '<b>'+fmtShort(d)+'</b>'+(dk===todayKey? ' <span class="badge firstday">Today</span>' : ''); };
  html+='<div class="card"><h2>Rostered shifts</h2><p class="small muted">Your shifts for the next 2 weeks. Can\'t make one? Use "Can\'t make it" on that date — front desk lines up a replacement, and every other week stays the same.</p>';
  if(!ahead.regular.length) html+='<div class="empty-note">No shifts rostered in the next 2 weeks.</div>';
  else{
    html+='<table><tr><th>Date</th><th>Time</th><th>Pod</th><th></th></tr>'
      +ahead.regular.map(function(a){
        const dk=toKey(a.date), pod=findPod(a.podId);
        const time = (a.status==='off' || a.status==='covered')? '<s class="muted">'+rangeLabel(a.start,a.end-a.start)+'</s>' : rangeLabel(a.start,a.end-a.start);
        const requested = a.blockId && coverageRequests.some(function(r){ return r.blockId===a.blockId && toKey(r.date)===dk && r.status==='open'; });
        let action='';
        if(a.status==='off') action='<span class="badge full">Not needed</span>';
        else if(a.status==='covered') action='<span class="badge full">Covered by '+(a.coveredBy && findInstructor(a.coveredBy)? findInstructor(a.coveredBy).name : 'someone else')+'</span>';
        else if(requested) action='<span class="badge soon">Coverage requested</span>';
        else if(a.blockId) action='<button class="btn sm ghost" onclick="openCoverageRequestForm(\''+instr.id+'\',\''+a.podId+'\',\''+a.weekday+'\',\''+a.blockId+'\',\''+dk+'\')">Can\'t make it</button>';
        if(a.status==='changed') action='<span class="badge soon">Times changed</span> '+action;
        if(a.note) action='<span class="badge soon">'+a.note+'</span> '+action;
        return '<tr><td>'+dateCell(a.date)+'</td><td>'+time+'</td><td class="small">'+(pod? pod.name : '—')+'</td><td>'+action+'</td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';

  // One-off shifts — ones they've picked up that are usually someone else's (Oct 2026, per Allie).
  const pickedUp=instructorUpcomingCoverShifts(instr.id).filter(function(c){ return c.kind==='cover'; });
  html+='<div class="card"><h2>One-off shifts</h2><p class="small muted">Shifts you\'ve picked up that are usually someone else\'s. Each one drops off once its date passes.</p>';
  if(!pickedUp.length) html+='<div class="empty-note">No one-off shifts coming up.</div>';
  else{
    html+='<table><tr><th>Date</th><th>Time</th><th>Pod</th><th>Usually</th></tr>'
      +pickedUp.map(function(c){
        const pod=findPod(c.podId);
        const usual=podBlocksForDay(c.podId, c.day).filter(function(b){ return b.start<c.end && b.end>c.start; }).map(function(b){ return blockInstructorOngoing(b, c.date); }).filter(Boolean)[0];
        const usualI=usual? findInstructor(usual) : null;
        return '<tr><td>'+dateCell(c.date)+'</td><td>'+rangeLabel(c.start,c.end-c.start)+'</td><td class="small">'+(pod? pod.name : '—')+'</td><td class="small muted">'+(usualI? usualI.name : 'Extra shift')+'</td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';

  const openForMe=openCoverageRequestsSortedForInstructor(instr.id);
  if(openForMe.length>0){
    // "Offer to cover" (Oct 2026) — any shift, even outside their usual hours; front desk accepts or
    // declines and they're emailed either way (see offerToCover).
    html+='<div class="card"><h2>Shifts needing coverage</h2><p>Shifts other instructors can\'t make. Can you help? Tap <b>Offer to cover</b> — even if it\'s outside your usual hours. Several people can offer; front desk picks one and you\'ll get an email either way.</p>';
    html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Requested by</th><th></th><th></th></tr>'
      +openForMe.map(function(x){
        const r=x.request;
        const pod=findPod(r.podId);
        const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
        const requester=findInstructor(r.requestedBy);
        const mine=r.requestedBy===instr.id;
        const offer=myCoverOffer(r.id, instr.id);
        const clash=mine? null : coverOfferClash(r, instr.id);
        let action='';
        if(mine) action='<span class="small muted">Your request</span>';
        else if(offer && offer.status==='pending') action='<span class="badge soon">Offer sent</span> <button class="btn sm ghost" onclick="withdrawCoverOffer(\''+offer.id+'\')">Withdraw</button>';
        else if(offer && offer.status==='declined') action='<span class="small muted">Thanks — not needed this time</span>';
        else action='<button class="btn sm primary" onclick="offerToCover(\''+r.id+'\')">Offer to cover</button>';
        return '<tr><td>'+fmtShort(r.date)+'</td><td class="small">'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')
            +(clash? '<div class="small" style="color:var(--warning)">You\'re on '+clash+' then</div>' : '')+'</td>'
          +'<td class="small">'+(requester? requester.name : '—')+(mine? ' <span class="small muted">(you)</span>' : '')+'</td>'
          +'<td>'+(x.withinOwnAvailability? '<span class="badge available">During your hours</span>' : '<span class="small muted">Outside your hours</span>')+'</td>'
          +'<td>'+action+'</td></tr>';
      }).join('')
      +'</table></div>';
  }

  const myRequests=coverageRequests.filter(function(r){ return r.requestedBy===instr.id; }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  if(myRequests.length>0){
    html+='<div class="card"><h2>Your coverage requests</h2>';
    html+='<table><tr><th>Date</th><th>Pod / shift</th><th>Emailed</th><th>Status</th><th></th></tr>'
      +myRequests.map(function(r){
        const pod=findPod(r.podId);
        const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
        const notified=(r.notifiedInstructorIds||[]).map(function(id){ const i=findInstructor(id); return i?i.name:null; }).filter(Boolean);
        const emailedCell = notified.length
          ? notified.join(', ')
          : (r.managerNotified? 'Nobody available — manager emailed' : 'Nobody yet');
        const statusLabel = r.status==='open'? '<span class="badge soon">Open</span>'
          : r.status==='cancelled'? '<span class="small muted">Cancelled</span>'
          : (r.filledBy? '<span class="badge available">Covered by '+findInstructor(r.filledBy).name+'</span>' : '<span class="badge full">Unstaffed</span>');
        return '<tr><td>'+fmtShort(r.date)+'</td><td class="small">'+pod.name+(block? ' '+rangeLabel(block.start,block.end-block.start) : '')+'</td>'
          +'<td class="small muted">'+emailedCell+'</td><td>'+statusLabel+'</td>'
          +'<td>'+(r.status==='open'? '<button class="btn sm ghost" onclick="cancelCoverageRequest(\''+r.id+'\')">Cancel</button>' : '')+'</td></tr>';
      }).join('')
      +'</table></div>';
  }
  html+=renderCalendarSyncCard(instr);
  html+=renderCoverageRequestModal();

  return html;
}

// Front desk raising cover on an instructor's behalf (Oct 2026, per Allie: "if they notify me in the
// centre, or something comes up i need to be able to request coverage in their behest") — pick the
// date, then which of that day's shifts; it then behaves exactly as if that instructor had asked
// (offers, emails, Accept/Decline). Only regular shift blocks (not a one-day Schedule-grid change).
function openStaffCoverageForm(){
  state.coverageRequestForm={staffMode:true, date:toKey(simNow()), shiftKey:'', note:'', error:''};
  render();
}
function staffCoverageShiftOptions(dateKey){
  const date=new Date(dateKey), weekday=WEEKDAY_KEYS[(date.getDay()+6)%7], opts=[];
  pods.forEach(function(pod){
    if(dayOverrideFor(pod.id, dateKey)) return;
    podBlocksForDay(pod.id, weekday).forEach(function(b){
      const who=blockInstructorOn(b, date);
      if(!who) return;
      const taken=coverageRequests.some(function(r){ return r.blockId===b.id && toKey(r.date)===dateKey && r.status==='open'; });
      opts.push({key:pod.id+'|'+b.id, podId:pod.id, blockId:b.id, weekday:weekday, instructorId:who, taken:taken,
        label:pod.name+' '+rangeLabel(b.start,b.end-b.start)+' — '+(findInstructor(who)? findInstructor(who).name : '?')+(taken? ' (already needs cover)' : '')});
    });
  });
  return opts;
}
function submitStaffCoverageRequest(){
  const f=state.coverageRequestForm;
  const opt=staffCoverageShiftOptions(f.date).find(function(o){ return o.key===f.shiftKey; });
  if(!opt){ f.error='Choose the shift that needs cover.'; render(); return; }
  if(opt.taken){ f.error='That shift already has an open coverage request.'; render(); return; }
  f.podId=opt.podId; f.blockId=opt.blockId; f.weekday=opt.weekday; f.instructorId=opt.instructorId;
  submitCoverageRequest();
}
function renderCoverageRequestModal(){
  const f=state.coverageRequestForm;
  if(!f) return '';
  if(f.staffMode){
    const opts=staffCoverageShiftOptions(f.date);
    let h='<div class="overlay" onclick="if(event.target===this) closeCoverageRequestForm()"><div class="modal">';
    h+='<h3>Mark a shift as needing cover</h3>';
    h+='<p>For when an instructor tells you in person, or something comes up. It works just like them asking: available instructors are emailed, anyone can offer to cover, and you accept or decline. Their regular shift is unchanged every other week.</p>';
    if(f.error) h+='<div class="banner danger">'+f.error+'</div>';
    h+='<label>Date</label><input type="date" value="'+f.date+'" min="'+toKey(simNow())+'" onchange="setCoverageRequestField(\'date\',this.value); state.coverageRequestForm.shiftKey=\'\';"/>';
    h+='<label>Shift</label>'+(opts.length
      ? '<select onchange="setCoverageRequestField(\'shiftKey\',this.value)"><option value="">Choose a shift…</option>'
        +opts.map(function(o){ return '<option value="'+o.key+'"'+(o.key===f.shiftKey?' selected':'')+(o.taken?' disabled':'')+'>'+o.label+'</option>'; }).join('')+'</select>'
      : '<div class="small muted" style="padding:6px 0">No rostered shifts on that day.</div>');
    h+='<label>Note (optional)</label><input type="text" placeholder="e.g. unwell — called in" value="'+f.note+'" oninput="setCoverageRequestField(\'note\',this.value)"/>';
    h+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
      +'<button class="btn ghost" onclick="closeCoverageRequestForm()">Cancel</button>'
      +'<button class="btn primary" onclick="submitStaffCoverageRequest()">Request cover</button>'
    +'</div></div></div>';
    return h;
  }
  const pod=findPod(f.podId);
  let html='<div class="overlay" onclick="if(event.target===this) closeCoverageRequestForm()"><div class="modal">';
  html+='<h3>Request coverage — '+pod.name+' '+f.weekday+'</h3>';
  html+='<p>Flags this one date for front desk, who\'ll line up a qualified, available replacement. Every other '+f.weekday+' stays assigned to you as usual.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  html+='<label>Date</label><input type="date" value="'+f.date+'" onchange="setCoverageRequestField(\'date\',this.value)"/>';
  html+='<label>Note (optional)</label><input type="text" placeholder="e.g. feeling unwell" value="'+f.note+'" oninput="setCoverageRequestField(\'note\',this.value)"/>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeCoverageRequestForm()">Cancel</button>'
    +'<button class="btn primary" onclick="submitCoverageRequest()">Request coverage</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

      +'<label>Password</label><input type="password" placeholder="anything"/>'
      +'<button class="btn primary" style="width:100%" onclick="instructorLoginSubmit(document.getElementById(\'instructorLoginEmail\').value)">Log in</button>'
      +'<p style="margin-top:14px">Sample accounts:</p>'
      +'<div class="small">'+instructors.map(function(i){ return '<div class="pill" style="display:inline-block;margin:2px;cursor:pointer" onclick="quickInstructorLogin(\''+i.email+'\')">'+i.email+'</div>'; }).join('')+'</div>'
    +'</div>';

// Shared by an instructor managing their own hours (renderInstructor) and front desk adjusting
// them on someone's behalf (renderInstructorsPanel, via the staff availability manager modal
// below) — same underlying ongoing/one-off change records either way, just a different entry
// point and wording depending on who's looking at it.
function renderAvailabilityManager(instr, heading, intro){
  const pattern=instructorCurrentWeeklyPattern(instr.id);
  let html='<div class="card"><div class="card-head"><h2>'+heading+'</h2></div>'
    +'<p>'+intro+'</p>';
  html+='<div class="hours-row" style="flex-wrap:wrap">'+WEEKDAY_KEYS.map(function(day){
    const a=pattern[day];
    return '<div class="cal-row-label" style="min-width:110px;flex:0 0 auto">'+day+'<span class="small muted" style="font-weight:400">'+(a? rangeLabel(a.start,a.end-a.start) : 'Off')+'</span></div>';
  }).join('')+'</div>';
  html+='<div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm primary" onclick="openAvailRuleForm(\''+instr.id+'\')">+ Ongoing change</button><button class="btn sm ghost" onclick="openOneOffForm(\''+instr.id+'\')">+ One-off change</button></div>';

  const rules=instr.availRules.slice().sort(function(a,b){ return toKey(b.effectiveFrom).localeCompare(toKey(a.effectiveFrom)); });
  html+='<h3 style="margin-top:16px">Ongoing changes</h3>';
  if(rules.length===0) html+='<div class="empty-note">None on file.</div>';
  else{
    html+='<table><tr><th>From</th><th>Day</th><th>Hours</th><th></th></tr>'
      +rules.map(function(r){
        const idx=instr.availRules.indexOf(r);
        const upcoming = toKey(r.effectiveFrom) > toKey(simNow());
        return '<tr><td>'+fmtShort(r.effectiveFrom)+(upcoming?' <span class="small muted">(upcoming)</span>':'')+'</td><td>'+r.weekday+'</td><td>'+(r.off?'Not working':rangeLabel(r.start,r.end-r.start))+'</td>'
          +'<td><button class="btn sm ghost" onclick="removeAvailRule(\''+instr.id+'\','+idx+')">Remove</button></td></tr>';
      }).join('')
      +'</table>';
  }

  const oneOffs=instr.oneOffs.slice().sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)); });
  html+='<h3 style="margin-top:16px">One-off changes</h3>';
  if(oneOffs.length===0) html+='<div class="empty-note">None on file.</div>';
  else{
    html+='<table><tr><th>Date</th><th>Hours</th><th></th></tr>'
      +oneOffs.map(function(o){
        const idx=instr.oneOffs.indexOf(o);
        return '<tr><td>'+fmtShort(o.date)+'</td><td>'+(o.off?'Not working':rangeLabel(o.start,o.end-o.start))+'</td>'
          +'<td><button class="btn sm ghost" onclick="removeOneOff(\''+instr.id+'\','+idx+')">Remove</button></td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  return html;
}
function openStaffAvailManager(instrId){ state.staffAvailManagerFor=instrId; state.staffAvailTab='hours'; render(); }
function closeStaffAvailManager(){ state.staffAvailManagerFor=null; render(); }
function renderStaffAvailManagerModal(){
  const instrId=state.staffAvailManagerFor;
  if(!instrId) return '';
  const instr=findInstructor(instrId);

  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">Adjust availability</h3><button class="btn sm ghost" onclick="closeStaffAvailManager()">Close</button></div>';
  // Tabs (Nov 2026, per Allie: "a summer tab in adjust availability for staff"): Hours | Summer.
  const sTab=state.staffAvailTab==='summer'? 'summer' : 'hours';
  html+='<div class="subtabs"><button class="subtab'+(sTab==='hours'?' active':'')+'" onclick="state.staffAvailTab=\'hours\';render()">Hours</button>'
    +'<button class="subtab'+(sTab==='summer'?' active':'')+'" onclick="state.staffAvailTab=\'summer\';render()">Summer</button></div>';
  if(sTab==='summer'){ html+=renderInstructorSummerTab(instr, true)+'</div></div>'; return html; }

function renderAvailRuleModal(){
  const f=state.availRuleForm;
  if(!f) return '';
  const instr=findInstructor(f.instructorId);
  let html='<div class="overlay" onclick="if(event.target===this) closeAvailRuleForm()"><div class="modal">';
  html+='<h3>Ongoing availability change — '+instr.name+'</h3>';
  html+='<p>Takes effect from the date below and holds going forward, until you add another ongoing change for the same day.</p>';
  html+='<label>Day</label><select onchange="setAvailRuleField(\'weekday\',this.value)">'
    +WEEKDAY_KEYS.map(function(d){ return '<option value="'+d+'"'+(d===f.weekday?' selected':'')+'>'+d+'</option>'; }).join('')
    +'</select>';
  html+='<label>Effective from</label><input type="date" value="'+f.effectiveFrom+'" onchange="setAvailRuleField(\'effectiveFrom\',this.value)"/>';
  html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400"><input type="checkbox" style="width:auto;margin:0" '+(f.off?'checked':'')+' onchange="setAvailRuleField(\'off\',this.checked)"/> Not working this day from that date</label>';
  if(!f.off){

// MATHQ page that says ... Mathnasium Summer Camp is now live!"). Each one is limited to certain

var PARENT_ANNOUNCEMENTS=[

function parentAnnouncementsHtml(parent){
  const todayKey=toKey(simNow());

  return PARENT_ANNOUNCEMENTS.filter(function(a){

function renderParent(){

  const parent=parents.find(function(p){ return p.id===parentId; });
  // Same class of bug as #205/#206 (parent login crashing on an unguarded lookup) — here it's the
  // parent record itself: their login is linked to a parentId that doesn't match any row actually
  // loaded into `parents` (a stale/orphaned link, or a row RLS is filtering out), which used to throw
  // "Cannot read properties of undefined (reading 'name')" on the very next line and take down their
  // whole view. Sept 2026, after Allie reported "loading data has failed" for a parent at login.
  if(!parent) return '<div class="card"><p class="small muted">Your login isn\'t linked to a parent record — ask front desk to check your account.</p></div>';

  html+='<div class="card"><div class="card-head"><h2>Welcome, '+parent.name+'</h2><button class="btn sm ghost" onclick="'+(supabaseClient?'logOut()':'parentLogout()')+'">Log out</button></div>'
    +'<p>This is your MATHQ hub for your child’s sessions — see what’s upcoming, request a permanent day/time change, cancel a session, or book a make-up using our live availability calendar.</p>'
    +'<p>You’ll only ever see times that are actually available to book — never other families’ bookings or private centre information.</p>'
    +'<p>Please make all cancellations, schedule-change requests and make-up bookings here rather than by phone, email or text. Cancellations, make-up bookings and permanent day/time changes all update instantly — holds are the only requests our team reviews first. To cancel enrolment, please contact the centre.</p>'

    const studentCredits=credits.filter(function(c){ return c.studentId===sid; })

    const initials=student.name.split(' ').filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();

    html+='<div class="card parent-card">';

    // is just shown alongside it rather than replacing the link. Schedule-change and cancellation
    // requests are still one-at-a-time, since a second one before the first is resolved would just

    const openHoldCount=enrollmentRequests.filter(function(r){ return r.studentId===sid && r.type==='hold' && r.status==='open'; }).length;

    const pendingTimeChange=enrollmentRequests.some(function(r){ return r.studentId===sid && r.type==='time_change' && r.status==='open'; });

        // View-only second parent (Oct 2026, see parentCanManage) — the database refuses their

        +(isStudentInactive(student)? '<span class="small muted" style="text-align:right">Finished '+fmtShort(student.stoppedFrom)+'.<br>You can still book any make-up credits below until they expire.</span>'
        : !canManage? '<span class="small muted" style="text-align:right">View only — please contact the centre<br>to make changes for '+student.name+'.</span>'
        : '<a href="#" class="small" onclick="openHoldRequestForm(\''+sid+'\');return false;">Request a hold</a>'
        +(openHoldCount>0? '<span class="small muted">'+openHoldCount+' hold request'+(openHoldCount===1?'':'s')+' pending</span>' : '')
        +(pendingTimeChange? '<span class="small muted">Schedule change request pending</span>' : '<a href="#" class="small" onclick="openTimeChangeRequestForm(\''+sid+'\');return false;">Change regular day/time</a>')
        // No "Request to cancel enrolment" link (Nov 2026, per Allie) — parents contact the centre;

    const myWaiting=waitlist.filter(function(w){ return w.studentId===sid && w.status==='waiting'; })

    if(myWaiting.length>0){

        // Sept 2026: a session the family self-booked during summer/term break hours gets its own

        const typeBadge=s.termBreak? '<span class="badge soon">Summer</span>' : (s.recurring? '<span class="badge booked">Regular</span>' : (isMakeUp? '<span class="badge available">Make-Up</span>' : '<span class="badge soon">One-off</span>'));
        // Cancelling is always allowed, even same-day past the 10am cutoff — it just won't come

        const noMakeUpToday = toKey(s.date)===toKey(simNow()) && sameDayMakeUpCutoffPassed(); // summer sessions too since Oct 2026 — they now earn credits

}
// Sept 2026, per Allie: a dedicated Summer Schedule tab in the parent view — shows "Coming soon"
// until front desk flips a break's "Visible to parents" toggle on (see setTermBreakVisibility),
// then a per-child tally of summer session credits (their normal sessions/week x however many weeks
// the break spans) plus the two ways to spend them: one recurring weekly time (auto-books every
// matching week at once) or individual singular sessions — both draw from the same tally.
function renderParentSummerTab(parent){
  const activeOrUpcomingTermBreak=termBreaks.filter(function(t){ return t.visibleToParents; }).find(function(t){ return termBreakOn(simNow())===t; })
    || termBreaks.filter(function(t){ return t.visibleToParents && toKey(t.startDate)>=toKey(simNow()); }).sort(function(a,b){ return toKey(a.startDate).localeCompare(toKey(b.startDate)); })[0]
    || null;
  if(!activeOrUpcomingTermBreak){
    return '<div class="card"><h2>Summer Schedule</h2><p class="small muted">Coming soon — check back here once we open summer/term break bookings.</p></div>';
  }
  const tb=activeOrUpcomingTermBreak;
  let html='<div class="card"><h2>Summer Schedule</h2>'
    +'<p>'+tb.label+', '+fmtShort(tb.startDate)+'–'+fmtShort(tb.endDate)+' — the centre runs '+minToLabel(tb.morningStart)+'–'+minToLabel(tb.morningEnd)+' during this period, in place of the usual regular schedule.</p>'
    +'<p>Set up one recurring weekly time (it books every matching week at once) and/or book individual sessions one at a time — whichever suits you, both use the same summer session tally below.</p></div>';

  parent.studentIds.forEach(function(sid){
    const student=findStudent(sid);
    if(!student || student.heldUntil) return; // same defensive guard as renderParent() — see its own comment
    const total=studentTermBreakCredits(tb, sid);
    const remaining=studentTermBreakRemaining(tb, sid);
    const used=total-remaining;
    const picks=studentTermBreakRecurringPicks(tb, sid);
    const atRecurringCap=picks.length>=(student.sessionsPerWeek||0);
    const upcoming=sessions.filter(function(s){ return s.studentId===sid && s.termBreak && s.status==='scheduled' && toKey(s.date)>=toKey(simNow()); })
      .sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });

    html+='<div class="card parent-card"><div class="parent-header"><div><h2>'+student.name+'</h2>'
      +'<div class="small muted">'+student.sessionsPerWeek+'x/week normally · '+termBreakWeekCount(tb)+' week'+(termBreakWeekCount(tb)===1?'':'s')+' of summer hours</div></div></div>';
    html+='<div class="makeup-summary"><div><div class="makeup-count">'+remaining+'</div><div class="makeup-count-label">available</div></div>'
      +'<div><div class="small muted">Used so far</div><b>'+used+' of '+total+'</b></div>'
      +'<div style="margin-left:auto;display:flex;gap:8px">'
        +(!parentCanManage(sid)? '<span class="small muted">View only — contact the centre to book</span>'
        : '<button class="btn sm'+(remaining<=0?' ghost':' primary')+'" '+(remaining<=0?'disabled':'')+' onclick="openTermBreakBookingForm(\''+sid+'\')">Book a single session</button>'
        +'<button class="btn sm ghost" '+((remaining<=0||atRecurringCap)?'disabled':'')+' onclick="openTermBreakRecurringForm(\''+sid+'\')">+ Add a recurring time</button>')
      +'</div></div>';
    if(remaining<=0){ html+='<p class="small muted">No summer session credits left for '+student.name+' this period.</p>'; }

    if(picks.length>0){
      html+='<div class="section-label">Recurring summer times</div>';
      html+='<div class="session-list">'+picks.map(function(p){
        return '<div class="session-row"><div class="session-main"><b>Every '+p.weekday+' '+minToLabel(p.start)+'</b></div>'
          +'<button class="btn sm ghost" onclick="removeTermBreakRecurringPick(\''+sid+'\',\''+p.weekday+'\','+p.start+')">Remove</button></div>';
      }).join('')+'</div>';
    }

    html+='<div class="section-label">Upcoming summer sessions</div>';
    if(upcoming.length===0){ html+='<div class="empty-note">No summer sessions booked yet.</div>'; }
    else{
      html+='<div class="session-list">'+upcoming.map(function(s){
        const pod=findPod(s.podId);
        const instr=s.instructorId? findInstructor(s.instructorId) : null;
        return '<div class="session-row">'
          +'<div class="session-date-chip"><div class="sd-day">'+s.date.toLocaleDateString('en-AU',{weekday:'short'})+'</div><div class="sd-num">'+s.date.getDate()+'</div></div>'
          +'<div class="session-main"><b>'+rangeLabel(s.start,s.duration)+'</b><div class="small muted">'+(pod?pod.name:'—')+' · '+(instr?instr.name:'Unassigned')+(s.recurring?' · recurring':'')+'</div></div>'
          +(parentCanManage(s.studentId)? '<button class="btn sm ghost" onclick="parentCancelTermBreakSession(\''+s.id+'\')">Cancel</button>' : '')
        +'</div>';
      }).join('')+'</div>';
    }
    html+='</div>';
  });
  return html;
}
function renderTermBreakRecurringModal(){

  html+='<label>Weekday</label><select onchange="setTermBreakRecurringField(\'weekday\',this.value)">'
    +WEEKDAY_KEYS.map(function(wd){ return '<option value="'+wd+'"'+(wd===f.weekday?' selected':'')+'>'+wd+'</option>'; }).join('')
  +'</select>';
  const starts=termBreakPossibleStarts(tb, f.duration);
  // Preview against the FIRST real occurrence of this weekday still ahead (today or the break's
  // start, whichever's later) — a plain tb.startDate reference would usually show every time as
  // wide open even when every week's already fully booked, since it'd be checking a date that isn't
  // even this weekday. confirmTermBreakRecurringBooking() below still separately checks each actual
  // week when it books, so this is only ever a preview.
  const now=simNow();
  let previewDate=new Date(toKey(tb.startDate)<toKey(now)? toKey(now) : toKey(tb.startDate));
  while(WEEKDAY_KEYS[(previewDate.getDay()+6)%7]!==f.weekday && toKey(previewDate)<=toKey(tb.endDate)){ previewDate=addDays(previewDate,1); }
  const hasOccurrence=toKey(previewDate)<=toKey(tb.endDate);
  const openStarts=hasOccurrence? starts.filter(function(st){ return termBreakOpenSeatsAt(tb, f.weekday, toKey(previewDate), st, f.duration).seats>0; }) : [];
  if(!hasOccurrence){
    html+='<p class="small muted">No '+f.weekday+'s left in this summer hours period — try a different weekday.</p>';
  } else if(openStarts.length===0){
    html+='<p class="small muted">No open times for '+f.weekday+' — try a different weekday.</p>';
  } else {
    html+='<label>Time</label><select onchange="setTermBreakRecurringField(\'start\',this.value)"><option value="">Choose…</option>'
      +openStarts.map(function(st){ return '<option value="'+st+'"'+(st===f.start?' selected':'')+'>'+minToLabel(st)+'</option>'; }).join('')
    +'</select>';
  }
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeTermBreakRecurringForm()">Cancel</button>'
    +'<button class="btn primary" '+(f.start==null?'disabled':'')+' onclick="confirmTermBreakRecurringBooking()">Book every week</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function renderParentCredit(c, student){
  const st=creditDisplayStatus(c);
  const now=simNow();
  let html='<div class="credit-card st-'+st+'">';
  if(st==='available' || st==='soon'){
    // Minutes (Oct 2026, +30 top-ups): what this credit is worth and what's left of it.
    const left=creditMinutesLeft(c), total=creditTotalMinutes(c);
    html+='<div class="row"><div><b>Make-up credit available — '+(creditPartlyUsed(c)? left+' of '+total+' min left' : total+' min')+'</b><div class="small muted">From missed session on '+fmtShort(c.issuedDate)+'</div></div>'
      + (st==='soon'? '<span class="badge soon">Expires '+fmtShort(c.expiryDate)+'</span>' : '<span class="badge available">Expires '+fmtShort(c.expiryDate)+'</span>') +'</div>';
    if(st==='soon') html+='<div class="banner warn">⏰ Only '+daysUntil(now,c.expiryDate)+' day(s) left to use this credit before it expires.</div>';
    if(creditPartlyUsed(c)){
      html+='<div class="small muted" style="margin:4px 0">'+(total-left)+' min already used as extra time on sessions. Use the rest 30 minutes at a time with the "+30 min" button on an upcoming session.</div>';
    } else if(state.parentBookingCreditId===c.id){ html+=renderSlotPicker(c); }
    else if(parentCanManage(student.id)){
      html+='<button class="btn primary sm" onclick="startBookMakeUp(\''+c.id+'\')">Book a make-up</button>'
        +'<div class="small muted" style="margin-top:4px">Or add it 30 minutes at a time onto upcoming sessions with "+30 min".</div>';
    }
  } else if(st==='booked'){
    const sess=findSession(c.redeemedSessionId);
    // Sept 2026, root cause of "Signed in, but loading your data failed: undefined is not an object
    // (evaluating 'findInstructor(sess.instructorId).name')" — crashed the ENTIRE parent view on
    // login for that family, not just this one credit card, since the whole render throws. Two
    // separate gaps, both now guarded: (1) a make-up can be booked with no Pod chosen yet (front
    // desk's own openBookingForCredit flow explicitly allows this — "no Pod chosen, pick one any
    // time from the Schedule list"), leaving instructorId null; (2) the first fix only checked
    // sess.instructorId was truthy before calling findInstructor() on it, which still crashed
    // whenever instructorId pointed at an instructor no longer in the table at all (a genuinely
    // orphaned id — the reported crash recurred verbatim after deploying fix #1, meaning this was
    // the real remaining case) — findInstructor() can return undefined even for a non-null id, so
    // the RESULT needs checking, not just the id. Also guards sess itself: creditDisplayStatus()
    // returns 'booked' whenever c.status is 'redeemed', even if redeemedSessionId no longer points
    // to a real row (e.g. a deleted duplicate — see dedupe_sessions_v2.sql's ON DELETE SET NULL,
    // which only protects a credit still pointing at a row, not one that already went stale another
    // way), so this card can't assume sess exists either.
    if(!sess){
      html+='<div class="row"><div><b>Make-up booked</b><div class="small muted">Details unavailable — contact us if this looks wrong.</div></div><span class="badge booked">Booked</span></div>';
    } else {
      const instr119=sess.instructorId? findInstructor(sess.instructorId) : null;
      const instrLabel119=instr119? instr119.name : 'an instructor — not yet assigned';
      html+='<div class="row"><div><b>Make-up booked</b><div class="small muted">'+fmtShort(sess.date)+', '+rangeLabel(sess.start,sess.duration)+' with '+instrLabel119+'</div></div><span class="badge booked">Booked</span></div>';
      html+='<button class="btn sm danger" onclick="cancelMakeUp(\''+c.id+'\')">Cancel this booking</button>';
    }
  } else if(st==='completed'){
    const sess=findSession(c.redeemedSessionId);
    html+='<div class="row"><div><b>Make-up completed</b><div class="small muted">Attended '+fmtShort(sess.date)+'</div></div><span class="badge completed">Completed</span></div>';
  } else if(st==='expired'){
    html+='<div class="row"><div><b>Credit expired</b><div class="small muted">Missed session was '+fmtShort(c.issuedDate)+' — window closed '+fmtShort(c.expiryDate)+'</div></div><span class="badge expired">Expired</span></div>';
  }
  html+='</div>';
  return html;
}

// Week by week, any week up to the credit's expiry, every open time grouped by day (Oct 2026, per
// Allie: "my parents want to be able to book further into the future" — this used to show only the
// first 10 open times across this week and next).
function setParentBookingWeek(n){ state.parentBookingWeek=n; render(); }
function renderSlotPicker(credit){
  // Capped at HORIZON_WEEKS: regular sessions are only booked that far ahead, so later weeks would
  // look emptier than they really are.
  const lastWeek=Math.min(HORIZON_WEEKS-1, Math.max(0, Math.round((getMonday(credit.expiryDate)-getMonday(simNow()))/(7*86400000))));
  const week=Math.min(Math.max(0, state.parentBookingWeek||0), lastWeek);
  const opts=openSlotsForCredit(credit, week);
  const monday=addDays(getMonday(simNow()), week*7);
  let html='<div style="margin-top:10px"><div class="small muted" style="margin-bottom:6px">Open times only — you won\'t see who else is booked, or which instructor works which day. Use Later › to look further ahead.</div>';
  html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
    +'<button class="btn sm ghost" '+(week<=0?'disabled':'')+' onclick="setParentBookingWeek('+(week-1)+')">‹ Earlier</button>'
    +'<b style="flex:1;text-align:center">'+(week===0? 'This week' : week===1? 'Next week' : 'Week of '+fmtShort(monday))+'</b>'
    +'<button class="btn sm ghost" '+(week>=lastWeek?'disabled':'')+' onclick="setParentBookingWeek('+(week+1)+')">Later ›</button></div>';
  if(week===0 && sameDayMakeUpCutoffPassed()) html+='<div class="small muted" style="margin-bottom:6px">It\'s past 10:00am, so today isn\'t offered for a make-up.</div>';
  if(opts.length===0) html+='<div class="empty-note">No open times this week — try '+(week<lastWeek? 'a later week.' : 'an earlier week.')+'</div>';
  const byDay={};
  opts.forEach(function(o){ const k=toKey(o.date); (byDay[k]=byDay[k]||[]).push(o); });
  Object.keys(byDay).sort().forEach(function(k){
    html+='<div class="small" style="font-weight:700;margin:8px 0 4px">'+fmtLong(new Date(k))+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
    byDay[k].forEach(function(o){
      // An Online option's podId is a real null — pass '' through the onclick (never the string
      // "null") and let the trailing `true` tell bookSlot to stamp the session as Online.
      html+='<button class="btn sm '+(o.online?'ghost':'primary')+'" title="Book '+rangeLabel(o.start,o.duration)+(o.online?' (Online)':'')+'" onclick="if(confirm(\'Book a make-up on '+fmtShort(o.date)+', '+rangeLabel(o.start,o.duration)+(o.online?' (Online)':'')+'?\')) bookSlot(\''+credit.id+'\',\''+toKey(o.date)+'\','+o.start+','+o.duration+',\''+(o.online? '' : (o.podId||''))+'\',\''+(o.instructorId||'')+'\','+(!!o.online)+')">'+minToLabel(o.start)+(o.online?' · Online':'')+'</button>';
    });
    html+='</div>';
  });
  html+='<div style="margin-top:10px"><button class="btn sm ghost" onclick="cancelBookMakeUp()">Back</button></div></div>';
  return html;
}

   LIVE MODE — login screen + loading real data from Supabase.
   Everything below only runs when supabaseClient exists (a real browser that successfully
   loaded the Supabase SDK). In the Node smoke-test sandbox, or if this file is ever opened
   somewhere offline, supabaseClient is null and the app falls straight through to the
   original demo bootstrap at the very bottom — nothing here can break that path.
   ============================================================ */

function showLoginScreen(errorMsg){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'

    +'<h2>Sign in</h2>'
    +(errorMsg? '<div class="banner danger">'+errorMsg+'</div>' : '')
    +'<label>Email <span class="small muted" style="font-weight:400">(this is your username)</span></label><input id="loginEmail" type="email" autocomplete="username" placeholder="the email your invite was sent to" />'
    +'<label>Password</label>'
    +'<div style="position:relative">'
      +'<input id="loginPassword" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding-right:40px"/>'
      +'<button type="button" id="loginPwToggle" onclick="toggleLoginPasswordVisibility()" aria-label="Show password" title="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;font-size:16px;line-height:1">👁</button>'
    +'</div>'
    +'<button class="btn" onclick="doLogin()">Sign in</button>'
    +'<p style="text-align:center;margin-top:12px"><a href="#" onclick="showForgotPasswordScreen();return false;" class="small">Forgot password?</a></p>'
    +'</div></div>';
  const pw=document.getElementById('loginPassword');
  if(pw) pw.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
}

// Lets someone see exactly what's actually in the password field before submitting — added Sept
// 2026 alongside the "invalid login details" investigation, since the most likely cause turned out
// to be Chrome autofill silently filling in a stale saved password: it looks right (dots, right
// length) but isn't, and there was previously no way to check without retyping blind.
function toggleLoginPasswordVisibility(){
  const pw=document.getElementById('loginPassword');
  const btn=document.getElementById('loginPwToggle');
  if(!pw || !btn) return;
  const showing = pw.type==='text';
  pw.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🚫';
  btn.title = showing ? 'Show password' : 'Hide password';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

function doLogin(){
  // Trimmed on both ends (Sept 2026, per Allie: "sometimes it says invalid login details") — a
  // trailing/leading space (easy to pick up from autocomplete, or a keyboard's own autocorrect on
  // a phone) makes the password no longer match, and Supabase's error for that is the same generic
  // "Invalid login credentials" as an actually-wrong password, so it looks identical from here.
  // This can't fix every cause of that message (a genuinely wrong password still needs a reset —
  // see "Forgot password?" below), but it removes the one silent, invisible-to-the-user cause.
  const email=(document.getElementById('loginEmail').value||'').trim();
  const password=(document.getElementById('loginPassword').value||'').trim();
  if(!email || !password){ showLoginScreen('Enter your email and password.'); return; }
  supabaseClient.auth.signInWithPassword({email, password}).then(function(res){
    if(res.error){ showLoginScreen(res.error.message); return; }
    afterLogin();
  }).catch(function(err){
    // A network hiccup (dropped connection, Supabase briefly unreachable) previously failed
    // silently here — the button just did nothing, with no feedback at all — since only res.error
    // was ever handled, never a rejected promise. Sept 2026, per Allie: "sometimes it says invalid
    // login details" — this doesn't produce that exact message, but it's the other way a sign-in
    // attempt can go wrong unexplained, so it gets its own clear message instead of failing quietly.
    showLoginScreen('Could not reach the server — check your connection and try again.');
  });
}

function showForgotPasswordScreen(msg, isError){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'

    +'<h2>Reset your password</h2>'
    +'<p class="small muted">Enter the email your account was set up with — we\'ll send a link to reset your password.</p>'
    +(msg? '<div class="banner '+(isError?'danger':'info')+'">'+msg+'</div>' : '')
    +'<label>Email</label><input id="forgotEmail" type="email" autocomplete="username" />'
    +'<button class="btn" id="forgotSendBtn" onclick="sendPasswordReset()">Send reset link</button>'
    +'<p style="text-align:center;margin-top:12px"><a href="#" onclick="showLoginScreen();return false;" class="small">Back to sign in</a></p>'
    +'</div></div>';
}
// One send per press (Oct 2026): the auth logs showed many parents sending two reset requests 1–2s
// apart (a double-tap) — each new link cancels the previous one, so opening the FIRST email then
// said "expired". The button is disabled while sending.
var passwordResetInFlight=false;
function sendPasswordReset(){
  if(passwordResetInFlight) return;
  const email=(document.getElementById('forgotEmail').value||'').trim();
  if(!email){ showForgotPasswordScreen('Enter your email address.', true); return; }
  passwordResetInFlight=true;
  const btn=document.getElementById('forgotSendBtn');
  if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  supabaseClient.auth.resetPasswordForEmail(email, {redirectTo:SITE_URL}).finally(function(){ passwordResetInFlight=false; }).then(function(){
    // Same confirmation whether or not that email is actually registered — never reveal which
    // emails have accounts.
    showForgotPasswordScreen('If that email has an account, a reset link is on its way. Use the newest email if you get more than one.', false);
  }).catch(function(){
    showForgotPasswordScreen('Could not reach the server — check your connection and try again.', true);
  });
}

// Reached via the link in either an invite email or a password-reset email — Supabase's SDK
// parses the token in the URL and establishes a session automatically; this just asks for (and
// sets) the actual new password before letting them into the app proper.
// Oct 2026, per Allie: parents setting up their account were confused about what their "username"
// is — this screen now says plainly that it's their email address, and shows it (read from the
// invite/reset link's own session). The email sits in a read-only autocomplete="username" field so
// phones/password managers save it together with the new password.
var setPasswordEmail='';
function showSetPasswordScreen(errorMsg){
  const app=document.getElementById('app');
  app.innerHTML =
    '<div class="login-wrap"><div class="card login-card">'

    +'<h2>Set your password</h2>'
    +(errorMsg? '<div class="banner danger">'+errorMsg+'</div>' : '')
    +'<div class="banner accent" id="usernameBanner"><b>Your username is your email address'+(setPasswordEmail? ':' : (EMAIL_LINK? ' — the one this link was emailed to.' : '.'))+'</b>'
      +(setPasswordEmail? '<div style="font-size:1.05rem;font-weight:700;margin-top:4px;word-break:break-all">'+setPasswordEmail+'</div>' : '')
      +'<div class="small" style="margin-top:4px">Choose a password below. From now on you\'ll sign in with this email address and that password.</div></div>'
    +'<label>Username (your email)</label><input id="setPwEmail" type="email" autocomplete="username" readonly value="'+setPasswordEmail+'" style="background:var(--surface-2)"/>'
    +'<label>New password</label><input id="newPassword" type="password" autocomplete="new-password" />'
    +'<label>Confirm password</label><input id="newPassword2" type="password" autocomplete="new-password" />'
    +'<button class="btn" onclick="setNewPassword()">Set password</button>'
    +'</div></div>';
  // (Not for a scanner-proof link: nobody's signed in by it yet, and any session in this browser
  // could be someone else's.)
  if(!setPasswordEmail && supabaseClient && !EMAIL_LINK){
    supabaseClient.auth.getUser().then(function(r){
      const email=r && r.data && r.data.user && r.data.user.email;
      if(email){ setPasswordEmail=email; showSetPasswordScreen(errorMsg); }
    });
  }
}
function setNewPassword(){
  const p1=document.getElementById('newPassword').value||'';
  const p2=document.getElementById('newPassword2').value||'';
  if(p1.length<6){ showSetPasswordScreen('Password must be at least 6 characters.'); return; }
  if(p1!==p2){ showSetPasswordScreen('Passwords don\'t match.'); return; }
  // Scanner-proof link: only now is the link actually used (signs them in), then the password is set.
  const verify = EMAIL_LINK
    ? supabaseClient.auth.verifyOtp({token_hash:EMAIL_LINK.tokenHash, type:EMAIL_LINK.type}).then(function(v){
        if(v.error) return {linkError:v.error};
        EMAIL_LINK=null;
        try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
        const u=v.data && v.data.user; if(u && u.email) setPasswordEmail=u.email;
        return {};
      })
    : Promise.resolve({});
  verify.then(function(v){
    if(v.linkError){
      EMAIL_LINK=null;
      try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
      showForgotPasswordScreen('That link has expired or was already used. Enter your email below and we\'ll send you a fresh one.', true);
      return null;
    }
    return supabaseClient.auth.updateUser({password:p1});
  }).then(function(res){
    if(!res) return;
    if(res.error){ showSetPasswordScreen(res.error.message); return; }
    // Queued rather than toast()-ed: toast() renders immediately, which would draw the app before
    // afterLogin() has loaded this person's data. afterLogin's own render picks this up instead.
    state.toast='You\'re all set! Next time, sign in with '+(setPasswordEmail||'your email address')+' and the password you just chose.';
    setTimeout(function(){ state.toast=null; renderUnlessEditing(); }, 12000);
    afterLogin();
  });
}

function logOut(){
  supabaseClient.auth.signOut().then(function(){ location.reload(); });
}

// Live sync across open tabs/devices (Sept 2026, per Allie: "if there are two members of staff
// logged on at the same time, how can we see what the other has done in real time?"). Before this,
// every tab held only a frozen snapshot from whenever it last loaded — someone else's check-in,
// booking, or Pod change was invisible until a full page reload. Subscribes to every table
// loadAllData() reads from; ANY insert/update/delete on ANY of them (from anyone, including this
// tab's own writes echoing back — harmless) schedules a fresh loadAllData(). Debounced so a burst of
// related writes (e.g. regenerateAllRecurring() touching dozens of rows in one go) collapses into a
// single re-fetch instead of one per row.
//
// Deliberately just re-runs loadAllData() + render() — nothing fancier. Every modal/form lives in
// the separate `state` object and stores plain field values (a studentId string, a date, a number),
// never a direct reference into `students`/`sessions`/etc., so swapping those arrays out for fresh
// ones from the server can never yank a form out from under whoever has one open. regenerateAllRecurring()
// is deliberately NOT re-run here — whichever tab actually made the change already ran it (and
// persisted the result), so re-running it again on every other tab's every refresh would risk two
// tabs racing to fill the same gap at once for no benefit.
// Which in-memory "group" each realtime table feeds. A change to any ONE table only needs the
// group(s) it belongs to re-fetched and re-applied — not the other ~14 groups' worth of tables,
// which is what a bare loadAllData() re-run used to do on every single write anywhere (Sept 2026,
// found while tracing a Supabase egress/fair-use warning: every open tab — staff, instructor, or
// parent — was pulling the ENTIRE database on every write from ANYONE, plus again on an
// unconditional 30s timer, compounding hard across concurrently-open tabs and growing history).
var DATA_GROUP_TABLES={
  instructors:['instructors','instructor_avail_rules','instructor_one_offs'],
  pods:['pods','pod_shift_blocks','pod_shift_assignments','pod_shift_one_off_coverage'],
  podDayOverrides:['pod_day_overrides','pod_floor_assignments'],
  students:['students','student_recurring_slots','student_holds','student_pod_assignments','student_plan_changes','student_plan_change_recurring','student_guardians'],
  parents:['parents'],
  sessions:['sessions'],
  credits:['credits'],
  coverageRequests:['coverage_requests','coverage_request_notified_instructors','coverage_offers'],
  waitlist:['waitlist_entries'],
  closedDays:['closed_days'],
  enrollmentRequests:['enrollment_requests','enrollment_request_recurring','enrollment_request_previous_recurring'],
  staffMembers:['staff_members','staff_one_offs'],
  staffRosteredShifts:['staff_rostered_shifts'],
  staffAttendance:['staff_attendance'],
  termBreaks:['term_breaks','term_break_coverage','instructor_summer_availability'],
};
var TABLE_TO_GROUP={};
Object.keys(DATA_GROUP_TABLES).forEach(function(g){ DATA_GROUP_TABLES[g].forEach(function(t){ TABLE_TO_GROUP[t]=g; }); });
var LIVE_SYNC_TABLES=Object.keys(TABLE_TO_GROUP);

var liveSyncTimer=null;
var pendingLiveSyncTables={};
function scheduleLiveSync(tableName){
  if(tableName) pendingLiveSyncTables[tableName]=true;
  if(liveSyncTimer) clearTimeout(liveSyncTimer);
  liveSyncTimer=setTimeout(function(){
    liveSyncTimer=null;
    const tables=Object.keys(pendingLiveSyncTables);
    pendingLiveSyncTables={};
    const groups={};
    tables.forEach(function(t){ const g=TABLE_TO_GROUP[t]; if(g) groups[g]=true; });
    loadDataGroups(Object.keys(groups)).then(renderUnlessEditing).catch(function(err){ console.error('Live sync refresh failed', err); });
  }, 500);
}
// A changed session is patched straight in from the live-sync message itself (Oct 2026, per Allie:
// "its slow ... when you check kids into the centre") — every check-in used to make every open
// screen re-download all ~10,000 sessions. Front desk / instructor logins only; a parent's view merges
// in extra occupancy data, so it still reloads the group (they rarely see others' changes anyway).
var liveRenderTimer=null;
function applyLiveSessionChange(payload){
  if(!currentUser || currentUser.role==='parent' || !payload) return false;
  const ev=payload.eventType;
  if(ev==='DELETE'){
    const id=payload.old && payload.old.id;
    if(!id) return false;
    sessions=sessions.filter(function(s){ return s.id!==id; });
  } else if(ev==='INSERT' || ev==='UPDATE'){
    const row=payload.new;
    if(!row || !row.id || !row.the_date) return false;
    const fresh=sessionFromRow(row);
    const existing=sessions.find(function(s){ return s.id===row.id; });
    if(existing) Object.assign(existing, fresh); else sessions.push(fresh);
  } else return false;
  markSessionsChanged();
  if(liveRenderTimer) clearTimeout(liveRenderTimer);
  liveRenderTimer=setTimeout(function(){ liveRenderTimer=null; renderUnlessEditing(); }, 300);
  return true;
}
function subscribeToLiveUpdates(){
  let channel=supabaseClient.channel('live-updates');
  LIVE_SYNC_TABLES.forEach(function(t){
    channel=channel.on('postgres_changes', {event:'*', schema:'public', table:t}, function(payload){
      if(t==='sessions' && applyLiveSessionChange(payload)) return;
      scheduleLiveSync(t);
    });
  });
  // Logged rather than silent — Realtime depends on several things lining up (the table actually
  // being in the supabase_realtime publication, the project's Realtime feature, the connecting
  // user's own permissions) that can fail in ways invisible from the UI itself. If SUBSCRIBED never
  // shows up in the console, the 30-second heartbeat below is still catching every change anyway —
  // this is a "faster when it works" layer, not the only thing keeping tabs in sync.
  channel.subscribe(function(status, err){
    if(status==='SUBSCRIBED'){ console.log('Live sync connected — changes from other logins arrive within about a second.'); }
    else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
      console.error('Live sync could not connect ('+status+') — still syncing every 30 seconds via the fallback refresh.', err||'');
    }
  });
}

// Guards the one-time-only setup below (the Realtime subscription + the fallback heartbeat) against
// running more than once per page load (Sept 2026, root cause of "Signed in, but loading your data
// failed: cannot add postgres_changes callbacks for realtime:live-updates after subscribe()") —
// afterLogin() itself can legitimately run more than once (doLogin()'s own success callback calls it
// directly, AND supabaseClient.auth.signInWithPassword() separately fires a SIGNED_IN event through
// the onAuthStateChange listener further below for that SAME login, which calls it again; same
// double-call shape for setNewPassword()/updateUser()). Re-running the data load on a second call is
// harmless — but subscribeToLiveUpdates() calling supabaseClient.channel('live-updates') a second
// time returns the SAME channel object the first call already subscribed, and Supabase's realtime-js
// client refuses to add more postgres_changes listeners to an already-subscribed channel, throwing
// exactly that error and aborting the rest of afterLogin() — which is why data "failed to load" even
// though sign-in itself succeeded. A real logout always does a full page reload (see logOut()), so
// this only ever needs to guard one page load's worth of logins, never a genuine later one.
var liveSyncStarted=false;
function afterLogin(){
  supabaseClient.auth.getUser().then(function(res){
    if(res.error || !res.data.user){ showLoginScreen('Session expired — sign in again.'); return; }
    const uid=res.data.user.id;
    supabaseClient.from('app_users').select('role,instructor_id,parent_id').eq('auth_user_id', uid).single().then(function(r){
      if(r.error || !r.data){ showLoginScreen("Your account isn't set up yet — ask front desk to add you."); return; }
      currentUser={role:r.data.role, instructorId:r.data.instructor_id, parentId:r.data.parent_id, email:res.data.user.email};
      loadAllData().then(function(){
        state.role=currentUser.role;
        applyPromotions();
        applyPlanChanges();
        regenerateAllRecurring();
        autoCheckOutPastClose();
        render();
        loadLoginStatuses().then(renderUnlessEditing); // invite status for the Login columns (staff only, Oct 2026)
        // Live mode has no demo-clock button to trigger applyPromotions()/applyPlanChanges() as
        // days actually pass — real time just ticks forward on its own. Re-checking both on this
        // heartbeat (already needed for the checked-in "time left" countdown, see the offline-mode
        // comment below) means a scheduled promotion or plan change takes effect within 30 seconds
        // of its date arriving, not only the next time someone happens to re-open the page.
        //
        // This heartbeat also re-runs loadAllData() itself now (5.36, live sync) — a guaranteed,
        // always-works fallback for seeing another login's changes even if the faster Realtime push
        // subscription below never actually connects (it depends on several things — the table
        // being in the right Supabase publication, project settings, permissions — that can silently
        // fail in ways invisible from here). Worst case with Realtime working, staff see each
        // other's changes within about a second; worst case without it, within 3 minutes; either
        // way, never "not until someone reloads the page" again.
        //
        // Stretched from every 30s to every 3 minutes (Sept 2026, egress fix) — this is purely a
        // fallback for the rare case Realtime isn't connected, and it was doing a FULL re-fetch of
        // every table, unconditionally, per open tab, every 30 seconds, all day — one of the two
        // biggest contributors (with the old whole-database live-sync refresh above) to a Supabase
        // Fair Use Policy bandwidth warning. Realtime (subscribeToLiveUpdates below) is now the fast
        // path for real changes; this timer only needs to be frequent enough to catch a missed push.
        // Guarded by liveSyncStarted (see afterLogin() above) — this block sets up long-lived,
        // page-scoped resources (a repeating timer, a Realtime subscription), so it must only ever
        // run once per page load even though afterLogin() itself can legitimately run more than once.
        if(!liveSyncStarted){
          liveSyncStarted=true;
          setInterval(function(){
            loadAllData().then(function(){ applyPromotions(); applyPlanChanges(); autoCheckOutPastClose(); return loadLoginStatuses(); }).then(renderUnlessEditing)
              .catch(function(err){ console.error('Heartbeat refresh failed', err); });
          }, 180000);
          subscribeToLiveUpdates();
        }
      }).catch(function(err){
        console.error(err);
        // Surface the actual database error (missing table, RLS permission denial, etc.) instead of a
        // generic "check your connection" message — the connection is almost never the real cause,
        // and the vague message left this undiagnosable without pulling up the browser console (Sept
        // 2026, after "still saying loading data failed" persisted even once the expected fix — a
        // missing migration — had already been applied, meaning the true cause was something else
        // entirely and we needed the real error text to find it).
        const detail=(err && (err.message||err.error_description||err.hint||err.details)) || String(err);
        showLoginScreen('Signed in, but loading your data failed: '+detail);
      });
    });
  });
}

// Guards against an OLDER, slower live-sync refresh response overwriting FRESHER, already-applied
// state for the same group (Sept 2026, per Allie: "student names disappearing sometimes once signed
// in, but then re-appearing" — traced to the "Who's here right now" board, which silently drops any
// checked-in session whose findStudent(s.studentId) doesn't resolve). scheduleLiveSync's 500ms
// debounce only coalesces events for the SAME table arriving within that one window — two refreshes
// for the same table triggered more than 500ms apart (routine under real traffic, especially now
// that self-service writes actually succeed and this centre's `sessions` table has grown past
// several thousand real rows to page through) can genuinely overlap in flight, with nothing
// guaranteeing the one DISPATCHED earlier also RESOLVES first. If a slower, now-stale response for
// an earlier moment in time lands after a faster, fresher one already applied, it can silently wipe
// out a session/student that really does still exist — until the next refresh catches up and it
// reappears. nextGroupSeq() is called synchronously at the moment a fetch is dispatched (dispatch
// order, not resolution order); the mutation that applies a group's result checks
// isLatestGroupSeq() right before writing and simply discards its own answer if a newer fetch for
// that same group has been dispatched since — the newer one (already resolved, or still in flight)
// is always the one allowed to win.
var groupFetchSeq={};
function nextGroupSeq(groupName){ return (groupFetchSeq[groupName]=(groupFetchSeq[groupName]||0)+1); }
function isLatestGroupSeq(groupName, seq){ return groupFetchSeq[groupName]===seq; }

// Fetches every table this logged-in user can see (Row Level Security already scopes each query
// to their role) and reshapes it into the exact in-memory structures the rest of the app already
// reads/writes — so every existing render/business-logic function keeps working completely
// unchanged, whether its data came from the demo arrays or from a real database.
//
// Restructured (Sept 2026, egress fix) into one small fetch-and-apply function per DATA_GROUP_TABLES
// group above, so a targeted live-sync refresh can re-run just the 1-2 groups a given write actually
// touched instead of always re-running every group. loadAllData() itself is unchanged in effect —
// it's now just "run every group" — so the login/heartbeat full-reload path behaves exactly as
// before, table-for-table and column-for-column.
//
// Supabase/PostgREST silently caps a plain .select() at 1000 rows (its default page size) — with
// well over 1000 real session rows once a centre's been running a few months, a plain select()
// here was quietly loading only an arbitrary ~1000-row slice of the sessions table and treating
// that as the whole schedule. Every "session per student per day" dedup check downstream then
// saw a huge blind spot: a real, already-booked session that just didn't happen to be in that
// slice looked exactly like "nothing booked yet" and got a brand-new duplicate row inserted for
// it — on every single page load, forever, since the new duplicate had no better a chance of
// landing in the next arbitrary 1000-row slice either. That's what actually produced the tens of
// thousands of duplicate rows discovered Sept 2026 (see the one-time cleanup script), and why the
// schedule looked like it was silently rewriting itself. Paginate every table in full via .range()
// so this can never truncate silently again, no matter how large any of them grow.
function fetchTablePaginated(name, sel){
  const PAGE=1000;
  return (function fetchPage(from, acc){
    return supabaseClient.from(name).select(sel).range(from, from+PAGE-1).then(function(r){
      if(r.error) throw r.error;
      const rows=r.data||[];
      const all=acc.concat(rows);
      if(rows.length<PAGE) return all; // last page — fewer than a full page means nothing left
      return fetchPage(from+PAGE, all);
    });
  })(0, []);
}

function fetchInstructorsGroup(){
  return Promise.all([
    fetchTablePaginated('instructors','id,name,email,year_min,year_max,auth_user_id,active,pack_up_custom_colors,combined_cap_override'),
    fetchTablePaginated('instructor_avail_rules','instructor_id,weekday,effective_from,off,start_min,end_min'),
    fetchTablePaginated('instructor_one_offs','instructor_id,the_date,off,start_min,end_min'),
  ]).then(function(t){
    const [instrRows,availRows,oneOffRows]=t;
    instructors=instrRows.map(function(r){ return {
      id:r.id, name:r.name, email:r.email, yearMin:r.year_min, yearMax:r.year_max,
      authUserId:r.auth_user_id, active: r.active!==false, packUpCustomColors: !!r.pack_up_custom_colors,
      combinedCapOverride: r.combined_cap_override==null? null : r.combined_cap_override,
      availRules: availRows.filter(function(a){ return a.instructor_id===r.id; }).map(function(a){
        return {weekday:a.weekday, effectiveFrom:new Date(a.effective_from), off:a.off, start:a.start_min, end:a.end_min};
      }),
      oneOffs: oneOffRows.filter(function(o){ return o.instructor_id===r.id; }).map(function(o){
        return {date:new Date(o.the_date), off:o.off, start:o.start_min, end:o.end_min};
      }),
    }; });
  });
}

function fetchPodsGroup(){
  return Promise.all([
    fetchTablePaginated('pods','id,name,capacity'),
    fetchTablePaginated('pod_shift_blocks','id,pod_id,weekday,start_min,end_min,closes_late'),
    fetchTablePaginated('pod_shift_assignments','block_id,instructor_id,effective_from'),
    fetchTablePaginated('pod_shift_one_off_coverage','block_id,the_date,instructor_id'),
  ]).then(function(t){
    const [podRows,blockRows,assignRows,coverRows]=t;
    pods=podRows.map(function(r){ return {id:r.id, name:r.name, capacity:r.capacity}; });

// A parent's own read of `sessions` above (parent_read_own_children_sessions) is deliberately
// scoped to just their own kids — nobody else's family should be visible to them at all. But every
// capacity/availability check in the app (pickBestPod, podCapacityBlocked, peakConcurrency, the
// combined online ratio) works by scanning the WHOLE sessions array for a given Pod/date/time —
// with a parent's own fetch only ever containing their own child(ren)'s handful of rows, every Pod
// looked almost empty no matter how full it really was, so a parent's own schedule-change/make-up
// picker could get availability wrong in either direction (Sept 2026, per Allie: "as a parent it's
// still not showing availability" — the real root cause behind the previously-unresolved "fix
// parent make-up booking RLS gap" item; the earlier date-math fix to standingSlotHasAvailability
// couldn't touch this, since the underlying data was never reaching the parent's browser at all).
//
// parent_session_occupancy() is a SECURITY DEFINER Postgres function (see supabase_schema.sql) that
// hands back every OTHER family's session as just {id, pod_id, the_date, start_min, duration,
// status, online, instructor_id, instructor_id_2} — enough to do real capacity math, but
// deliberately never student_id, so a parent can never learn WHO occupies another family's seat,
// only that the seat is occupied. Rows already present from the parent's own direct fetch above are
// skipped by id, so their own children's sessions are never double-counted.
// Real root cause found Sept 2026 (per Allie: "still letting me book whatever whenever" even after
// the parent_session_occupancy RPC + SQL patch were confirmed live) — a diagnostic added right here
// caught it directly: the RPC call was silently capped at exactly 1000 rows, PostgREST's default
// page size for any query (including a set-returning RPC call, not just plain .from() selects — see
// fetchTablePaginated()'s own comment for the .from() side of this same class of bug). A real centre
// easily has more than 1000 upcoming sessions across every family once you project out the full
// recurring-booking horizon, so the previous single, unpaginated .rpc() call was quietly discarding
// most of the other-family occupancy data it was supposed to provide — undercounting almost every
// Pod's real bookings, which is exactly why every day/time still looked wide open to a parent. Fixed
// by paginating the RPC call exactly like fetchTablePaginated() already does for regular tables —
// supabase-js supports chaining .range() onto .rpc() for a set-returning function the same way it
// does for .from().select().
function fetchParentOccupancyIfNeeded(){
  if(!supabaseClient || !currentUser || currentUser.role!=='parent') return;
  const known={}; sessions.forEach(function(s){ known[s.id]=true; });
  const PAGE=1000;
  return (function fetchPage(from, acc){
    return supabaseClient.rpc('parent_session_occupancy').range(from, from+PAGE-1).then(function(r){
      if(r.error) throw r.error;
      const rows=r.data||[];
      const all=acc.concat(rows);
      if(rows.length<PAGE) return all; // last page — fewer than a full page means nothing left
      return fetchPage(from+PAGE, all);
    });
  })(0, []).then(function(allRows){
    let mergedCount=0;
    allRows.forEach(function(row){
      if(known[row.id]) return; // already have the real, fully-detailed row for one of their own kids
      sessions.push({
        id:row.id, studentId:null, podId:row.pod_id, instructorId:row.instructor_id, instructorId2:row.instructor_id_2,
        handoff:null, date:new Date(row.the_date), start:row.start_min, duration:row.duration, status:row.status,
        actualStart:null, actualEnd:null, checkInOffset:null, checkedOut:false,
        bookedBy:'staff', recurring:false, creditId:null, online:row.online||false, termBreak:false,
      });
      mergedCount++;
    });
    console.log('[mathq] parent_session_occupancy: RPC returned '+allRows.length+' other-family session(s) total (paginated), '+mergedCount+' newly merged, sessions array now has '+sessions.length+' total.');
  }).catch(function(err){
    console.error('[mathq] parent_session_occupancy RPC failed:', err);
  });
}
// Interactive diagnostic (Sept 2026) — callable from the browser console as, e.g.,
// mathqDebugAvailability('Mon', '3:30pm', 90) — to see exactly why a given day/time looks open:
// which Pod(s) are considered staffed there, how many sessions are already booked that day per Pod
// (including other families', via the same merged data the picker itself uses), and whether that
// pushes any Pod over capacity. Kept permanently (harmless, doesn't run unless called) since it's a
// handy way to spot-check the live picker against real data going forward.
function mathqDebugAvailability(weekdayInput, timeLabel, duration){
  duration = duration || 90;
  const wd = WEEKDAY_KEYS.find(function(w){ return w.toLowerCase().indexOf(String(weekdayInput).toLowerCase().slice(0,3))===0; });
  if(!wd){ console.error('[mathq] Unrecognized weekday "'+weekdayInput+'" — use Mon, Tue, Wed, Thu or Fri.'); return; }
  const m=String(timeLabel).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);
  if(!m){ console.error('[mathq] Unrecognized time "'+timeLabel+'" — use a format like "3:30pm" or "3pm".'); return; }
  let h=parseInt(m[1],10); const min=m[2]?parseInt(m[2],10):0; const period=m[3].toLowerCase();
  if(period==='pm' && h!==12) h+=12; if(period==='am' && h===12) h=0;
  const start=h*60+min;
  const occurrence=nextRegularOccurrence(wd, simNow());
  const dateKey=toKey(occurrence);
  const result={
    weekday:wd, checkedAgainstDate:dateKey, start:start, startLabel:minToLabel(start), duration:duration,
    loggedInAs: currentUser? currentUser.role : '(offline/demo mode)',
    totalSessionsInBrowserMemory: sessions.length,
    standingSlotHasAvailability_result: standingSlotHasAvailability(wd, start, duration, 6),
    perPod: pods.map(function(p){
      const cov=podCoverageDetail(p.id, wd, start, duration, occurrence);
      const blocked=podCapacityBlocked(p.id, dateKey, {start:start, duration:duration});
      const dayList=sessionsForDay(p.id, dateKey);
      return {
        pod:p.name, capacity:podCapacity(p.id), staffedHere:cov.ok, primaryInstructorId:cov.primaryInstructorId,
        thisSlotWouldOverflowCapacity:blocked,
        sessionsAlreadyBookedThisPodThatDay: dayList.length,
        sessionDetail: dayList.map(function(s){ return {start:minToLabel(s.start), durationMin:s.duration, isOwnChild: s.studentId!=null}; }),
      };
    })
  };
  console.log('[mathq] availability debug for '+wd+' '+minToLabel(start)+':', result);
  return result;
}
