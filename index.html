// Per-Pod cards for the day the Schedule section is showing — capacity, who's covering it, and the
// actual seated roster, all together (brought back Sept 2026, per Allie: "we need to bring back
// the pod-based scheduling" — this had briefly been split into a compact badge/pill strip plus one
// separate flat student list; this restores the single per-Pod view, without changing any of the
// underlying actions). "Assign" on a card's header is about STAFFING the Pod (which instructor runs
// it) — a different concern from which students sit in it, which is each row's own "Move to"
// dropdown (locationOptionsHtml/setSessionLocation).
// Names of every student sitting at each Pod on the given day — for TODAY that means "checked in
// and not yet checked out" (a live, moment-to-moment roster: a name drops off the instant that
// student is checked out, freeing the seat), which is what drives the live 1/8, 2/8... occupancy
// badge in renderPodSummaryStrip() below (5.28). For any OTHER day — a day already past, whose
// checked-in students have long since been checked out — dropping the "not checked out" filter
// turns this into that day's actual historical seating record instead: everyone who ever attended
// there that day, kept for training/adjustment reference (Sept 2026, per Allie). A future day
// naturally comes back empty either way, since nobody's attended yet.
function checkedInNamesByPod(dayKey){
  const live = dayKey===toKey(simNow());
  const byPod={};
  sessionsOnDate(dayKey).forEach(function(s){
    if(s.status!=='attended' || !s.podId) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byPod[s.podId]=byPod[s.podId]||[]).push(student.name);
  });
  Object.keys(byPod).forEach(function(podId){ byPod[podId].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byPod;
}
// Same idea, keyed by instructor instead of Pod, for whoever's sitting in that instructor's Online
// group — the Online strip's own equivalent of checkedInNamesByPod, live-vs-historical the same way.
function checkedInNamesByOnlineInstructor(dayKey){
  const live = dayKey===toKey(simNow());
  const byInstr={};
  sessions.forEach(function(s){
    if(s.status!=='attended' || !s.online || toKey(s.date)!==dayKey) return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    (byInstr[s.instructorId]=byInstr[s.instructorId]||[]).push(student.name);
  });
  Object.keys(byInstr).forEach(function(id){ byInstr[id].sort(function(a,b){ return a.localeCompare(b, undefined, {sensitivity:'base'}); }); });
  return byInstr;
}
// The combined (physical + online) headcount an instructor is personally minding on a given day —
// the number the 1:9 ratio caps — mirroring checkedInNamesByPod()'s live-vs-historical rule: live
// (checked in, not yet checked out) for today, everyone who attended that day at all for any other
// day. Deliberately independent of instructorCombinedPeak() (below), which stays schedule/peak-based
// for booking-time capacity checks on a session that may not have happened yet — this is the
// "how many are actually sitting with this instructor right now" figure for the summary strip badge.
function instructorOccupantCount(instructorId, dayKey){
  const live = dayKey===toKey(simNow());
  return sessions.filter(function(s){
    if(s.status!=='attended' || toKey(s.date)!==dayKey) return false;
    if(live && s.checkedOut) return false;
    return s.instructorId===instructorId || s.instructorId2===instructorId;
  }).length;
}

// One row of the seating table — a single session, with its own "Move to" (Pod/Online) picker and
// check-in/no-show/cancel actions. Factored out so every card (each Pod, each Online instructor
// group, and Unassigned) renders rows identically — the exact same markup the old single flat list
// used per row, just grouped differently now.
function sessionRowHtml(sess, weekday, dayKey, now){
  const student=findStudent(sess.studentId);
  if(!student) return '';
  const actualNote = sess.actualStart!=null? ' · checked in '+minToLabel(sess.actualStart)+', ran to '+minToLabel(sess.actualEnd) : '';
  let handoffNote='';
  if(sess.instructorId2){
    handoffNote = ' · '+findInstructor(sess.instructorId).name+' until '+minToLabel(sess.handoff)+', then '+findInstructor(sess.instructorId2).name;
  } else if(sess.instructorId){
    handoffNote = ' · with '+findInstructor(sess.instructorId).name+(sess.online? ' (online)' : '');
  }
  let html='<tr><td><b>'+student.name+'</b></td><td>'+yearLabel(student.year)+'</td><td>'+rangeLabel(sess.start,sess.duration)+topUpBadgeHtml(sess)+'</td>';
  // Oct 2026: this table now lives on the Today tab's day-by-day "Pod seating" (renderPodSummaryStrip,
  // per Allie: "show me all the kids expected to show up today... so we can organise where everyone
  // will be sitting in advance"), so its picker is a ONE-OFF move for this session only
  // (setSessionLocation). Permanent weekly moves are made on the Schedule tab's standing roster
  // instead (renderRegularSeating / setPermanentStudentLocation).
  html+='<td><select onchange="setSessionLocation(\''+sess.id+'\',this.value)">'
    +'<option value=""'+(sessionLocationValue(sess)===''?' selected':'')+'>Unassigned</option>'
    +locationOptionsHtml(weekday, dayKey, sess.start, sess.duration, sessionLocationValue(sess), sess.id)
  +'</select></td>';
  const kindNote = sess.creditId? ' · <span class="badge firstday">Make-up</span>' : sess.recurring? ' · regular' : ' · <span class="badge firstday">One-off</span>';
  html+='<td class="small muted">'+sess.status+(sess.bookedBy==='parent'?' · 👪 parent':'')+kindNote+handoffNote+actualNote+'</td>';
  let actions='';
  if(sess.status==='scheduled' && toKey(sess.date)<=toKey(now)){
    actions+='<button class="btn sm success" onclick="openCheckIn(\''+sess.id+'\')">✓ Check in</button>'
      +'<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'excused\')" title="They let us know in advance — issues a make-up credit">Issue Make-up Credit</button>'
      +'<button class="btn sm danger" onclick="markStatus(\''+sess.id+'\',\'no-show\')" title="No word from them — no make-up credit">Not in Today</button>';
  } else if(sess.status==='scheduled'){
    actions+='<button class="btn sm ghost" onclick="markStatus(\''+sess.id+'\',\'cancelled\')">Cancel</button>';
  } else if(sess.status==='attended'){
    actions+='<button class="btn sm ghost" onclick="undoCheckIn(\''+sess.id+'\')">Undo check-in</button>';
  }
  // +30 min make-up top-up (Oct 2026) — front desk can add or take off the extra 30 minutes here.
  if(sess.status==='scheduled'){
    if(sess.extraMin) actions+='<button class="btn sm ghost" onclick="removeTopUp(\''+sess.id+'\')" title="Take the extra 30 minutes off and return them to the make-up credit">− 30 min</button>';
    else if(!sess.termBreak && topUpCreditFor(sess.studentId, sess.date)) actions+='<button class="btn sm ghost" onclick="addTopUp(\''+sess.id+'\')" title="Add 30 minutes to the end, using the student\'s make-up time">+30 min</button>';
  }
  html+='<td>'+actions+'</td></tr>';
  return html;
}
// Checked-in students first, then whoever's still to arrive — each half keeping the same
// arrival-time order scheduleListForDay() already sorted `rows` into (originally alphabetical by
// name, per Allie's 5.35 request; changed Sept 2026 per a later Allie request to order by arrival
// instead — see scheduleListForDay()'s own comment). A no-show is neither — it's grouped with
// "still to arrive" since it never actually checked in, same as a plain scheduled session.
function rosterTableHtml(rows, weekday, dayKey, now){
  const checkedIn=rows.filter(function(s){ return s.status==='attended'; });
  const upcoming=rows.filter(function(s){ return s.status!=='attended'; });
  let html='<table><tr><th>Student</th><th>Year</th><th>Time</th><th>Move to</th><th>Status</th><th></th></tr>';
  html+=checkedIn.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  if(checkedIn.length && upcoming.length){
    html+='<tr><td colspan="6" class="small muted" style="text-align:center;padding:4px 0">— yet to arrive —</td></tr>';
  }
  html+=upcoming.map(function(sess){ return sessionRowHtml(sess, weekday, dayKey, now); }).join('');
  html+='</table>';
  return html;
}

// Live per-Pod (and Online) "who's here" board — literally just names and leave times, grouped by
// where they're actually sitting, updating automatically as students check in and out (a spot
// reopens the instant someone checks out, since they simply drop off the list) — Sept 2026, per
// Allie: "as the students get checked into a pod, we are able to see them in that pod... as they
// leave theres a spot again... i just need it to say the kids name and the time they leave".
// Deliberately much lighter than the full-day roster in renderPodSummaryStrip just below it (no
// year, no status) — this is meant to be read at a glance, not worked from; corrections to a
// checked-in/exit time still happen on the "Checked in today" panel above. A student's own name IS
// still clickable, though (Sept 2026, per Allie: "if i click on a kid's name in the whos here right
// now box, it allows me to change the pod they are sitting in for today") — see openQuickMoveForm(),
// wired up by the renderer below using the sessionId carried on each entry here.
// Same live-vs-historical rule as checkedInNamesByPod(): today shows who's still actually present
// (checked out students drop off immediately), any other day shows that whole day's attended record.
function liveOccupancyGroups(dayKey){
  const live = dayKey===toKey(simNow());
  const weekday=WEEKDAY_KEYS[(new Date(dayKey).getDay()+6)%7];
  const byPod={}, byOnlineInstr={};
  sessionsOnDate(dayKey).forEach(function(s){
    if(s.status!=='attended') return;
    if(live && s.checkedOut) return;
    const student=findStudent(s.studentId);
    if(!student) return;
    const entry={name:student.name, exit:s.actualEnd, sessionId:s.id};
    if(s.online){ (byOnlineInstr[s.instructorId]=byOnlineInstr[s.instructorId]||[]).push(entry); }
    else { (byPod[s.podId||'']=byPod[s.podId||'']||[]).push(entry); } // '' = no Pod (Oct 2026 — see the Unassigned group below)
  });
  const sortEntries=function(list){
    return list.slice().sort(function(a,b){
      const ea = a.exit==null? Infinity : a.exit, eb = b.exit==null? Infinity : b.exit;
      return ea-eb || a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
    });
  };
  // podId carried through (null for an Online group) so the renderer can look up that Pod's own
  // capacity for the seat-map/badge below — Online has a different capacity model entirely (the
  // combined 1:9 ratio, not a fixed 8 seats), so it deliberately gets neither.
  // A Pod with nobody checked in still shows up here — but only on the live (today) view, and only
  // when it actually has a shift scheduled for today's weekday (Sept 2026, per Allie: "make the
  // checked in today section show the pods, (empty) but with the staff allocated to them even if
  // there are no students check in" — scoped, per her own choice, to "only pods with a shift
  // scheduled today"). A Pod with no shift at all today (e.g. it doesn't run on this weekday) stays
  // hidden, same as before. This deliberately isn't extended to a past day's view: that board is
  // already a definitive attendance record, so an all-empty staffed Pod there isn't the same kind of
  // useful "who's actually here" read this was built for.
  const groups=[];
  pods.forEach(function(pod){
    const list=byPod[pod.id];
    if(list && list.length){ groups.push({label:pod.name, podId:pod.id, entries:sortEntries(list)}); }
    // podShiftsOn (Oct 2026): a Pod staffed only by a one-off day override shows up too, and one
    // whose day override marks it Unassigned doesn't.
    else if(live && podShiftsOn(pod.id, new Date(dayKey)).some(function(s){ return !s.oneOff || s.instructorId; })){ groups.push({label:pod.name, podId:pod.id, entries:[]}); }
  });
  // Checked in but not sitting anywhere the board can draw — no Pod at all, a Pod that no longer
  // exists, or an Online group whose instructor can't be found. These used to be silently dropped
  // from the board, so there was nothing to click to seat them (Oct 2026, per Allie: "students in
  // the whos in right now list, i want to be able to change their pod from there too, at least the
  // ones in a pod that isnt assigned to anyone"). Their own group (flagged `unassigned`), names
  // clickable to the same today-only quick move as everyone else.
  const unassigned=(byPod['']||[]).slice();
  Object.keys(byPod).forEach(function(podId){ if(podId && !findPod(podId)) unassigned.push.apply(unassigned, byPod[podId]); });
  Object.keys(byOnlineInstr).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr){ unassigned.push.apply(unassigned, byOnlineInstr[instrId]); return; }
    groups.push({label:'Online — '+instr.name, podId:null, entries:sortEntries(byOnlineInstr[instrId])});
  });
  if(unassigned.length) groups.push({label:'Unassigned — needs a Pod', podId:null, unassigned:true, entries:sortEntries(unassigned)});
  return groups;
}
// Who's here right now — grid layout matching the Availability lookup's own look (Sept 2026, per
// Allie: "can we make Who's here right now look like the availability lookup table? similar set up,
// with a different colour per cell, only displaying the pods that have students in them"). Columns
// are Pods with at least one student present right now (per her follow-up: "can we swap for pods to
// be columns?"); rows are seat slots 1..capacity, earliest-to-leave first (matching sortEntries()'s
// own order); every cell is coloured the same simple occupied(red)/empty(green) way the app's other
// capacity badges already use — per her clarification, NOT a distinct colour per Pod and NOT a
// colour tied to how soon someone's leaving. Online groups have no fixed seat count to grid against
// (they run on the combined 1:9 ratio, not 8 physical seats), so they keep the plain name/leave-time
// list format below the grid, same as before.
// Which instructor is actually rostered against a Pod's board column, for the small label under its
// name (Sept 2026, per Allie: "Can we have the instructor name as well in small writing under the
// pod number"). Resolves exactly the way openQuickCoverageForm() picks its starting block — whichever
// shift covers the current wall-clock time, falling back to the day's last block — then reads
// blockInstructorOn() for that calendar date, so a one-off coverage swap or a dated permanent change
// both show up correctly, on any day, not just today.
//
// Also returns an end time (Sept 2026, per Allie: "in whos in today, can the instructors have their
// shift end time as well") — "until 5:00pm".
//
// Sept 2026 fix, per Allie: "when i change the bit that says instructor until x time, i dont want
// their time to change. The time is attached to the instructor, not to the pod" — this used to read
// the POD's own shift block end time (block.end/closesLate — when the Pod itself is covered until),
// which is a front-desk-editable property of the Pod's coverage grid, not of the instructor. That
// meant editing the Pod's shift block end time silently changed what looked like the instructor's own
// hours here, AND (her second report) editing an instructor's actual weekly availability had NO
// effect on this board at all, since it was never consulted. Now reads the instructor's own
// standing/one-off availability (instructorAvailabilityOn — the same source their own login, the
// "Adjust availability" editor, and instructorCurrentWeeklyPattern() all use) for its end time, and
// only falls back to the Pod block's end time in the edge case where an instructor is covering a Pod
// with no availability record of their own for this date (e.g. a manually arranged f2f cover).
// Returns null if this Pod has no shift at all covering the moment in question.
function podInstructorLabel(podId, dayKey){
  const date=new Date(dayKey);
  // podShiftsOn (Oct 2026) — includes a one-off day override from the Today tab's Schedule grid.
  const blocks=podShiftsOn(podId, date);
  if(!blocks.length) return null;
  const nowMin=nowMinutesOfDay();
  const block = blocks.find(function(b){ return nowMin>=b.start && nowMin<b.end; }) || blocks[blocks.length-1];
  // A floor move today (Oct 2026) — show who's actually minding the kids, with their own times.
  const fl=floorAssignmentFor(podId, dayKey);
  const instrId=fl? fl.instructorId : block.instructorId;
  if(!instrId) return null;
  // Oct 2026, per Allie ("whos here right now instructor times are weird" — right instructor, wrong
  // end time): availability is when someone COULD work, not their shift, so an instructor available
  // until 7pm but rostered until 5:30 showed "until 7:00pm". Now: the end of the last shift block
  // they're actually covering that day across ALL Pods (still the instructor's own time, not this
  // Pod's — moving to a second Pod later on counts), capped by their availability if that ends
  // sooner (a one-off "leaving at 5 today"). Availability alone is only the fallback for someone
  // with no block of their own, then the Pod block, same as before.
  const shift=instructorShiftEndOn(instrId, date);
  const avail=instructorAvailabilityOn(instrId, date);
  let until, from;
  if(shift) until = (avail && avail.end<shift.end)? minToLabel(avail.end) : (shift.closesLate? 'Close' : minToLabel(shift.end));
  else until = avail? minToLabel(avail.end) : (block.closesLate? 'Close' : minToLabel(block.end));
  // Start time too (Oct 2026, per Allie): same rule mirrored — the earliest block they cover that
  // day in any Pod, pushed later if their availability that day starts later (a one-off "in at 4").
  if(shift) from = minToLabel((avail && avail.start>shift.start)? avail.start : shift.start);
  else from = minToLabel(avail? avail.start : block.start);
  return {name: findInstructor(instrId).name, until: until, from: from};
}
// When an instructor's rostered day actually ends: the latest-ending shift block they're covering
// on this date in any Pod (one-off coverage swaps included, via blockInstructorOn). null if they
// aren't on any block that day.
function instructorShiftEndOn(instructorId, date){
  let latest=null;
  pods.forEach(function(pod){
    podShiftsOn(pod.id, date).forEach(function(b){ // day overrides included (Oct 2026)
      if(b.instructorId!==instructorId) return;
      if(!latest || b.end>latest.end || (b.end===latest.end && b.closesLate)) latest={end:b.end, closesLate:!!b.closesLate, start:latest? latest.start : b.start};
      latest.start=Math.min(latest.start, b.start); // earliest start that day (for "who's here" from–until)
    });
  });
  return latest;
}
function renderLiveOccupancyBoard(dayKey){
  // No extra filtering needed here — liveOccupancyGroups() already only returns a group when it's
  // either occupied, or (live view only) a Pod with a shift scheduled today, so an empty group here
  // always means "staffed, nobody in yet" rather than "nothing to show."
  const groups=liveOccupancyGroups(dayKey);
  const podGroups=groups.filter(function(g){ return g.podId; });
  const onlineGroups=groups.filter(function(g){ return !g.podId; });
  const live = dayKey===toKey(simNow());
  let html='<div class="card"><h2>Who\'s here'+(live? ' right now':'')+'</h2>';
  if(!groups.length){
    html+='<div class="empty-note">'+(live? 'Nobody checked in yet today.' : 'Nobody was checked in this day.')+'</div></div>';
    return html;
  }
  if(podGroups.length){
    // Row count per column has to be the larger of the Pod's stated capacity and how many are
    // ACTUALLY sitting in it right now — not just capacity — because a same-day Pod move is
    // deliberately allowed to go over capacity (movePodSession() skips the capacity check entirely
    // once isToday is true, per Allie: "on the day students can be moved to other pods, disregarding
    // pod fullness"). Before this fix, maxCap (and each column's own effective row count below) was
    // capacity-only, so checking a student into an already-full Pod silently dropped them off this
    // grid entirely — seat index 8 in a capacity-8 Pod was simply never iterated over, even though
    // the header badge above correctly showed "9/8". They were never actually removed from anywhere
    // in the data (still 'attended', still that podId) — just never drawn (Sept 2026, per Allie:
    // "when i check in a student, and i change the pod they are in for the day, they won't come up").
    const effectiveCap=function(g){ return Math.max(podCapacity(g.podId), g.entries.length); };
    const maxCap=Math.max.apply(null, podGroups.map(effectiveCap));
    html+='<div class="liveboard-grid" style="grid-template-columns:70px repeat('+podGroups.length+',1fr);'+(onlineGroups.length? 'margin-bottom:14px':'')+'">';
    html+='<div></div>'+podGroups.map(function(g){
      const cap=podCapacity(g.podId);
      const occupancy=g.entries.length;
      // Clickable only on the live (today) view — a quick coverage change only ever makes sense for
      // today, and this board also does double duty rendering a past day's historical record, where
      // there's nothing "quick" left to change (Sept 2026, per Allie: "maybe by clicking on th epod
      // number under whos here right now").
      const headAttrs = live? ' style="cursor:pointer" onclick="openQuickCoverageForm(\''+g.podId+'\')" title="Quick same-day coverage change"' : '';
      const instr=podInstructorLabel(g.podId, dayKey);
      return '<div class="cal-head"'+headAttrs+'>'+g.label+' <span class="badge '+(occupancy>=cap?'full':'available')+'" style="margin-left:4px">'+occupancy+'/'+cap+'</span>'
        // Name grey; the times on one line, blue on a light blue background (Oct 2026, per Allie).
        +(instr? '<br><span class="small muted">'+instr.name+'</span>'
          +'<br><span class="small" style="white-space:nowrap;color:var(--online);background:var(--online-bg);padding:1px 6px;border-radius:6px;display:inline-block;margin-top:2px">'+instr.from+'–'+instr.until+'</span>' : '')
      +'</div>';
    }).join('');
    for(let seat=0; seat<maxCap; seat++){
      html+='<div class="cal-row-label small muted">Seat '+(seat+1)+'</div>';
      html+=podGroups.map(function(g){
        // Blank filler only once we're past BOTH this Pod's stated capacity AND how many are
        // actually seated in it (see the maxCap comment above) — so a narrower Pod still fills
        // blank once truly exhausted, but an over-capacity Pod keeps rendering its real occupants
        // instead of a narrower column's own limit hiding them.
        if(seat>=effectiveCap(g)) return '<div></div>';
        const entry=g.entries[seat];
        // A student's own name is clickable on the live (today) view only — same "only makes sense
        // for today" rule as the Pod header's quick coverage change just above (Sept 2026, per
        // Allie: "if i click on a kid's name in the whos here right now box, it allows me to change
        // the pod they are sitting in for today"). A past day's record is just that — a record.
        const nameHtml = (live && entry)
          ? '<a href="#" onclick="openQuickMoveForm(\''+entry.sessionId+'\');return false;" style="color:inherit" title="Move to a different Pod, today only">'+entry.name+'</a>'
          : (entry? entry.name : '');
        return entry
          ? '<div class="avail-cell full-cell">'+nameHtml+'<br><span class="small">'+(entry.exit!=null? minToLabel(entry.exit) : '—')+'</span></div>'
          : '<div class="avail-cell on">Open</div>';
      }).join('');
    }
    html+='</div>';
  }
  if(onlineGroups.length){
    html+='<div style="display:flex;flex-wrap:wrap;gap:16px">'
      +onlineGroups.map(function(g){
        return '<div style="min-width:150px"><h4 style="margin:0 0 4px 0'+(g.unassigned?';color:var(--danger)':'')+'">'+g.label+'</h4>'
          +(g.unassigned && live? '<div class="small muted" style="margin-bottom:4px">Click a name to put them in a Pod.</div>' : '')
          +'<table><tr><th>Student</th><th>Leaves</th></tr>'
          +g.entries.map(function(e){
            const nameHtml = live
              ? '<a href="#" onclick="openQuickMoveForm(\''+e.sessionId+'\');return false;" style="color:inherit" title="Move to a different Pod, today only">'+e.name+'</a>'
              : e.name;
            return '<tr><td>'+nameHtml+'</td><td>'+(e.exit!=null? minToLabel(e.exit) : '—')+'</td></tr>';
          }).join('')
          +'</table></div>';
      }).join('')
      +'</div>';
  }
  html+='</div>';
  return html;
}

// Quick same-day-only Pod (or Online) move, launched by clicking a student's own name on the live
// "Who's here right now" board just above (Sept 2026, per Allie: "if i click on a kid's name in the
// whos here right now box, it allows me to change the pod they are sitting in for today"). This
// isn't a new mechanism — it hands straight off to setSessionLocation(), the exact same one-off,
// this-session-only mover every other Pod/Online picker in the app already uses (the Schedule list
// row, the check-in modal, the booking modal) — so capacity/coverage rules, the confirmation toast,
// and the remote write are all identical to picking the same student's row from any of those; this
// is purely a faster entry point to it, straight from the board where front desk is already looking.
function openQuickMoveForm(sessionId){
  if(!findSession(sessionId)) return;
  state.quickMoveForm={sessionId};
  render();
}
function closeQuickMoveForm(){ state.quickMoveForm=null; render(); }
// The dropdown's own onchange — closes the little popover immediately (a single choice, not a form
// to review and submit) and hands off to setSessionLocation() for the actual move.
function chooseQuickMove(sessionId, value){
  state.quickMoveForm=null;
  setSessionLocation(sessionId, value);
}
function renderQuickMoveModal(){
  const f=state.quickMoveForm;
  if(!f) return '';
  const sess=findSession(f.sessionId);
  if(!sess) return ''; // the session vanished from under the open popover (checked out, cancelled elsewhere) — nothing left to move
  const student=findStudent(sess.studentId);
  const weekday=WEEKDAY_KEYS[(sess.date.getDay()+6)%7];
  const dateKey=toKey(sess.date);
  const currentValue=sessionLocationValue(sess);
  const currentLabel=sess.online? ('Online — '+findInstructor(sess.instructorId).name) : (sess.podId? findPod(sess.podId).name : 'Unassigned');
  let html='<div class="overlay" onclick="if(event.target===this) closeQuickMoveForm()"><div class="modal">';
  html+='<h3>Move '+student.name+' — today</h3>';
  html+='<p>Currently: <b>'+currentLabel+'</b>. Picking a different Pod (or Online) below moves them right now, for today only — their regular schedule is unaffected.</p>';
  html+='<div><label>Move to</label><select onchange="chooseQuickMove(\''+sess.id+'\',this.value)">'
    +'<option value=""'+(currentValue===''?' selected':'')+'>Unassigned</option>'
    +locationOptionsHtml(weekday, dateKey, sess.start, sess.duration, currentValue, sess.id)
  +'</select></div>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeQuickMoveForm()">Close</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

// Launched by clicking a Pod's header on the live "Who's here right now" board (Sept 2026 as a
// same-day roster swap; Oct 2026 changed to a floor move only — see below). "No instructor" =
// nobody minding that Pod right now.
var NO_INSTRUCTOR_VALUE='__no_instructor__';
// Floor moves (Oct 2026, per Allie: "moving staff around in the Who's here right now table should
// not impact at all the scheduled time slots for those people. It is just for front desk purposes.
// The only change the instructors should see is which kids are currently assigned to them"). Clicking a
// Pod's header on the board picks who is MINDING that Pod's kids today — stored on its own
// (pod_floor_assignments, add_pod_floor_assignments.sql), never in the roster: shifts, the 2-week
// shift lists, calendar feeds, coverage and availability are untouched. What it does change: the
// board's name for that Pod, which kids show on each instructor's "My Pod today" (see
// instructorPodIdsToday), and the instructor on those kids' sessions today (so the person minding
// them can check them out). instructorId null = nobody minding that Pod right now.
var podFloorAssignments=[];
function floorAssignmentFor(podId, dateKey){
  return podFloorAssignments.find(function(f){ return f.podId===podId && f.dateKey===dateKey; }) || null;
}
// Who a session in this Pod belongs to: a floor move for that date wins, else the roster.
function sessionMinderFor(podId, weekday, start, duration, date){
  const fl=floorAssignmentFor(podId, toKey(date));
  if(fl) return {primaryInstructorId:fl.instructorId||null, secondaryInstructorId:null, handoffAt:null, ok:true};
  return podCoverageDetail(podId, weekday, start, duration, date);
}
function openQuickCoverageForm(podId){
  const todayKey=toKey(simNow());
  const fl=floorAssignmentFor(podId, todayKey);
  const rostered=podShiftsOn(podId, simNow());
  const nowMin=nowMinutesOfDay();
  const cur=rostered.find(function(b){ return nowMin>=b.start && nowMin<b.end; }) || rostered[rostered.length-1];
  const preselected = fl? (fl.instructorId||NO_INSTRUCTOR_VALUE) : ((cur && cur.instructorId)||'');
  state.quickCoverageForm={podId:podId, instructorId:preselected, error:''};
  render();
}
function closeQuickCoverageForm(){ state.quickCoverageForm=null; render(); }
function setQuickCoverageField(field, value){
  state.quickCoverageForm[field]=value;
  state.quickCoverageForm.error='';
  render();
}
function reseatPodSessionsToday(podId){
  const today=simNow(), todayKey=toKey(today), weekday=WEEKDAY_KEYS[(today.getDay()+6)%7];
  reassignSessionsForCoverageChange(podId, weekday, todayKey);
}
function saveQuickCoverage(){
  const f=state.quickCoverageForm;
  if(!f.instructorId){ f.error='Choose an instructor, or "No instructor".'; render(); return; }
  const todayKey=toKey(simNow());
  const isNone=f.instructorId===NO_INSTRUCTOR_VALUE;
  const instrId=isNone? null : f.instructorId;
  podFloorAssignments=podFloorAssignments.filter(function(x){ return !(x.podId===f.podId && x.dateKey===todayKey); });
  podFloorAssignments.push({podId:f.podId, dateKey:todayKey, instructorId:instrId});
  dbWrite('moving who is minding a Pod today', function(){ return supabaseClient.from('pod_floor_assignments').upsert({pod_id:f.podId, the_date:todayKey, instructor_id:instrId, updated_at:new Date().toISOString()}, {onConflict:'pod_id,the_date'}); });
  reseatPodSessionsToday(f.podId);
  toast(isNone
    ? findPod(f.podId).name+' has nobody minding it right now. Nobody\'s shifts have changed.'
    : findInstructor(instrId).name+' is minding '+findPod(f.podId).name+'\'s kids today. Nobody\'s shifts have changed.');
  state.quickCoverageForm=null;
  render();
}
function clearQuickCoverage(){
  const f=state.quickCoverageForm;
  const todayKey=toKey(simNow());
  podFloorAssignments=podFloorAssignments.filter(function(x){ return !(x.podId===f.podId && x.dateKey===todayKey); });
  dbWrite('clearing a floor move', function(){ return supabaseClient.from('pod_floor_assignments').delete().eq('pod_id', f.podId).eq('the_date', todayKey); });
  reseatPodSessionsToday(f.podId);
  toast(findPod(f.podId).name+' is back with its rostered instructor.');
  state.quickCoverageForm=null;
  render();
}
function renderQuickCoverageModal(){
  const f=state.quickCoverageForm;
  if(!f) return '';
  const pod=findPod(f.podId);
  const todayKey=toKey(simNow());
  const fl=floorAssignmentFor(f.podId, todayKey);
  const rosteredNames=podShiftsOn(f.podId, simNow()).filter(function(s){ return s.instructorId; })
    .map(function(s){ return findInstructor(s.instructorId).name+' '+rangeLabel(s.start, s.end-s.start); });
  let html='<div class="overlay" onclick="if(event.target===this) closeQuickCoverageForm()"><div class="modal">';
  html+='<h3>Who\'s minding '+pod.name+' today</h3>';
  html+='<p>For the floor only: this moves '+pod.name+'\'s kids to someone else for today. <b>Nobody\'s shifts change</b>, and neither do calendars or availability. Instructors just see which kids are theirs. To change who is actually rostered, use the Schedule grid or coverage.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  html+='<div class="small" style="margin-bottom:8px">Rostered: <b>'+(rosteredNames.length? rosteredNames.join(', ') : 'nobody')+'</b>'
    +(fl? '<br>Minding now: <b>'+(fl.instructorId? findInstructor(fl.instructorId).name : 'No instructor')+'</b> <span class="muted">(moved today)</span>' : '')+'</div>';
  html+='<div class="row2" style="align-items:flex-end">'
    +'<div><label>Minded by</label><select onchange="setQuickCoverageField(\'instructorId\',this.value)">'
      +'<option value="">Choose…</option>'
      +'<option value="'+NO_INSTRUCTOR_VALUE+'"'+(f.instructorId===NO_INSTRUCTOR_VALUE?' selected':'')+'>No instructor</option>'
      +instructors.filter(function(i){ return i.active!==false; }).slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(i){
        return '<option value="'+i.id+'"'+(i.id===f.instructorId?' selected':'')+'>'+i.name+'</option>';
      }).join('')
    +'</select></div>'
    +'<button class="btn sm primary" onclick="saveQuickCoverage()">Save</button>'
  +'</div>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:space-between">'
    +(fl? '<button class="btn sm ghost" onclick="clearQuickCoverage()">Back to the rostered instructor</button>' : '<span></span>')
    +'<button class="btn ghost" onclick="closeQuickCoverageForm()">Close</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

// A Pod's day can naturally turn over into more than one distinct wave of students — mostly one
// group arriving together, then leaving and being replaced by a different group later on (Sept 2026,
// per Allie: "sometimes pods experience a second seating... on the first seating its 7 kids, and then
// on the second its 6"). Grouped by each session's own start time rather than by staffing block,
// since a real seating turnover is about when the KIDS actually arrive, not how coverage happens to
// be split for the day — a Pod staffed by one instructor straight through can still turn over twice.
// A Pod with everyone on a single start time (the ordinary case) has nothing worth calling out, so
// this only returns something once there's a genuine second (or third...) wave.
function podSeatingsBreakdown(roster){
  const byStart={};
  roster.forEach(function(s){ (byStart[s.start]=byStart[s.start]||[]).push(s); });
  const starts=Object.keys(byStart).map(Number).sort(function(a,b){ return a-b; });
  if(starts.length<2) return null;
  const ORDINALS=['1st','2nd','3rd','4th','5th','6th','7th','8th'];
  return starts.map(function(start, idx){
    return {label:(ORDINALS[idx]||(idx+1)+'th')+' seating', time:minToLabel(start), count:byStart[start].length};
  });
}
// "Pod seating — permanent changes" standing roster (Oct 2026, per Allie: "I dont want it to let me
// pick by week. I want it to always show from today, and include the kids that are on hold or the
// one-off sessions that were cancelled, next to them written cancelled or make up credit etc...
// if theres a kid scheduled to start next week, place them in in gray - saying starting x date").
// Built from each student's REGULAR plan for the weekday rather than from one date's sessions, so a
// regular kid who isn't coming on the next occurrence (hold, one-off cancel, away) keeps their seat
// on the roster — and can still be moved — instead of vanishing from it. One-off/make-up bookings
// are deliberately left out (her call): they aren't part of the weekly seating, and the Today tab's
// own day-by-day seating covers them. Each row describes the student's NEXT regular occurrence of
// this weekday from today (or, for someone not started yet, their first one).
var SEATING_CREDIT_SOURCES=['parent-cancel','excused-absence','closure'];
function regularSeatingRows(weekday){
  const anchor=nextRegularOccurrence(weekday, simNow());
  const anchorKey=toKey(anchor);
  const rows=[];
  students.forEach(function(student){
    if(isStudentInactive(student) || student.heldUntil) return; // a held spot isn't seated until confirmed
    const starting = !!(student.startDate && toKey(student.startDate)>anchorKey);
    const date = starting? nextRegularOccurrence(weekday, student.startDate) : anchor;
    const dayKey=toKey(date);
    const plan=studentPlanOn(student.id, date);
    const slot=(plan.recurring||[]).find(function(r){ return r.weekday===weekday; });
    if(!slot) return;
    const sameSlot=sessionsOnDate(dayKey).filter(function(s){ return s.studentId===student.id && s.start===slot.start; });
    const live=sameSlot.find(function(s){ return s.status!=='cancelled'; }) || null;
    const cancelled=live? null : (sameSlot[0]||null);
    // Where they sit: the real session if there is one, otherwise their standing pin (what the next
    // generated session will use), otherwise wherever the cancelled session had them.
    const pin=latestStudentPodAssignment(student.id, date);
    let location;
    if(live) location=sessionLocationValue(live);
    else if(pin) location=pin.online? ('online:'+pin.instructorId) : (pin.podId||'');
    else location=cancelled? sessionLocationValue(cancelled) : '';
    let label='', kind='';
    if(starting){ label='Starting '+fmtShort(date); kind='starting'; }
    else if(live){
      if(live.status==='attended') label='Checked in';
      else if(live.status==='excused'){ label='Away · make-up credit'; kind='away'; }
      else if(live.status==='no-show'){ label='Not in · no credit'; kind='away'; }
    }
    else if(isStudentOnHold(student.id, date)){
      const hold=(student.holds||[]).find(function(h){ return toKey(h.start)<=dayKey && dayKey<=toKey(h.end); });
      label='On hold until '+fmtShort(hold.end); kind='hold';
    }
    else if(cancelled){
      // Credits don't link back to the session they replace, but every advance-notice credit is
      // issued dated to the missed session itself (see markStatus/parentCancelSession/closures).
      const credited=credits.some(function(c){ return c.studentId===student.id && toKey(c.issuedDate)===dayKey && SEATING_CREDIT_SOURCES.indexOf(c.source)>=0; });
      label = credited? 'Cancelled · make-up credit' : 'Cancelled'; kind='cancelled';
    }
    else if(termBreakOn(date)){ label='Summer hours — no regular session'; kind='cancelled'; }
    else { label='Not booked yet'; kind='cancelled'; }
    const stop=currentOrUpcomingPlanChange(student.id);
    rows.push({student:student, start:slot.start, duration:student.duration, dayKey:dayKey, sessionId: live? live.id : null,
      location:location, label:label, kind:kind, finishing:(stop && stop.stopped)? stop.effectiveFrom : null});
  });
  rows.sort(function(a,b){ return a.start-b.start || a.student.name.localeCompare(b.student.name, undefined, {sensitivity:'base'}); });
  return {anchor:anchor, rows:rows};
}
// Most regular kids sitting in one group at the same moment — the number that actually has to fit
// under the Pod's capacity. Counts everyone on the roster (on hold / starting soon included), since
// this section is about the standing weekly seat each of them holds.
function seatingPeak(list){
  let peak=0;
  list.forEach(function(r){
    const n=list.filter(function(o){ return o.start<=r.start && r.start<o.start+o.duration; }).length;
    if(n>peak) peak=n;
  });
  return peak;
}
function regularSeatingRowHtml(r, weekday){
  const badgeCls={hold:'hold', cancelled:'soon', away:'soon'}[r.kind];
  return '<tr'+(r.kind==='starting'?' style="opacity:.5"':'')+'><td><b>'+r.student.name+'</b>'
      +(r.finishing? ' <span class="badge stopping">Finishing '+fmtShort(new Date(r.finishing))+'</span>' : '')
    +'</td><td>'+yearLabel(r.student.year)+'</td><td>'+rangeLabel(r.start, r.duration)+'</td>'
    +'<td><select onchange="setPermanentStudentLocation(\''+r.student.id+'\',\''+weekday+'\',\''+r.dayKey+'\','+r.start+',this.value)">'
      +'<option value=""'+(r.location===''?' selected':'')+'>Unassigned</option>'
      +locationOptionsHtml(weekday, r.dayKey, r.start, r.duration, r.location, r.sessionId)
    +'</select></td>'
    +'<td>'+(!r.label? '' : badgeCls? '<span class="badge '+badgeCls+'">'+r.label+'</span>' : '<span class="small muted">'+r.label+'</span>')+'</td></tr>';
}
function regularSeatingTableHtml(list, weekday){
  return '<table><tr><th>Student</th><th>Year</th><th>Time</th><th>Move to (every '+weekday+')</th><th>Next '+weekday+'</th></tr>'
    +list.map(function(r){ return regularSeatingRowHtml(r, weekday); }).join('')+'</table>';
}
function renderRegularSeating(weekday){
  const data=regularSeatingRows(weekday);
  const rows=data.rows;
  let html='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">';
  pods.forEach(function(pod){
    const list=rows.filter(function(r){ return r.location===pod.id; });
    const cap=podCapacity(pod.id);
    const peak=seatingPeak(list);
    html+='<div class="card" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">'+pod.name+'</h3>'
      +'<span class="small muted">'+podCoverageSummary(pod.id, weekday, data.anchor)+'</span>'
      +'<span class="badge '+(peak>cap?'full':peak===cap?'soon':'available')+'" title="Most regular kids here at the same time">'+peak+'/'+cap+' at peak</span>'
      +'<button class="btn sm ghost" style="margin-left:auto" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'
    +'</div>'
    +(list.length? regularSeatingTableHtml(list, weekday) : '<div class="empty-note">Nobody seated here on '+weekday+'s.</div>')
    +'</div>';
  });
  const onlineByInstructor={};
  rows.forEach(function(r){ if(String(r.location).indexOf('online:')===0){ const id=r.location.slice(7); (onlineByInstructor[id]=onlineByInstructor[id]||[]).push(r); } });
  Object.keys(onlineByInstructor).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    html+='<div class="card online" style="margin:0"><div class="card-head"><h3 style="margin:0">Online — '+instr.name+'</h3>'
      +'<span class="badge available">'+onlineByInstructor[instrId].length+' regular</span></div>'
      +regularSeatingTableHtml(onlineByInstructor[instrId], weekday)+'</div>';
  });
  // Unassigned — also catches a location pointing at a Pod or instructor that no longer exists.
  const unassigned=rows.filter(function(r){
    if(String(r.location).indexOf('online:')===0) return !findInstructor(r.location.slice(7));
    return !r.location || !findPod(r.location);
  });
  if(unassigned.length){
    html+='<div class="card" style="margin:0"><div class="card-head"><h3 style="margin:0;color:var(--danger)">Unassigned</h3></div>'
      +regularSeatingTableHtml(unassigned, weekday)+'</div>';
  }
  html+='</div>';
  return html;
}

function renderPodSummaryStrip(dayKey, weekday){
  const now=simNow();
  const selectedDate=new Date(dayKey);
  const dayList=scheduleListForDay(dayKey).filter(sessionTakesSeat); // away / not-in kids aren't sitting anywhere (Oct 2026)
  const checkedInByPod=checkedInNamesByPod(dayKey);
  let html='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px">';
  pods.forEach(function(pod){
    const cap=podCapacity(pod.id);
    const coverage=podCoverageSummary(pod.id, weekday, selectedDate);
    const checkedIn=checkedInByPod[pod.id]||[];
    // The badge counts who's actually sitting there (live today, the day's full record for any
    // other day — see checkedInNamesByPod()) rather than the day's busiest scheduled overlap, so it
    // climbs 1/8, 2/8, 3/8... as each student is checked in and assigned here, exactly the "seats
    // filling up" view front desk watches through the day (5.28, per Allie).
    const occupancy=checkedIn.length;
    const roster=dayList.filter(function(s){ return s.podId===pod.id && !s.online; });
    const seatings=podSeatingsBreakdown(roster);
    html+='<div class="card" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">'+pod.name+'</h3>'
      +'<span class="small muted">'+coverage+'</span>'
      +'<span class="badge '+(occupancy>=cap?'full':'available')+'">'+occupancy+'/'+cap+'</span>'
      +'<button class="btn sm ghost" style="margin-left:auto" onclick="openPodAssignForm(\''+pod.id+'\',\''+weekday+'\')">Assign</button>'
      +(seatings? '<span class="small muted" style="width:100%">'+seatings.map(function(sg){ return sg.label+' ('+sg.time+'): <b>'+sg.count+'</b> kid'+(sg.count===1?'':'s'); }).join(' · ')+'</span>' : '')
    +'</div>'
    +(roster.length? rosterTableHtml(roster, weekday, dayKey, now) : '<div class="empty-note">Nobody assigned here yet.</div>')
    +'</div>';
  });
  // Online cards — one per instructor currently minding an Online group today, shown separately
  // from the Pod cards above (Online is a separate concept, not just another Pod). Only instructors
  // with at least one online student booked today get a card; an on-shift instructor with nobody
  // online yet doesn't clutter this up.
  const onlineByInstructor={};
  dayList.forEach(function(s){ if(s.online){ (onlineByInstructor[s.instructorId]=onlineByInstructor[s.instructorId]||[]).push(s); } });
  Object.keys(onlineByInstructor).forEach(function(instrId){
    const instr=findInstructor(instrId);
    if(!instr) return;
    const occupancy=instructorOccupantCount(instrId, dayKey); // combined (physical + online) headcount actually sitting with this instructor — the number their own combined cap caps (combinedCapFor)
    const instrCap=combinedCapFor(instrId);
    html+='<div class="card online" style="margin:0"><div class="card-head" style="flex-wrap:wrap;row-gap:6px">'
      +'<h3 style="margin:0">Online — '+instr.name+'</h3>'
      +'<span class="badge '+(occupancy>=instrCap?'full':'available')+'">'+occupancy+'/'+instrCap+'</span>'
    +'</div>'
    +rosterTableHtml(onlineByInstructor[instrId], weekday, dayKey, now)
    +'</div>';
  });
  // Unassigned — anyone with no Pod and not online: a genuine gap front desk still needs to resolve,
  // called out as its own card rather than silently missing from every Pod's roster.
  const unassigned=dayList.filter(function(s){ return !s.podId && !s.online; });
  if(unassigned.length){
    html+='<div class="card" style="margin:0"><div class="card-head"><h3 style="margin:0;color:var(--danger)">Unassigned</h3></div>'
      +rosterTableHtml(unassigned, weekday, dayKey, now)
    +'</div>';
  }
  html+=notComingCardHtml(dayKey);
  html+='</div>';
  return html;
}
// Who's off this day — cancelled, away or not in — each with a Restore (Oct 2026, see
// restoreSession). Today/future only. Only genuine one-day absences: a standing session cancelled
// because the regular schedule itself changed (old time/day, a stop) or by a hold isn't one, so
// it's left out, as is anything the student has since been re-booked over.
function notComingSessionsForDay(dayKey){
  if(dayKey<toKey(simNow())) return [];
  const date=new Date(dayKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const list=sessionsOnDate(dayKey).filter(function(s){
    if(sessionTakesSeat(s)) return false;
    const student=findStudent(s.studentId);
    if(!student || isStudentInactive(student) || isStudentOnHold(s.studentId, date)) return false;
    if(studentOverlapClash(s.studentId, dayKey, s.start, s.duration, s.id)) return false;
    if(s.recurring){
      const plan=studentPlanOn(s.studentId, date);
      if(!(plan.recurring||[]).some(function(r){ return r.weekday===weekday && r.start===s.start; })) return false;
    }
    return true;
  });
  // One row per child per time (Oct 2026, per Allie: "why is there 3 cancelled sessions for
  // mariella for today") — schedule edits and re-bookings can leave several cancelled copies of the
  // same session. Keep the most meaningful: away/not in, then a deliberate cancel, then the newest.
  const rank=function(s){ return s.status!=='cancelled'? 3 : (s.parentCancelled || s.oneOffCancel)? 2 : 1; };
  const best={};
  list.forEach(function(s){
    const k=s.studentId+'|'+s.start, cur=best[k];
    if(!cur || rank(s)>rank(cur) || (rank(s)===rank(cur) && String(s.id)>String(cur.id))) best[k]=s;
  });
  return Object.keys(best).map(function(k){ return best[k]; }).sort(function(a,b){ return a.start-b.start; });
}
function notComingCardHtml(dayKey){
  const list=notComingSessionsForDay(dayKey);
  if(!list.length) return '';
  const statusLabel={cancelled:'Cancelled', excused:'Away · make-up credit', 'no-show':'Not in'};
  return '<div class="card" style="margin:0"><div class="card-head"><h3 style="margin:0">Not coming</h3>'
      +'<span class="small muted">Parent changed their mind? Restore puts them back in their seat.</span></div>'
    +'<table><tr><th>Student</th><th>Time</th><th>Was in</th><th>Status</th><th></th></tr>'
    +list.map(function(s){
      const student=findStudent(s.studentId);
      const where = s.online? 'Online' : (s.podId && findPod(s.podId)? findPod(s.podId).name : 'Unassigned');
      return '<tr><td><b>'+student.name+'</b></td><td>'+rangeLabel(s.start, s.duration)+'</td><td>'+where+'</td>'
        +'<td><span class="badge soon">'+(statusLabel[s.status]||s.status)+'</span>'+(s.creditId? ' <span class="badge firstday">Make-up</span>' : '')+'</td>'
        +'<td><button class="btn sm ghost" onclick="restoreSession(\''+s.id+'\')">Restore</button></td></tr>';
    }).join('')
    +'</table></div>';
}

// Every student expected on a given day, across every Pod (and Unassigned) at once — replaces the
// old per-Pod roster loop (Sept 2026). Originally sorted alphabetically by student name; changed
// Sept 2026 (per Allie: "can we arrange pod scheduling permanent changes to be by order of
// arrival, not alphabetical") to sort by arrival time instead — a student already checked in sorts
// by when they actually arrived (actualStart), everyone else by their scheduled start time, so the
// list reads top-to-bottom as "who's here/coming first". Student name is now only a tie-break for
// two sessions landing at the exact same time.
function scheduleListForDay(dayKey){
  return sessionsOnDate(dayKey).filter(function(s){ return s.status!=='cancelled'; })
    .slice()
    .sort(function(a,b){
      const aTime=(a.status==='attended' && a.actualStart!=null)? a.actualStart : a.start;
      const bTime=(b.status==='attended' && b.actualStart!=null)? b.actualStart : b.start;
      if(aTime!==bTime) return aTime-bTime;
      const an=findStudent(a.studentId), bn=findStudent(b.studentId);
      if(!an || !bn) return 0;
      return an.name.localeCompare(bn.name, undefined, {sensitivity:'base'});
    });
}

// The Schedule list's own Pod dropdown, onchange — picks freely (Sept 2026: no age or capacity
// blocking on the picker itself), but capacity is still the one thing that can actually refuse the
// change (movePodSession still checks it) since that's the one requirement left (the 1:8 ratio).
// An empty value unassigns outright, with no capacity/coverage math needed for that.
function setSessionPod(sessionId, podId){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  if(!podId){
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
    toast(student.name+' set to Unassigned.');
    render();
    return;
  }
  const result=movePodSession(sessionId, podId);
  if(!result.ok){ toast(result.error); render(); return; }
  if(result.newPod){
    toast(result.oldPod? (student.name+' moved from '+result.oldPod.name+' to '+result.newPod.name+'.') : (student.name+' assigned to '+result.newPod.name+'.'));
  }
  render();
}

// The Pod seating section's own "Move to" picker (Sept 2026, per Allie: "I think maybe instead of
// having the pre-assigned pods as always visible, that is another section at the bottom default
// collapsed, where we can visually arrange students and any changes made to that section are
// permanent changes from that day onward") — unlike setSessionLocation/setSessionPod above (a
// one-off, this-session-only move), choosing a destination here is a PERMANENT standing change:
// this weekday, from the viewed day forward, using the exact same pin mechanism as the "Change Pod"
// feature (saveStudentPodAssignment) — just invoked directly instead of through its own modal.
// Confirmed sessionRowHtml/rosterTableHtml are only ever rendered inside renderPodSummaryStrip, so
// this is the only picker that needs this behavior; every other Pod/Online picker in the app
// (Schedule list row wasn't a thing anymore, check-in modal, the separate Move-pod modal) stays a
// one-off move via setSessionLocation/confirmMovePod, untouched.
function setPermanentSessionLocation(sessionId, weekday, dayKey, value){
  const sess=findSession(sessionId);
  if(!sess) return;
  const student=findStudent(sess.studentId);
  const isOnline=String(value).indexOf('online:')===0;
  const podId=isOnline? null : (value||null);
  const instructorId=isOnline? value.slice(7) : null;

  // Move the session actually being looked at right now, the same way the one-off pickers always
  // have (movePodSession/setSessionOnline directly, same as confirmMovePod uses) — capacity is still
  // enforced for a future-dated day exactly as before (movePodSession's own isToday check), only
  // relaxed for the day it's actually happening. If this fails, stop — no pin gets written for a
  // move that didn't actually happen.
  if(isOnline){
    const result=setSessionOnline(sessionId, instructorId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else if(podId){
    const result=movePodSession(sessionId, podId);
    if(!result.ok){ toast(result.error); render(); return; }
  } else {
    sess.podId=null; sess.instructorId=null; sess.instructorId2=null; sess.handoff=null; sess.online=false;
    dbWrite('unassigning a session\'s Pod', function(){ return supabaseClient.from('sessions').update({
      pod_id:null, instructor_id:null, instructor_id_2:null, handoff_min:null, online:false
    }).eq('id', sess.id); });
  }

  const movedCount=pinStandingLocation(student, weekday, dayKey, podId, isOnline, instructorId, sessionId);
  permanentMoveToast(student, weekday, dayKey, podId, isOnline, instructorId, movedCount);
  render();
}
// The same permanent move for a regular student who has NO live session on that date to move
// directly — on hold, cancelled just that once, or not started yet (Oct 2026, the standing roster in
// regularSeatingRows shows them too). If they do have one, it's the session-based move above.
function setPermanentStudentLocation(studentId, weekday, dayKey, start, value){
  const live=sessionsOnDate(dayKey).find(function(s){ return s.studentId===studentId && s.start===start && s.status!=='cancelled'; });
  if(live){ setPermanentSessionLocation(live.id, weekday, dayKey, value); return; }
  const student=findStudent(studentId);
  const isOnline=String(value).indexOf('online:')===0;
  const podId=isOnline? null : (value||null);
  const instructorId=isOnline? value.slice(7) : null;
  const movedCount=pinStandingLocation(student, weekday, dayKey, podId, isOnline, instructorId, null);
  permanentMoveToast(student, weekday, dayKey, podId, isOnline, instructorId, movedCount);
  render();
}
function permanentMoveToast(student, weekday, dayKey, podId, isOnline, instructorId, movedCount){
  const destLabel = isOnline? ('Online — '+findInstructor(instructorId).name) : (podId? findPod(podId).name : 'Unassigned');
  toast(student.name+' permanently moved to '+destLabel+' on '+weekday+'s, from '+fmtShort(new Date(dayKey))+' onward'+(movedCount? ' — '+movedCount+' upcoming standing session'+(movedCount===1?'':'s')+' regenerated to match' : '')+'.');
}
// Pins the student's standing location on one weekday from dayKey forward, then cancels and
// regenerates their already-generated future standing sessions on that weekday so they pick it up.
// Returns how many were regenerated. excludeSessionId: a session the caller already moved itself.
function pinStandingLocation(student, weekday, dayKey, podId, isOnline, instructorId, excludeSessionId){
  const sessionId=excludeSessionId;
  // Then pin it as a standing change from this weekday forward — identity for "replacing" a prior
  // pin is (effectiveFrom, weekday) together, same convention saveStudentPodAssignment() uses.
  student.podAssignments=(student.podAssignments||[]).filter(function(a){
    return !(toKey(a.effectiveFrom)===dayKey && (a.weekday||null)===weekday);
  });
  student.podAssignments.push({podId:podId, online:isOnline, instructorId:instructorId, effectiveFrom:new Date(dayKey), weekday:weekday});
  dbWrite('pinning standing Pod from seating section', function(){
    return supabaseClient.from('student_pod_assignments').delete().eq('student_id', student.id).eq('effective_from', dayKey).eq('weekday', weekday)
      .then(function(){
        return supabaseClient.from('student_pod_assignments').insert({student_id:student.id, pod_id:podId, online:isOnline, instructor_id:instructorId, effective_from:dayKey, weekday:weekday});
      });
  });

  // Cancel + regenerate already-generated future standing occurrences on that one weekday from this
  // date forward, same as saveStudentPodAssignment() — otherwise only sessions not yet generated
  // would pick up the new pin. The session moved directly above is excluded (already handled, and
  // it may not even be `recurring`, e.g. a one-off staff-placed session).
  let movedCount=0;
  sessions.forEach(function(s){
    if(s.studentId!==student.id || !s.recurring || s.status!=='scheduled' || s.id===sessionId) return;
    if(toKey(s.date) < dayKey) return;
    if(WEEKDAY_KEYS[(new Date(s.date).getDay()+6)%7]!==weekday) return;
    s.status='cancelled';
    movedCount++;
    dbWrite('cancelling a session for a permanent Pod seating change', function(){ return supabaseClient.from('sessions').update({status:'cancelled'}).eq('id', s.id); });
    if(s.creditId){
      const cr=findCredit(s.creditId);
      if(cr && cr.status==='redeemed' && toKey(cr.expiryDate)>=toKey(simNow())){
        cr.status='available'; cr.redeemedSessionId=null;
        dbWrite('restoring a make-up credit', function(){ return supabaseClient.from('credits').update({status:'available', redeemed_session_id:null}).eq('id', cr.id); });
      }
    }
  });
  regenerateAllRecurring();
  return movedCount;
}

// Collapse state for front-desk sections lives on `state` (so it survives the full-page
// re-render every action triggers) but isn't persisted anywhere beyond the current browser tab —
// each section just remembers whether it's open or closed for the rest of this visit.
function sectionCollapsed(id){ return !!(state.collapsedSections && state.collapsedSections[id]); }
function toggleSection(id){
  state.collapsedSections = state.collapsedSections || {};
  state.collapsedSections[id] = !state.collapsedSections[id];
  render();
}
// Builds the opening "<div class='card'><div class='card-head'><h2>...</h2>" markup shared by
// every front-desk section, with the collapse toggle wired onto the title itself (not the whole
// header row) so any action buttons placed in extraHeaderHtml stay independently clickable.
function sectionOpen(id, title, extraHeaderHtml){
  return '<div class="card'+(sectionCollapsed(id)?' collapsed':'')+'">'
    +'<div class="card-head"><h2 class="sec-toggle" onclick="toggleSection(\''+id+'\')"><span class="chev">▾</span>'+title+'</h2>'
    +(extraHeaderHtml||'')+'</div>';
}

            .sort(function(x,y){ return x.a.rank-y.a.rank || x.i.name.localeCompare(y.i.name); });

function renderPodAssignModal(){
  const f=state.podAssignForm;
  if(!f) return '';
  const pod=findPod(f.podId);
  const now=simNow();
  const blocks=podBlocksForDay(f.podId, f.weekday);
  let html='<div class="overlay" onclick="if(event.target===this) closePodAssignForm()"><div class="modal">';
  html+='<h3>Assign '+pod.name+' — '+f.weekday+'</h3>';
  html+='<p>Who runs this Pod on '+f.weekday+'s, and when. Add another shift to hand the Pod off to a different instructor partway through the day — or line up a replacement for an existing shift starting from a future date, without disturbing who\'s covering it until then.</p>';
  if(f.error) html+='<div class="banner danger">'+f.error+'</div>';
  if(blocks.length===0){ html+='<div class="empty-note">Unassigned — nobody covers this Pod on '+f.weekday+'s.</div>'; }
  blocks.forEach(function(b){
    const draft=f.drafts[b.id] || {instructorId:'', effectiveFrom:toKey(now)};
    const currentId=blockInstructorOn(b, now);
    const upcoming=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); }).sort(function(a,b2){ return toKey(a.effectiveFrom).localeCompare(toKey(b2.effectiveFrom)); });
    const effDate=draft.effectiveFrom? new Date(draft.effectiveFrom) : now;
    const qualifying=qualifyingInstructorsForBlock(f.weekday, b, effDate);
    // The Regular rostered shifts grid (renderRosteredShiftsGrid) deliberately reads this SAME block
    // as of this weekday's own NEXT real occurrence, not today (task #233) — so if a scheduled change
    // below is already effective by that date, the grid shows the NEW name while "Currently" here
    // (evaluated as of today) still correctly shows the OLD one, until that date actually arrives.
    // Spelled out explicitly (Sept 2026, per Allie: "it says Laura, and when i click it it says
    // Sanvi so im confused") rather than leaving someone to work it out from the "Scheduled changes"
    // line alone.
    const nextOccurrence=nextRegularOccurrence(f.weekday, now);
    const ongoingAtNextOccurrence=blockInstructorOngoing(b, nextOccurrence);
    const gridShowsDifferentName = ongoingAtNextOccurrence!==currentId;

    html+='<div class="pod-card" style="margin-bottom:10px">';
    html+='<div class="block-row">'
      +'<div><label>From</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'start\',this.value)">'
        +EARLY_SHIFT_TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===b.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>To</label><select onchange="setPodBlockTime(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\'end\',this.value)">'
        +EARLY_SHIFT_TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(!b.closesLate && t===b.end?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
        +'<option value="'+SHIFT_CLOSE+'"'+(b.closesLate?' selected':'')+'>Close</option>'
      +'</select></div>'
      +'<button class="btn sm ghost" onclick="removePodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Remove shift</button>'
    +'</div>';
    html+='<div class="small" style="margin-bottom:8px">Currently: <b>'+(currentId? findInstructor(currentId).name : 'Unassigned')+'</b>'
      +(gridShowsDifferentName? ' <span class="small muted">— the grid above already shows <b>'+(ongoingAtNextOccurrence? findInstructor(ongoingAtNextOccurrence).name : 'Unassigned')+'</b> because that\'s who\'s rostered on by '+fmtShort(nextOccurrence)+', this '+f.weekday+'\'s next actual date; today\'s still covered by whoever\'s shown here until then</span>' : '')
      +'</div>';
    if(upcoming.length>0){
      html+='<div class="small muted" style="margin-bottom:8px">Scheduled changes: '+upcoming.map(function(a){
        return findInstructor(a.instructorId).name+' from '+fmtShort(a.effectiveFrom)+' <a href="#" onclick="removeAssignment(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\',\''+toKey(a.effectiveFrom)+'\');return false;" style="color:var(--danger)">✕</a>';
      }).join(', ')+'</div>';
    }
    html+='<div class="row2" style="align-items:flex-end">';
    if(qualifying.length===0){
      html+='<div class="small muted">No instructor is currently available for this shift on that date — adjust availability first, or pick a different date.</div>';
    } else {
      html+='<div><label>Assign</label><select onchange="setAssignDraftField(\''+b.id+'\',\'instructorId\',this.value)">'
        +'<option value="">Choose…</option>'
        +qualifying.map(function(i){ return '<option value="'+i.id+'"'+(i.id===draft.instructorId?' selected':'')+'>'+i.name+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>From</label><input type="date" value="'+draft.effectiveFrom+'" onchange="setAssignDraftField(\''+b.id+'\',\'effectiveFrom\',this.value)"/></div>'
      +'<button class="btn sm primary" onclick="saveAssignmentChange(\''+f.podId+'\',\''+f.weekday+'\',\''+b.id+'\')">Save</button>';
    }
    html+='</div></div>';
  });
  html+='<button class="btn sm ghost" onclick="addPodShiftBlock(\''+f.podId+'\',\''+f.weekday+'\')">+ Add shift</button>';
  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn primary" onclick="closePodAssignForm()">Done</button>'
  +'</div>';
  html+='</div></div>';
  return html;
}

function renderEnrollmentRequestsPanel(){
  const open=enrollmentRequests.filter(function(r){ return r.status==='open'; }).sort(function(a,b){ return a.createdAt-b.createdAt; });
  if(open.length===0) return '';
  let html=sectionOpen('enrollRequests','📋 Parent Requests','<span class="small muted">'+open.length+'</span>');
  html+='<p>Hold, schedule-change, and cancel-enrolment requests parents submitted from their own login — approving applies it immediately (same as placing a hold or changing a student\'s schedule yourself); declining just clears it from this list.</p>';
  html+='<table><tr><th>Student</th><th>Parent</th><th>Request</th><th>Note</th><th></th></tr>';
  open.forEach(function(r){
    const student=findStudent(r.studentId);
    const parent=parents.find(function(p){ return p.id===student.parentId; });
    // Parents can only ever submit a request (RLS blocks a parent from approving their own), so
    // this stays a human click either way — but for a time-change request, flagging up front that
    // every slot they picked is still open right now means front desk can hit Approve without
    // having to go check availability themselves first (Sept 2026, per Allie: "it should become
    // automatically approved, not require front desk 'ok' as long as there's availability" — this
    // is the closest safe equivalent, since only staff logins can actually write a schedule change).
    const readyToApprove = r.type==='time_change' && (r.requestedRecurring||[]).length>0
      && r.requestedRecurring.every(function(rec){ return standingSlotHasAvailability(rec.weekday, rec.start, student.duration, student.year); });
    // Notice is judged from when the parent sent it (Oct 2026 — see applyHold's noticeFrom).
    const holdLate = r.type==='hold' && r.createdAt && !monthNoticeOk(r.start, r.createdAt);
    const detail = r.type==='hold'
      ? 'Hold: '+fmtShort(r.start)+'–'+fmtShort(r.end)
        +(r.createdAt? '<div class="small muted">Sent '+fmtShort(r.createdAt)+' — '+(holdLate? '<span style="color:var(--warning)">late notice: sessions without enough notice become make-up credits</span>' : 'enough notice, sessions just cancelled')+'</div>' : '')
      : r.type==='time_change'
      ? timeChangeSwapDetail(r)+' from '+fmtShort(r.effectiveFrom)+(readyToApprove? ' <span class="badge available">All times open — ready to approve</span>' : '')
      : '<span class="badge full">Cancel enrolment</span> from '+fmtShort(r.effectiveFrom);
    // Who actually sent it (Oct 2026) — with a second parent linked, it may not be the main parent.
    const sender=r.requestedBy? parents.find(function(p){ return p.id===r.requestedBy; }) : null;
    const parentCell = sender && (!parent || sender.id!==parent.id)
      ? sender.name+' <span class="muted">(2nd parent/guardian)</span>'
      : (parent? parent.name : '—');
    html+='<tr><td>'+student.name+'</td><td class="small">'+parentCell+'</td>'
      +'<td>'+detail+'</td>'
      +'<td class="small muted">'+(r.note||'—')+'</td>'
      +'<td><button class="btn sm primary" style="margin:2px" onclick="approveEnrollmentRequest(\''+r.id+'\')">Approve</button> <button class="btn sm ghost" style="margin:2px" onclick="declineEnrollmentRequest(\''+r.id+'\')">Decline</button></td></tr>';
  });
  html+='</table></div>';
  return html;
}

function renderCheckedInPanel(){
  const todays=checkedInTodayStillPresent().slice().sort(function(a,b){ return a.actualEnd-b.actualEnd; });
  // Everyone who's come in today, including those already checked out (Oct 2026, per Allie: "a
  // counter of how many kids have come to the centre today") — counted once per child.
  const todayKey=toKey(simNow());
  const cameToday=new Set(sessionsOnDate(todayKey).filter(function(s){ return s.status==='attended'; }).map(function(s){ return s.studentId; })).size;
  let html=sectionOpen('checkedin','Checked in today',
    '<span class="small muted">'+todays.length+' student'+(todays.length===1?'':'s')+' · '+cameToday+' total today</span>');
  // Relocated here, at the very top of the section (Sept 2026, per Allie: "move who's here right
  // now to the top of the checked in today section") — always today, since this panel only ever
  // concerns itself with today regardless of which day is picked in the Schedule section below.
  // Always rendered now, even before anyone's checked in (Sept 2026, per Allie: "show the pods,
  // (empty) but with the staff allocated to them even if there are no students check in") — the
  // board itself shows every staffed Pod's header and instructor name with "Open" seats in that
  // case, so front desk can see who's covering what before the first check-in of the day, rather
  // than the whole board being skipped until someone arrives.
  html+=renderLiveOccupancyBoard(toKey(simNow()));
  html+='<p>Exit time defaults to check-in time plus their usual session length (90 min for most, per each student\'s plan) — however late (or early) that check-in was. Both the checked-in time and exit time can be corrected here if needed — say a parent\'s pick-up plan changes, or the arrival time recorded at check-in was wrong. "Time left" counts down live against the actual clock, so it stays accurate even if you don\'t touch this page. Once a student actually leaves, use their own "Check out" button — it drops them off this list, defaulting to whichever preset time is closest to right now (adjust it if they were signed out earlier or later than that).</p>';
  if(todays.length===0){ html+='<div class="empty-note">Nobody checked in yet today.</div>'; }
  else{
    html+='<table><tr><th>Student</th><th>Pod</th><th>Checked in</th><th>Exit time</th><th>Time left</th><th></th></tr>';
    todays.forEach(function(s){
      const student=findStudent(s.studentId);
      const pod=findPod(s.podId);
      const instrLabel = s.instructorId2? (findInstructor(s.instructorId).name+' → '+findInstructor(s.instructorId2).name) : (s.instructorId? findInstructor(s.instructorId).name : '—');
      // Recomputed fresh from the session's own (persisted) checkInOffset every render, rather than
      // read off a separate stored "defaultEnd" field — that field was never written to Supabase
      // (only ever held in memory), so after any page reload it came back undefined and every row
      // showed "(usually NaN)" here, regardless of whether the exit time had actually been
      // adjusted. Deriving it from checkInOffset + autoExitTime() is always correct, always
      // available, and needs nothing extra saved.
      const defaultEnd = autoExitTime(s, s.checkInOffset||0);
      const adjusted = s.actualEnd!==defaultEnd;
      const cd=countdownInfo(s.actualEnd);
      html+='<tr><td>'+student.name+'</td><td class="small">'+(s.online?'Online':(pod?pod.name:'—'))+' · '+instrLabel+'</td>'
        +'<td><select onchange="setActualStart(\''+s.id+'\',this.value)">'
          +EXIT_TIME_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===s.actualStart?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
        +'</select></td>'
        +'<td><select onchange="setExitTime(\''+s.id+'\',this.value)">'
          +exitOptionsHtml(s.actualEnd)
        +'</select>'
        +(adjusted? ' <span class="small muted">(usually '+minToLabel(defaultEnd)+')</span>' : '')
        +'</td><td><span class="badge '+cd.cls+'">'+cd.label+'</span></td>'
        +'<td><button class="btn sm" onclick="openCheckOut(\''+s.id+'\')">Check out</button> '
        +'<button class="btn sm ghost" onclick="undoCheckIn(\''+s.id+'\')">Undo check-in</button></td></tr>';
    });
    html+='</table>';
  }
  html+=renderQuickCoverageModal();
  html+=renderQuickMoveModal();
  html+='</div>';
  return html;
}

function renderAvailabilityLookup(){
  const sessionLen=state.availSessionLen||AVAIL_MIN_SESSION_LEN;
  let html=sectionOpen('availability','Availability lookup',
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
      +'<select class="btn sm" style="padding:5px 8px" onchange="setAvailSessionLen(this.value)" title="Check against a specific session length">'

      +'</select>'
    +'</div>');
  // Sept 2026: this now checks whatever length is selected above, not a fixed 90 minutes — a parent
  // whose sessions actually run 120 minutes can have no real make-up slot in the next two weeks
  // (openSlotsForCredit checks their real duration) even on a half-hour where the OLD fixed 90-min
  // grid would have shown "open", since the extra 30 minutes past 90 might run into a shift ending
  // or someone else's session starting. Match the selector to the family you're helping.
  // Descriptive blurb removed per Allie ("no blurb") — the grid explains itself well enough via its
  // own "No staff"/"Full"/"N open" labels.
  // Sept 2026, per Allie: "an overview of regularly scheduled sessions - not so week-by-week" — each
  // weekday now has exactly one reference date (the next real occurrence of it, see
  // nextRegularOccurrence), not a This-week/Next-week toggle that could show two different numbers
  // for the same weekday depending which one you happened to click.
  // Twice as many columns at 15-min steps (Oct 2026) — each keeps a minimum width so "2 open from
  // 14 Oct" stays readable, and the grid scrolls sideways on a narrow screen instead of squashing.
  html+='<div style="overflow-x:auto"><div class="avail-grid" style="grid-template-columns:90px repeat('+AVAIL_BLOCKS.length+',minmax(64px,1fr))">';
  html+='<div></div>'+AVAIL_BLOCKS.map(function(hb){ return '<div class="cal-head">'+minToLabel(hb)+'</div>'; }).join('');
  WEEKDAY_KEYS.forEach(function(weekday){
    const d=nextRegularOccurrence(weekday);
    const dateKey=toKey(d);
    html+='<div class="cal-row-label">'+weekday+' <span class="small muted" style="font-weight:400">'+d.toLocaleDateString('en-AU',{month:'short',day:'numeric'})+'</span></div>';
    AVAIL_BLOCKS.forEach(function(hb){
      const r=openSeatsAt(dateKey, weekday, hb, '', sessionLen);
      let cls='avail-cell', label, clickable=false;
      if(r.staffed===0){ cls+=' nostaff-cell'; label='No staff'; clickable=true; }
      else if(r.seats===0){
        // Sept 2026, per Allie: "if a child is finishing up within 2 weeks, and their slot will
        // become available... display 1 open from date" — a genuinely full slot stays "Full" and
        // clickable to the waitlist, same as ever; one about to free up because of a real, dated
        // schedule change (not a temporary hold — see upcomingSlotDeparture) gets its own look
        // instead, and isn't pushed toward the waitlist since it's about to just be bookable outright.
        const opening=regularSlotOpeningSoon(dateKey, weekday, hb, sessionLen);
        if(opening){ cls+=' opening-cell'; label=opening.count+' open from '+fmtShort(opening.date); }
        else { cls+=' full-cell'; label='Full'; clickable=true; }
      }
      else { cls+=' on'; label=r.seats+' open'; }
      if(clickable){
        html+='<div class="'+cls+'" style="cursor:pointer" title="Add someone to the waitlist for '+weekday+' '+minToLabel(hb)+'" onclick="openWaitlistForm(\''+weekday+'\','+hb+')">'+label+'</div>';
      } else {
        html+='<div class="'+cls+'">'+label+'</div>';
      }
    });
    // Online is its own distinct row per day — never merged into the Pod row above — reporting the
    // aggregate seats available across every instructor on shift for that window (see onlineSeatsAt).
    html+='<div class="cal-row-label small muted">↳ Online</div>';
    AVAIL_BLOCKS.forEach(function(hb){
      const seats=onlineSeatsAt(dateKey, weekday, hb, sessionLen);

// while the section happens to be collapsed changes state.weekOffset correctly but produces no
// visible change at all, which looks exactly like the button doing nothing.
