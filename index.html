function selectDay(k){ state.selectedDayKey=k; render(); }

// Jumps the Schedule section straight to any date — including one long past — rather than only
// ever reaching "this week" or "next week" one click at a time (5.28, per Allie: front desk wants
// to pull up how a past day was actually seated, for training/adjustment purposes). Works by
// landing on that date's own week (so the existing Mon-Fri day picker and every day-driven render —
// the Pod summary strip, the schedule list with its actual check-in/out times — just work exactly
// as they already do for "this week"/"next week", no separate history view needed). A weekend date
// has no matching day-picker button, so it silently falls back to that week's Monday, same as any
// other selectedDayKey that doesn't land in the visible week.
function jumpToDate(dateStr){
  if(!dateStr) return;
  const target=new Date(dateStr);
  const mondayOfTarget=getMonday(target);
  const mondayOfThisWeek=getMonday(simNow());
  state.weekOffset=Math.round((mondayOfTarget-mondayOfThisWeek)/(7*86400000));
  state.selectedDayKey=toKey(target);
  if(state.collapsedSections && state.collapsedSections.schedule){ state.collapsedSections.schedule=false; }
  render();
}

// Builds each Pod's <option> label for any dropdown that lets front desk choose a Pod directly —
// this booking modal and the flat Schedule list's per-student picker (renderScheduleList) both use
// it, so "which Pod is this, who's covering it, how full is it" always reads identically wherever
// a Pod gets picked. No option is ever disabled here (Sept 2026 — pick freely, no age or capacity
// blocking on the picker itself); capacity is still enforced when the pick is actually confirmed.
// Names whoever is ACTUALLY minding the Pod that day (Nov 2026, per Allie: "when I change an
// instructor in the whos here right now table, I need those changes to come up in the dropdown list
// when checking-in a student") — a floor move from the board wins over the roster, via
// sessionMinderFor(), the same rule that decides which instructor the session itself gets.
function podOptionLabel(pod, weekday, dateKey, start, duration){
  const date=new Date(dateKey);
  const fl=floorAssignmentFor(pod.id, dateKey);
  const cov=sessionMinderFor(pod.id, weekday, start, duration, date);
  const who=cov.primaryInstructorId? findInstructor(cov.primaryInstructorId).name : (fl? 'No instructor' : 'Unassigned');
  const peak=peakConcurrency(pod.id, dateKey, {start, duration});
  const cap=podCapacity(pod.id);
  return pod.name+' — '+who+' — '+peak+'/'+cap;
}

// Same idea as podOptionLabel, for an "Online — [instructor]" choice: shows that instructor's
// COMBINED (physical + online) headcount against the higher online ratio, so front desk can see at
// a glance whether picking them still leaves room. excludeSessionId (see instructorCombinedPeak)
// keeps an already-online session's own current slot from double-counting against itself.
function onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId){
  const peak=instructorCombinedPeak(instr.id, dateKey, {start:start, duration:duration}, excludeSessionId);
  return 'Online — '+instr.name+' — '+peak+'/'+combinedCapFor(instr.id);
}
// A session's current location, encoded as one value for a single Pod/Online <select>: a Pod's own
// id, '' for unassigned, or 'online:<instructorId>' for an Online group — see setSessionLocation().
function sessionLocationValue(sess){ return sess.online? ('online:'+sess.instructorId) : (sess.podId||''); }
// The shared "which Pod, or which Online group" <option> list — every picker that lets front desk
// choose a session's location (the flat Schedule list's row picker, the check-in modal, the booking
// modal) renders from this, so all three always offer the exact same choices in the exact same
// format. Online is deliberately its own <optgroup> — a distinct concept in the picker, not just
// another Pod-shaped row — and only ever lists instructors actually on shift right now (see
// instructorsOnShift()); nothing is ever disabled here (same "pick freely, capacity enforced on
// confirm" convention pods already use), except where the caller wants otherwise (see renderMoveModal,
// which does still disable a full choice).
function locationOptionsHtml(weekday, dateKey, start, duration, selectedValue, excludeSessionId){
  let html=pods.map(function(p){
    return '<option value="'+p.id+'"'+(selectedValue===p.id?' selected':'')+'>'+podOptionLabel(p, weekday, dateKey, start, duration)+'</option>';
  }).join('');
  const onlineInstrs=instructorsOnShift(weekday, start, duration, new Date(dateKey));
  if(onlineInstrs.length){
    html+='<optgroup label="Online">'+onlineInstrs.map(function(instr){
      const val='online:'+instr.id;
      return '<option value="'+val+'"'+(selectedValue===val?' selected':'')+'>'+onlineOptionLabel(instr, dateKey, start, duration, excludeSessionId)+'</option>';
    }).join('')+'</optgroup>';
  }
  return html;
}

function renderBookingModal(){
  if(!state.booking) return '';
  const b=state.booking, f=state.bookingForm;
  const isOnline = String(f.location).indexOf('online:')===0;
  const onlineInstr = isOnline? findInstructor(f.location.slice(7)) : null;
  const pod = (!isOnline && f.location)? findPod(f.location) : null;
  const date=new Date(b.dateKey);
  const weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
  const student=f.studentId? findStudent(f.studentId): null;
  const starts=possibleStarts(f.duration);
  const end=f.start!=null? f.start+f.duration : null;

  const onlinePeak = (student && f.start!=null && onlineInstr)? instructorCombinedPeak(onlineInstr.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const onlineOverCapacity = (student && f.start!=null && onlineInstr) && onlinePeak>combinedCapFor(onlineInstr.id);

  let cov=null, instr1=null, suited1=true, totallyUnassigned=false, instr2=null, suited2=true;
  if(student && f.start!=null && pod){
    cov=podCoverageDetail(pod.id, weekday, f.start, f.duration, date);
    totallyUnassigned = !cov.primaryInstructorId;
    instr1 = cov.primaryInstructorId? findInstructor(cov.primaryInstructorId) : null;
    suited1 = instr1? instructorSuitedFor(instr1, student.year) : true;
    instr2 = cov.secondaryInstructorId? findInstructor(cov.secondaryInstructorId) : null;
    suited2 = instr2? instructorSuitedFor(instr2, student.year) : true;
  }
  // "Best suited for" (5.3) is a preference, not a requirement — it never forces an override. The
  // only thing that still can (Sept 2026 — age/year rules removed entirely) is actual staffing:
  // nobody assigned anywhere near the window, or a gap bigger than the tolerated 15 minutes
  // unattended (UNATTENDED_TOLERANCE_MIN). No Pod chosen at all needs no override either — that
  // just books it unassigned, same as any other uncovered slot.
  const needsOverride = student && pod && cov && !cov.ok;

  const cap=pod? podCapacity(pod.id) : 0;
  const wouldBePeak = (student && f.start!=null && pod)? peakConcurrency(pod.id, b.dateKey, {start:f.start, duration:f.duration}) : 0;
  const isTodayBooking = b.dateKey===toKey(simNow());
  // Same-day capacity bypass (5.34, per Allie: "I also need all front staff to have the ability to
  // overbook a pod on the day, not just me") — a future-dated booking is still hard-capped, no
  // override possible; today's real room can be overbooked directly here, same rule movePodSession
  // already applies to moving an existing session.
  const overCapacity = (student && f.start!=null && pod) && !isTodayBooking && podCapacityBlocked(pod.id, b.dateKey, {start:f.start, duration:f.duration});
  const overCapacityButAllowedToday = (student && f.start!=null && pod) && isTodayBooking && wouldBePeak>cap;

  const credit=b.creditId? findCredit(b.creditId) : null;

  let html='<div class="overlay" onclick="if(event.target===this) closeBooking()"><div class="modal">';
  html+='<h3>'+(credit? 'Book a make-up session' : ('Book a session — '+fmtShort(date)))+'</h3>';
  if(credit){
    // Manually assigning a make-up (Sept 2026, per Allie: "I need a button to manually assign
    // make-up sessions") — the student is fixed to whoever the credit belongs to (a credit can't be
    // reassigned to someone else here), and the date becomes an editable field instead of being
    // fixed by wherever the modal was opened from, since this wasn't opened from any one day's

  if(student && pod && needsOverride){

      : null;
    const reasons=[];

    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" '+(f.overrideOk?'checked':'')+' onchange="toggleOverride()" style="width:auto;margin:0"/> Book anyway</label>';
  }

// New instructor setup (5.18): who's covering the roster + what they told us their starting hours
// are. "Best suited for" is shown as a preference-only tag here too — see the comment on
// openNewInstructorForm for why it can never gate a booking or assignment.
function renderInstructorsPanel(){
  let html=sectionOpen('instructors','Instructors',
    '<button class="btn sm primary" onclick="openNewInstructorForm()">+ Add instructor</button>');
  html+='<table><tr><th>Instructor</th><th>Email</th><th>Best suited for</th><th>Availability <span class="small muted" style="font-weight:400">(self-reported)</span></th><th>Rostered shifts <span class="small muted" style="font-weight:400">(you set these)</span></th><th>Login</th><th></th></tr>';
  instructors.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(instr){
    // Two genuinely separate concepts, shown side by side so front desk never has to guess which
    // one they're looking at: "Availability" is what the instructor says they COULD work (availRules,
    // editable by the instructor themselves, or by front desk via "Adjust availability" below) —
    // it's a declaration, not a commitment. "Rostered shifts" is what front desk has actually
    // assigned them to cover (instructorRosteredShifts(), set via each Pod's "Assign" button in the
    // Schedule section) — that's the real, live staffing record students and other instructors rely
    // on. An instructor can be available Mon-Fri and rostered on only two of those days, or (if a
    // shift was arranged outside their stated hours) rostered on a day they haven't marked available
    // at all — though in practice qualifyingInstructorsForBlock() only offers already-available
    // instructors when assigning a shift, so the two normally line up (Sept 2026).
    const pattern=instructorCurrentWeeklyPattern(instr.id);
    const days=WEEKDAY_KEYS.filter(function(d){ return pattern[d]; });
    const availSummary = days.length? days.map(function(d){ return d+' '+minToLabel(pattern[d].start)+'–'+minToLabel(pattern[d].end); }).join(', ') : 'None on file';
    const shifts=instructorRosteredShifts(instr.id).filter(function(a){ return !a.upcoming; });
    const shiftSummary = shifts.length
      ? shifts.sort(function(a,b){ return WEEKDAY_KEYS.indexOf(a.day)-WEEKDAY_KEYS.indexOf(b.day) || a.start-b.start; })
          .map(function(a){ return a.day+' '+minToLabel(a.start)+'–'+minToLabel(a.end)+' ('+findPod(a.podId).name+')'; }).join(', ')
      : 'Not rostered';
    const inactive = instr.active===false;
    const loginCell = loginStatusCellHtml(instr.authUserId,
      '<button class="btn sm ghost" onclick="inviteLogin(\''+instr.email+'\',\'instructor\',\''+instr.id+'\',\''+instr.name.replace(/'/g,"\\'")+'\')">Invite login</button>',
      resendInviteButtonHtml(instr.email, 'instructor', instr.id, instr.name));
    html+='<tr'+(inactive?' style="opacity:.55"':'')+'><td>'+instr.name+(inactive?' <span class="small muted">(inactive)</span>':'')+'</td><td class="small">'+instr.email+'</td><td>'+yearLabel(instr.yearMin)+'–'+yearLabel(instr.yearMax)+'</td><td class="small">'+availSummary+'</td><td class="small">'+shiftSummary+'</td>'
      +'<td>'+loginCell+'</td>'
      +'<td><button class="btn sm ghost" onclick="openEditInstructorForm(\''+instr.id+'\')">Edit details</button> <button class="btn sm ghost" onclick="openStaffAvailManager(\''+instr.id+'\')">Adjust availability</button> '
      +(inactive
        ? '<button class="btn sm ghost" onclick="reactivateInstructor(\''+instr.id+'\')">Reactivate</button>'
        : '<button class="btn sm ghost" onclick="deactivateInstructor(\''+instr.id+'\')">Deactivate</button>')
      +'</td></tr>';
  });
  html+='</table></div>';
  html+=renderNewInstructorModal();
  html+=renderEditInstructorModal();
  html+=renderStaffAvailManagerModal();
  return html;
}
/* ---------- standalone parent accounts (usually created inline via new-student enrollment;

function openNewParentForm(){

}
function closeNewParentForm(){ state.newParentForm=null; render(); }
function setNPF(field, value){ state.newParentForm[field]=value; state.newParentForm.error=''; render(); }
function saveNewParent(){
  const f=state.newParentForm;
  if(!f.name.trim()){ f.error='Enter the parent\'s name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  const existingParent=parents.find(function(p){ return p.email.toLowerCase()===f.email.trim().toLowerCase(); });
  if(existingParent){

  }
  const newParent={id:newId()||('p'+(nextParentId++)), name:f.name.trim(), email:f.email.trim(), studentIds:[]};
  parents.push(newParent);
  dbWrite('adding a new parent', function(){ return supabaseClient.from('parents').insert({id:newParent.id, name:newParent.name, email:newParent.email}); });
  // Straight on to adding their first child, this parent already selected — a parent record on
  // its own isn't useful for anything else in the app, so there's no reason to make this a

  const dur=90, spw=2;

  toast(newParent.name+' added — now add their first child below.');

}

// Deleting a parent (Oct 2026, per Allie: "I need the ability to delete parents also"). Runs through
// the delete-parent Edge Function (delete-parent.ts), which also removes their login. Not allowed while
// they're still the main parent of a child who's still enrolled — move the child first.
var parentDeleteInFlight={};
function parentActiveMainChildren(p){ return students.filter(function(s){ return s.parentId===p.id && !isStudentInactive(s); }); }
// A finished child's make-ups still to come (Oct 2026, per Allie: "hold on to student and parent
// profiles until sessions booked") — unused, unexpired credits plus booked sessions from today on.
function studentMakeUpsLeft(s){
  const todayKey=toKey(simNow());
  const unused=credits.filter(function(c){ return c.studentId===s.id && c.status==='available' && toKey(c.expiryDate)>=todayKey; }).length;
  const booked=sessions.filter(function(x){ return x.studentId===s.id && x.status==='scheduled' && toKey(x.date)>=todayKey; }).length;
  return unused+booked;
}
function parentChildrenWithMakeUpsLeft(p){ return students.filter(function(s){ return s.parentId===p.id && isStudentInactive(s) && studentMakeUpsLeft(s)>0; }); }
function deleteParent(parentId){
  const p=findParent(parentId);
  if(!p || parentDeleteInFlight[parentId]) return;
  const active=parentActiveMainChildren(p);
  if(active.length){ toast(p.name+' is still the main parent of '+active.map(function(s){ return s.name; }).join(', ')+'. Change the parent on '+(active.length===1? 'that child' : 'those children')+' (Edit details) first.', 8000); return; }
  const owed=parentChildrenWithMakeUpsLeft(p);
  if(owed.length){ toast('Not yet — '+owed.map(function(s){ return s.name+' has '+studentMakeUpsLeft(s)+' make-up'+(studentMakeUpsLeft(s)===1?'':'s')+' left'; }).join(', ')+'. Keep '+p.name+' until they\'re used or expire.', 8000); return; }
  const linked=studentGuardians.filter(function(g){ return g.parentId===p.id; }).map(function(g){ const s=findStudent(g.studentId); return s? s.name : null; }).filter(Boolean);
  const finished=students.filter(function(s){ return s.parentId===p.id; }).map(function(s){ return s.name; });
  if(!confirm('Delete '+p.name+' ('+p.email+')?\n\n'
    +(p.authUserId? 'Their login will be removed — they won\'t be able to sign in.\n' : '')
    +(linked.length? 'They\'ll be removed as 2nd parent/guardian of '+linked.join(', ')+'.\n' : '')
    +(finished.length? finished.join(', ')+' (finished) will keep their records, with no parent on file.\n' : '')
    +'\nThis can\'t be undone.')) return;
  const removeLocally=function(){
    parents=parents.filter(function(x){ return x.id!==p.id; });
    students.forEach(function(s){ if(s.parentId===p.id) s.parentId=null; });
    studentGuardians=studentGuardians.filter(function(g){ return g.parentId!==p.id; });
    refreshParentStudentIds();
    toast(p.name+' deleted.');
    render();
  };
  if(!supabaseClient || !currentUser){ removeLocally(); return; }
  parentDeleteInFlight[parentId]=true; render();
  supabaseClient.functions.invoke('delete-parent', {body:{parentId:p.id}}).then(function(r){
    delete parentDeleteInFlight[parentId];
    const err=(r.error && (r.error.message||String(r.error))) || (r.data && r.data.error);
    if(err){ toast('Couldn\'t delete '+p.name+' — '+err, 8000); render(); return; }
    removeLocally();
  });
}
function parentRowHtml(p){
  const kids=(p.studentIds||[]).map(function(sid){ const s=findStudent(sid); if(!s) return null;
    const left=isStudentInactive(s)? studentMakeUpsLeft(s) : 0;
    return s.name+(s.parentId!==p.id? ' <span class="muted">(as 2nd parent)</span>' : '')+(left? ' <span class="badge soon">'+left+' make-up'+(left===1?'':'s')+' left</span>' : ''); }).filter(Boolean);
  const loginCell = loginStatusCellHtml(p.authUserId,

function defaultStaffShiftForm(staffId){
  const shifts={};
  const pattern=staffId? staffWeeklyPattern(staffId) : {};
  WEEKDAY_KEYS.forEach(function(day){
    const existing=pattern[day];
    shifts[day]=existing? {off:false, start:existing.start, end:existing.end} : {off:true, start:900, end:1140};
  });
  return shifts;
}
function openNewStaffForm(){
  state.newStaffForm={ name:'', email:'', inviteNow:true, shifts:defaultStaffShiftForm(null), error:'' };
  render();
}
function closeNewStaffForm(){ state.newStaffForm=null; render(); }
function setNewStaffField(field, value){ state.newStaffForm[field]=value; state.newStaffForm.error=''; render(); }
function setNewStaffShift(weekday, field, value){
  const a=state.newStaffForm.shifts[weekday];
  if(field==='off') a.off=value;
  else if(field==='end' && value===SHIFT_CLOSE) a.end=SHIFT_CLOSE;
  else a[field]=Number(value);
  // "Close" has no fixed minute value, so it's never "before or equal to" a start time — only clamp
  // when both ends of the shift are real clock times.
  if(a.end!==SHIFT_CLOSE && a.end<=a.start){
    if(field==='start') a.end=Math.min(CENTER_CLOSE, a.start+START_STEP);
    else a.start=Math.max(EARLY_SHIFT_OPEN, a.end-START_STEP);
  }
  state.newStaffForm.error='';
  render();
}
// Turns a {Mon:{off,start,end}, ...} form object into the flat staffRosteredShifts rows
// (staffShiftsFor()'s shape) for the working days only — no row at all means "off" that day.
function shiftFormToRows(shiftForm){
  return WEEKDAY_KEYS.filter(function(day){ return !shiftForm[day].off; })
    .map(function(day){ return {weekday:day, start:shiftForm[day].start, end:shiftForm[day].end}; });
}
function saveNewStaff(){
  const f=state.newStaffForm;
  if(!f.name.trim()){ f.error='Enter their name.'; render(); return; }
  if(!f.email.trim()){ f.error='Enter an email address.'; render(); return; }
  if(staffMembers.some(function(s){ return s.email.toLowerCase()===f.email.trim().toLowerCase(); })){
    f.error='A staff member with that email already exists.'; render(); return;
  }
  const newStaff={id:newId()||('staff'+(nextStaffMemberId++)), name:f.name.trim(), email:f.email.trim(), authUserId:null, oneOffs:[]};
  staffMembers.push(newStaff);
  const rows=shiftFormToRows(f.shifts);
  rows.forEach(function(r){ staffRosteredShifts.push({id:newId()||('sshift'+(nextStaffShiftId++)), staffId:newStaff.id, weekday:r.weekday, start:r.start, end:r.end}); });
  dbWrite('adding a new staff member', function(){ return supabaseClient.from('staff_members').insert({id:newStaff.id, name:newStaff.name, email:newStaff.email}).then(function(r){
    if(r.error || !rows.length) return r;
    return supabaseClient.from('staff_rostered_shifts').insert(rows.map(function(row){ return {staff_id:newStaff.id, weekday:row.weekday, start_min:row.start, end_min: row.end===SHIFT_CLOSE? null : row.end}; }));
  }); });
  const workingDays=rows.map(function(r){ return r.weekday; });
  toast(newStaff.name+' added to front desk staff'+(workingDays.length? ' — rostered '+workingDays.join(', ') : '')+'.');
  state.newStaffForm=null;
  render();
  if(f.inviteNow) inviteLogin(newStaff.email, 'staff', newStaff.id, newStaff.name);
}

    +'<div><label>Person</label><select onchange="setTimesheetFilterPerson(this.value)">'
      +'<option value=""'+(filter.personKey?'':' selected')+'>Everyone</option>'
      +peopleOptions.map(function(o){ return '<option value="'+o.value+'"'+(filter.personKey===o.value?' selected':'')+'>'+o.label+'</option>'; }).join('')
    +'</select></div>'
    +'<div><label>Day</label><input type="date" value="'+filter.date+'" max="'+toKey(simNow())+'" onchange="setTimesheetFilterDate(this.value)"/></div>'
    +(hasFilters? '<button class="btn sm ghost" onclick="clearTimesheetFilters()">Clear filters</button>' : '')
  +'</div>';

  let pool=staffAttendance;
  if(filter.date){
    pool=pool.filter(function(a){ return toKey(a.date)===filter.date; });
  } else {
    const cutoffKey=toKey(addDays(simNow(), -days));
    pool=pool.filter(function(a){ return toKey(a.date)>=cutoffKey; });
  }
  let filteredPersonLabel='';
  if(filter.personKey){
    const sep=filter.personKey.indexOf(':');
    const kind=filter.personKey.slice(0,sep), id=filter.personKey.slice(sep+1);
    pool=pool.filter(function(a){ return kind==='instructor'? a.instructorId===id : a.staffId===id; });
    const match=peopleOptions.find(function(o){ return o.value===filter.personKey; });
    filteredPersonLabel = match? match.label : '';
  }
  const recent=pool.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date) || b.checkIn-a.checkIn; });

  const scopeLabel = filter.date? ('on '+fmtShort(new Date(filter.date))) : ('over the last '+days+' days');
  const whoLabel = filteredPersonLabel? ('for '+filteredPersonLabel) : 'for front desk staff and instructors';
  html+='<p class="small muted">Every check-in/check-out '+scopeLabel+' '+whoLabel+'.</p>';

  if(recent.length===0){
    html+='<div class="empty-note">No attendance recorded'+(hasFilters? ' matching these filters.' : ' yet.')+'</div>';
  } else {
    html+='<table><tr><th>Date</th><th>Name</th><th>Check-in</th><th>Check-out</th><th>Hours</th><th>Vs roster</th></tr>'
      +recent.map(function(r){
        const isInstr=r.instructorId!=null;
        const person = isInstr? findInstructor(r.instructorId) : findStaffMember(r.staffId);
        const rostered = isInstr? instructorAvailabilityOn(r.instructorId, r.date) : staffShiftOn(r.staffId, r.date);
        let vsRoster='<span class="small muted">Not rostered</span>';
        if(rostered){
          vsRoster = r.checkIn>rostered.start? '<span class="badge full">'+(r.checkIn-rostered.start)+'m late</span>' : '<span class="badge available">On time</span>';
        }
        const roleTag = isInstr? ' <span class="small muted">(Instructor)</span>' : '';
        return '<tr><td>'+fmtShort(r.date)+'</td><td>'+(person? person.name : '—')+roleTag+'</td><td>'+minToLabel(r.checkIn)+'</td>'
          +'<td>'+(r.checkOut!=null? minToLabel(r.checkOut) : '<span class="small muted">Still on site</span>')+'</td>'
          +'<td>'+staffHoursLabel(staffMinutesWorked(r))+'</td><td>'+vsRoster+'</td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div>';
  return html;
}

  html+='<label>Student</label><select onchange="setHoldField(\'studentId\',this.value)"><option value="">Choose a student…</option>'
    +students.filter(function(s){ return !isStudentInactive(s); }).slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(s){ return '<option value="'+s.id+'"'+(s.id===f.studentId?' selected':'')+'>'+s.name+'</option>'; }).join('')
    +'</select>';
  html+='<div class="row2"><div><label>Start date</label><input type="date" value="'+f.start+'" onchange="setHoldField(\'start\',this.value)"/></div>'

  // Sept 2026, per Allie: prompt front desk to say how to handle any session this hold would cancel
  // that falls inside the 7-day-before-the-month notice window, rather than silently just cancelling
  // it with no make-up the way a front-desk hold always used to.
  const lateSessions=holdLateNoticeSessions(f.studentId, f.start, f.end);
  if(lateSessions.length>0){
    const lateList=lateSessions.slice().sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)); })
      .map(function(s){ return fmtShort(s.date)+' '+rangeLabel(s.start,s.duration); }).join(', ');
    html+='<div class="banner warn">This hold would cancel '+lateSessions.length+' session'+(lateSessions.length===1?'':'s')+' inside the 7-day notice window for its billing month: '+lateList+'. Choose how to handle '+(lateSessions.length===1?'it':'them')+':</div>';
    html+='<label style="display:flex;gap:8px;align-items:flex-start;font-weight:normal;margin-bottom:6px"><input type="radio" name="holdNoticeChoice" '+(f.grantMakeupCredits===false?'checked':'')+' onchange="setHoldMakeupChoice(false)" style="margin-top:3px"/> <span>Retrospective — enough notice was actually given (payments are being adjusted); no make-ups needed, just cancel as normal.</span></label>';
    html+='<label style="display:flex;gap:8px;align-items:flex-start;font-weight:normal;margin-bottom:6px"><input type="radio" name="holdNoticeChoice" '+(f.grantMakeupCredits===true?'checked':'')+' onchange="setHoldMakeupChoice(true)" style="margin-top:3px"/> <span>Not enough notice — issue a make-up credit for each affected session.</span></label>';
  }
  const holdConfirmDisabled = !student || (lateSessions.length>0 && f.grantMakeupCredits===null);
  html+='<div style="display:flex;gap:8px;margin-top:6px;justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeHoldForm()">Cancel</button>'
    +'<button class="btn primary" '+(holdConfirmDisabled?'disabled':'')+' onclick="saveHold()">Place on hold</button>'
  +'</div>';

  const holds=student? (student.holds||[]).slice().sort(function(a,b){ return toKey(b.start).localeCompare(toKey(a.start)); }) : [];
  if(holds.length>0){
    html+='<h3 style="margin-top:18px">Holds on file</h3><table><tr><th>Dates</th><th>Note</th><th></th></tr>'
      +holds.map(function(h){
        return '<tr><td>'+fmtShort(h.start)+'–'+fmtShort(h.end)+'</td><td class="small">'+(h.note||'—')+'</td>'
          +'<td><button class="btn sm ghost" onclick="removeHold(\''+student.id+'\',\''+h.id+'\')">Remove</button></td></tr>';
      }).join('')
      +'</table>';
  }
  html+='</div></div>';
  return html;
}

// podSetter is optional — only the new-student enrollment form passes one, to offer a Preferred
// Pod choice per session (Sept 2026, per Allie: "the preferred pods need to be set up per session,
// not overall"). Every other caller (editing an existing regular schedule, reactivating a student,
// a plan/time-change request) omits it and gets the plain day/time-only row it always has, since
// Preferred Pod is specifically an enrollment-time convenience — an existing student's Pod is
// changed via "Change Pod" instead, which already supports per-weekday pins.
//
// originals is also optional — the student's day/time BEFORE this edit, matched positionally to
// slots (Sept 2026, per Allie: "it needs to state his currently scheduled sessions... particularly
// necessary for students who might only need to move one session, not both" — with several rows on
// screen and no reminder of which was which, it was easy to lose track of which day was actually
// meant to change and which was supposed to stay put). Only the two callers editing an EXISTING
// student's schedule (renderRecurringModal, renderPlanChangeModal) pass this; enrollment has no
// "currently" to show. originals[idx] missing (the row is new, beyond what they already had) reads
// as "New session" rather than a currently-blank line.
function renderRecurringPickers(slots, starts, setter, podSetter, originals){
  let html='';
  slots.forEach(function(s, idx){
    if(originals){
      const orig=originals[idx];
      html+='<div class="small muted" style="margin-bottom:2px">'+(orig? 'Currently: '+orig.weekday+' '+minToLabel(orig.start) : 'New session')+'</div>';
    }
    html+='<div class="row2 recurring-row"><div><label>Day '+(idx+1)+'</label><select onchange="'+setter+'('+idx+',\'weekday\',this.value)">'
        +WEEKDAY_KEYS.map(function(d){ return '<option value="'+d+'"'+(d===s.weekday?' selected':'')+'>'+d+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>Time</label><select onchange="'+setter+'('+idx+',\'start\',this.value)">'
        +starts.map(function(t){ return '<option value="'+t+'"'+(t===s.start?' selected':'')+'>'+minToLabel(t)+'</option>'; }).join('')
      +'</select></div></div>';
    if(podSetter){
      html+='<div style="margin:-6px 0 12px"><label>Preferred Pod for this session</label><select onchange="'+podSetter+'('+idx+',\'preferredPodId\',this.value)"><option value=""'+(!s.preferredPodId?' selected':'')+'>No preference (auto-assign)</option>'
        +pods.map(function(p){ return '<option value="'+p.id+'"'+(p.id===s.preferredPodId?' selected':'')+'>'+p.name+'</option>'; }).join('')
      +'</select></div>';
    }
  });
  return html;
}

// Parent-facing schedule-change-request picker (Sept 2026, per Allie: "Only available session
// times will be shown") — unlike renderRecurringPickers (used by front desk, who need to see and
// set up any time regardless of current live capacity), this one filters the Time dropdown itself
// down to whatever standingSlotHasAvailability() currently says is open for that weekday. The
// slot's own already-picked time is always kept in the list even if it's since gone full, so
// changing the Day dropdown never silently strands the Time dropdown on a now-invalid value — the
// per-row "Full right now" + join-waitlist affordance below the picker (in
// renderTimeChangeRequestModal) covers that case instead.
// Each row states the change in plain "from X to Y" terms (Sept 2026, per Allie: "when booking a
// permanent change to schedule ... I want it to state the child's regular attendance so it says
// change from x day to y day") rather than leaving the parent to infer it from a bare day/time
// picker. currentSlots is the frozen snapshot (f.currentRecurring) paired 1:1 by index with the
// editable slots being picked here — see openTimeChangeRequestForm().
function renderTimeChangeRecurringPickers(slots, currentSlots, duration, year, onlyIdx){
  const allStarts=possibleStarts(duration);
  let html='';
  slots.forEach(function(s, idx){
    // onlyIdx used to restrict this to just the one slot picked from a "Select the day you wish to
    // cancel" dropdown, showing one New day/New time picker at a time even for a 2-slot child. Per
    // Allie (Sept 2026): "I need to be able to swap both sessions (if they do 2 sessions) in one
    // dialogue box as well" — every caller now passes null (or omits it) so every row shows its own
    // picker at once; the parameter stays around only in case a future caller ever wants the old
    // single-row behaviour back.
    if(onlyIdx!=null && idx!==onlyIdx) return;
    const openStarts=allStarts.filter(function(t){ return standingSlotHasAvailability(s.weekday, t, duration, year); });
    const starts = openStarts.indexOf(s.start)>=0 ? openStarts : openStarts.concat([s.start]).sort(function(a,b){ return a-b; });
    const current=currentSlots && currentSlots[idx];
    html+='<div class="recurring-row-group" style="margin-bottom:10px">';
    if(current) html+='<div class="small muted" style="margin-bottom:4px">Change <b>'+current.weekday+' '+minToLabel(current.start)+'</b> to:</div>';
    // No "current" to frame as a change (a brand-new pick with nothing on file yet, see
    // openTimeChangeRequestForm) — just label which session this is when there's more than one,
    // so a 2x/week family can tell the two blank rows apart.
    else if(slots.length>1) html+='<div class="small muted" style="margin-bottom:4px">Session '+(idx+1)+':</div>';
    html+='<div class="row2 recurring-row"><div><label>New day</label><select onchange="setTimeChangeRecurringSlot('+idx+',\'weekday\',this.value)">'
        +WEEKDAY_KEYS.map(function(d){ return '<option value="'+d+'"'+(d===s.weekday?' selected':'')+'>'+d+'</option>'; }).join('')
      +'</select></div>'
      +'<div><label>New time</label><select onchange="setTimeChangeRecurringSlot('+idx+',\'start\',this.value)">'
        +(starts.length? starts.map(function(t){ return '<option value="'+t+'"'+(t===s.start?' selected':'')+'>'+minToLabel(t)+(openStarts.indexOf(t)>=0?'':' (full)')+'</option>'; }).join('')
          : '<option value="'+s.start+'">No open times this day right now</option>')
      +'</select></div></div></div>';
  });
  return html;
}

function addGuardianLink(studentId, parentId){

function addNewGuardian(studentId){

// Make-up credits list, tidied up (Nov 2026, per Allie: "the makeup credits list is a little...
// messy. how can we make it easier to use?"). With ~150 live credits across ~80 children it had
// become one long row-per-credit table. Now:
//   - one row per child (count, minutes, next expiry) that opens to show that child's credits;
//   - a search box (child or parent name) that narrows all three credit sections at once;
//   - quick filters (All / Expiring soon / Manual / Automatic) with counts;
//   - sorted by soonest expiry by default (or date missed, or name);
//   - each credit keeps one main button (Book, or Re-book once booked) — the rest sit in a ⋯ menu;
//   - the long explanation is tucked behind "How credits work".
// Booked and Completed & expired keep their own sections, in the same grouped layout.
function creditView(){
  if(!state.creditView) state.creditView={q:'', filter:'all', sort:'expiry', open:{}};
  return state.creditView;
}
function setCreditQuery(v){ creditView().q=v; render(); }
function setCreditFilter(f){ creditView().filter=f; render(); }
function setCreditSort(s){ creditView().sort=s; render(); }
function toggleCreditKid(key){ const v=creditView(); v.open[key]=!v.open[key]; render(); }
// A ⋯ menu closes when you click anywhere else.
if(typeof document!=='undefined') document.addEventListener('click', function(e){

});
function creditSourceLabel(c){
  return c.source==='manual'? 'Manual'+(c.note? ' <span class="small muted">— '+escapeHtml(c.note)+'</span>' : '')
    : c.source==='excused-absence'? 'Excused absence'
    : c.source==='parent-cancel'? 'Parent cancel'
    : c.source==='closure'? 'Centre closure'
    : 'No-show';
}
// Does this credit's child (or one of the child's parents) match the search box?
function creditMatchesQuery(c, q){
  if(!q) return true;
  const s=findStudent(c.studentId);
  if(!s) return false;
  const names=[s.name];
  [s.parentId].concat(guardianLinksFor(s.id).map(function(g){ return g.parentId; })).forEach(function(pid){ const p=pid && findParent(pid); if(p) names.push(p.name); });
  return names.some(function(n){ return String(n||'').toLowerCase().indexOf(q)>=0; });
}
function creditPassesFilter(c, f){
  if(f==='soon') return creditDisplayStatus(c)==='soon';

  if(f==='auto') return c.source!=='manual';

// One credit's own row (inside its child's group). Main action stays a visible button; everything
// else goes in the ⋯ menu. Same rules as before for which actions each credit gets:
//  - Book: available and not part-used for +30 top-ups (a part-used one can only top up further).
//  - Re-book / ±30 min on the session: booked but not happened yet.
//  - Extend: anything not completed. Remove: anything not tied to a session (booked/completed).
function creditReportRowHtml(c){
  const st=creditDisplayStatus(c);
  const badge={available:'<span class="badge available">Available</span>',soon:'<span class="badge soon">Expiring soon</span>',expired:'<span class="badge expired">Expired</span>',booked:'<span class="badge booked">Booked</span>',completed:'<span class="badge completed">Completed</span>'}[st] || st;
  let detail='—';
  if(c.redeemedSessionId){
    const sess=findSession(c.redeemedSessionId);
    if(sess) detail=fmtShort(sess.date)+' '+rangeLabel(sess.start,sess.duration)+' · '+(findPod(sess.podId)?findPod(sess.podId).name+' · ':'')+(sess.instructorId && findInstructor(sess.instructorId)? findInstructor(sess.instructorId).name : '—');
  }
  const bookable = c.status==='available' && !creditPartlyUsed(c);
  const rebookable = st==='booked';
  const removable = !c.redeemedSessionId;
  let main='';
  if(bookable) main='<button class="btn sm primary" onclick="openBookingForCredit(\''+c.id+'\')">Book</button>';
  else if(rebookable) main='<button class="btn sm primary" onclick="rebookMakeUp(\''+c.id+'\')">Re-book</button>';
  const more=[];
  if(c.status==='available' && creditMinutesLeft(c)>=TOPUP_MIN) more.push('<button onclick="openTopUpPicker(\''+c.id+'\')">+30 min on a booked session</button>');
  if(rebookable){
    const s=findSession(c.redeemedSessionId);
    if(s && s.status==='scheduled'){
      if(s.extraMin) more.push('<button onclick="removeTopUp(\''+s.id+'\')">− 30 min (give back to credit)</button>');
      else if(topUpCreditFor(s.studentId, s.date)) more.push('<button onclick="addTopUp(\''+s.id+'\')">+30 min on this make-up</button>');
    }
  }
  if(st!=='completed') more.push('<button onclick="openExtendCredit(\''+c.id+'\')">Extend expiry date</button>');
  if(removable) more.push('<button class="danger" onclick="removeCredit(\''+c.id+'\')">Remove credit</button>');
  const menu = more.length? '<details class="row-menu"><summary title="More actions">⋯</summary><div class="row-menu-list">'+more.join('')+'</div></details>' : '';
  return '<tr><td>'+fmtShort(c.issuedDate)+'</td><td>'+fmtShort(c.expiryDate)+'</td><td>'+badge+(c.status==='available'? ' <span class="small muted">'+creditMinutesLeft(c)+' min'+(creditPartlyUsed(c)? ' left' : '')+'</span>' : '')+'</td><td class="small">'+creditSourceLabel(c)+'</td><td class="small">'+detail+'</td>'
    +'<td class="credit-actions">'+main+menu+'</td></tr>';

// Still actionable — available now, or expiring soon (both cases front desk might need to chase a
// family to actually use before it lapses).
function activeCredits(){
  return credits.filter(function(c){ const st=creditDisplayStatus(c); return st==='available' || st==='soon'; });
}
// Booked but still pending — a make-up session exists and hasn't happened yet (can still Re-book).
function bookedCredits(){
  return credits.filter(function(c){ return creditDisplayStatus(c)==='booked'; });
}
function settledCredits(){
  return credits.filter(function(c){ const st=creditDisplayStatus(c); return st!=='available' && st!=='soon' && st!=='booked'; });
}
function studentNameOf(id){ return (findStudent(id)||{}).name||''; }
// Groups credits by child and orders both the children and each child's credits.
//  sort 'expiry' — soonest expiry first; 'missed' — earliest missed session first (ties by name, as
//  before); 'name' — A–Z. `newestFirst` flips the date orders (used for the history section).
function groupCreditsByStudent(list, sort, newestFirst){
  const dir=newestFirst? -1 : 1;
  const keyOf = sort==='missed'? function(c){ return +c.issuedDate; } : function(c){ return +c.expiryDate; };
  const groups={}, order=[];
  list.forEach(function(c){ if(!groups[c.studentId]){ groups[c.studentId]={studentId:c.studentId, credits:[]}; order.push(c.studentId); } groups[c.studentId].credits.push(c); });
  const out=order.map(function(id){ const g=groups[id];
    g.credits.sort(function(a,b){ return dir*(keyOf(a)-keyOf(b)) || (a.issuedDate-b.issuedDate); });
    g.key=keyOf(g.credits[0]); g.name=studentNameOf(id); return g; });
  out.sort(function(a,b){
    if(sort!=='name'){ const d=dir*(a.key-b.key); if(d) return d; }
    return a.name.localeCompare(b.name);
  });
  return out;
}
// One section's grouped table. `section` keeps open/closed state separate per section.
function creditGroupsTableHtml(section, groups){
  const v=creditView();
  const autoOpen = !!v.q.trim() && groups.length<=3;
  let html='<table class="credit-groups"><tr><th>Student</th><th>Credits</th><th>Next expiry</th><th></th></tr>';
  groups.forEach(function(g){
    const student=findStudent(g.studentId)||{name:'(unknown student)'};
    const k=section+':'+g.studentId;
    const open = autoOpen || !!v.open[k];
    const live=g.credits.filter(function(c){ const st=creditDisplayStatus(c); return st==='available' || st==='soon'; });
    const mins=live.reduce(function(t,c){ return t+creditMinutesLeft(c); }, 0);
    const soonN=g.credits.filter(function(c){ return creditDisplayStatus(c)==='soon'; }).length;
    const next=live.length? live.reduce(function(m,c){ return c.expiryDate<m? c.expiryDate : m; }, live[0].expiryDate) : null;
    const summary=g.credits.length+' credit'+(g.credits.length===1?'':'s')+(live.length? ' · '+mins+' min' : '');
    // Book from the child's row = their soonest-expiring bookable credit.
    const firstBookable=live.slice().sort(function(a,b){ return a.expiryDate-b.expiryDate; }).find(function(c){ return c.status==='available' && !creditPartlyUsed(c); });
    html+='<tr class="credit-kid'+(open?' open':'')+'" onclick="if(!event.target.closest(\'button,details\')) toggleCreditKid(\''+k+'\')">'
      +'<td><span class="chev">'+(open?'▾':'▸')+'</span> <b>'+escapeHtml(student.name)+'</b>'+(student.id && isStudentInactive(student)? ' <span class="badge stopping">Finished '+fmtShort(student.stoppedFrom)+'</span>' : '')+'</td>'
      +'<td>'+summary+(soonN? ' <span class="badge soon">'+soonN+' expiring soon</span>' : '')+'</td>'
      +'<td>'+(next? fmtShort(next) : '—')+'</td>'
      +'<td class="credit-actions">'+(section==='active' && firstBookable? '<button class="btn sm primary" onclick="openBookingForCredit(\''+firstBookable.id+'\')" title="Books their soonest-expiring credit">Book</button>' : '')+'</td></tr>';
    if(open){
      html+='<tr class="credit-kid-detail"><td colspan="4"><table><tr><th>Missed session</th><th>Expires</th><th>Status</th><th>Source</th><th>Details</th><th></th></tr>';
      g.credits.forEach(function(c){ html+=creditReportRowHtml(c); });
      html+='</table></td></tr>';
    }
  });
  html+='</table>';
  return html;
}

// Booked credits — a make-up session is on the calendar but hasn't happened yet. Same grouped

/* ---------- INSTRUCTOR ---------- */
// The instructor-facing view of their rostered shifts deliberately doesn't mention Pods at all —
// that's an internal front-desk scheduling detail. To an instructor this is just "when am I
// working," derived from whatever blocks front desk has assigned them to, across any Pod.
function instructorRosteredShifts(instructorId){
  const now=simNow();
  const out=[];
  pods.forEach(function(pod){
    WEEKDAY_KEYS.forEach(function(day){
      podBlocksForDay(pod.id, day).forEach(function(b){
        if(blockInstructorOn(b, now)===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:false, podId:pod.id, blockId:b.id});
        }
        const future=b.assignments.filter(function(a){ return toKey(a.effectiveFrom)>toKey(now); })
          .sort(function(a,c){ return toKey(a.effectiveFrom).localeCompare(toKey(c.effectiveFrom)); })[0];
        if(future && future.instructorId===instructorId){
          out.push({day, start:b.start, end:b.end, upcoming:true, from:future.effectiveFrom, podId:pod.id, blockId:b.id});
        }
      });
    });
  });
  return out;
}

// Every one-off cover shift this instructor is currently assigned to, today or any date still to
// come — a proactive reminder of a confirmed one-time commitment, rather than something that only
// shows up (blended silently into "Rostered shifts", indistinguishable from their regular pattern)
// on the day it actually happens (Sept 2026, per Allie: "when i assign an instructor to cover
// another instructor, i need the one-off shift to come up on the instructors page so they're
// reminded of whats coming"). Same oneOffCoverage mechanism blockInstructorOn() already resolves
// from, just listed out directly here instead of collapsed into a single "who's on today" answer.
//
// Oct 2026, per Allie ("fix the instructor pages too"): also covers one-off day overrides made from
// the Today tab's Schedule grid (podDayOverrides), which this used to ignore entirely. Each entry has
// a `kind`: 'cover' — an extra one-off shift (either mechanism); 'changed' — their own regular shift
// that day, with different times; 'off' — their regular shift that day has been given to someone
// else / left unassigned, so they're not needed. A block-level swap on a date that also has a day
// override is skipped, since the override replaces that Pod's whole day (see podCoverageDetail).
function instructorUpcomingCoverShifts(instructorId){
  const todayKey=toKey(simNow());
  const out=[];
  pods.forEach(function(pod){
    WEEKDAY_KEYS.forEach(function(day){
      podBlocksForDay(pod.id, day).forEach(function(b){
        (b.oneOffCoverage||[]).forEach(function(o){
          if(o.instructorId===instructorId && toKey(o.date)>=todayKey && !dayOverrideFor(pod.id, toKey(o.date))){
            out.push({date:o.date, day, start:b.start, end:b.end, podId:pod.id, kind:'cover'});
          }
        });
      });
    });
  });
  podDayOverrides.forEach(function(ov){
    const dk=toKey(ov.date);
    if(dk<todayKey) return;
    const date=new Date(dk);
    const day=WEEKDAY_KEYS[(date.getDay()+6)%7];
    // Their regular shift(s) in this Pod that day, as they'd have been without the override.
    const mine=podBlocksForDay(ov.podId, day).filter(function(b){ return blockInstructorOn(b, date)===instructorId; });
    if(ov.instructorId===instructorId){
      const same = mine.length && mine[0].start===ov.start && mine[mine.length-1].end===ov.end;
      if(!same) out.push({date:date, day, start:ov.start, end:ov.end, podId:ov.podId, kind: mine.length? 'changed' : 'cover'});
    } else if(mine.length){
      out.push({date:date, day, start:mine[0].start, end:mine[mine.length-1].end, podId:ov.podId, kind:'off'});
    }
  });
  return out.sort(function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; });
}

// The instructor's actual shifts, date by date, for the next two weeks (Oct 2026, per Allie: "Rostered
// shifts which lists their upcoming shifts for the next 2 weeks, a section for one-off shifts so
// shifts they've picked up that are usually someone else's"). Split into:
//   regular — their own usual shifts (status 'on', 'changed' = different times that day, 'off' =
//             not needed that day, 'covered' = someone else is covering it);
//   oneOff  — shifts they've picked up that are normally someone else's (or an extra one-off day).
// Same sources as everywhere else: day overrides, one-off coverage swaps, summer hours, closures.
var INSTRUCTOR_SHIFT_DAYS=14;
function instructorShiftsAhead(instructorId){
  const regular=[], oneOff=[];
  const today=simNow();
  for(let i=0;i<INSTRUCTOR_SHIFT_DAYS;i++){
    const date=addDays(new Date(toKey(today)), i);
    const dk=toKey(date), weekday=WEEKDAY_KEYS[(date.getDay()+6)%7];
    if(isClosedDate(date)) continue;
    const tb=termBreakOn(date);
    pods.forEach(function(pod){
      if(tb){
        if(termBreakCoverageFor(tb, pod.id, weekday)===instructorId) regular.push({date, start:tb.morningStart, end:tb.morningEnd, podId:pod.id, status:'on', note:tb.label||'Summer hours'});
        return;
      }
      const blocks=podBlocksForDay(pod.id, weekday);
      const ov=dayOverrideFor(pod.id, dk);
      if(ov){
        const mine=blocks.filter(function(b){ return blockInstructorOngoing(b, date)===instructorId; });
        if(ov.instructorId===instructorId){
          if(mine.length){
            const same=mine[0].start===ov.start && mine[mine.length-1].end===ov.end;
            regular.push({date, start:ov.start, end:ov.end, podId:pod.id, status: same? 'on' : 'changed', blockId:mine[0].id, weekday});
          } else {
            oneOff.push({date, start:ov.start, end:ov.end, podId:pod.id});
          }
        } else if(mine.length){
          regular.push({date, start:mine[0].start, end:mine[mine.length-1].end, podId:pod.id, status:'off'});
        }
        return;
      }
      blocks.forEach(function(b){
        const usual=blockInstructorOngoing(b, date), actual=blockInstructorOn(b, date);
        if(usual===instructorId && actual===instructorId) regular.push({date, start:b.start, end:b.end, podId:pod.id, status:'on', blockId:b.id, weekday});
        else if(usual===instructorId) regular.push({date, start:b.start, end:b.end, podId:pod.id, status:'covered', coveredBy:actual});
        else if(actual===instructorId) oneOff.push({date, start:b.start, end:b.end, podId:pod.id, usualInstructorId:usual});
      });
    });
  }
  const byTime=function(a,b){ return toKey(a.date).localeCompare(toKey(b.date)) || a.start-b.start; };
  return {regular:regular.sort(byTime), oneOff:oneOff.sort(byTime)};
}
function setInstructorTab(tab){ state.instructorTab=tab; render(); }

// Which Pods this instructor actually covers TODAY (per each block's dated assignment history),
// and which students are checked in at any of those Pods right now — used for the instructor's
// own "My Pod today" roster, so they only ever see students physically at their Pod, and only once
// checked in (not the full day's bookings).
function instructorPodIdsToday(instructorId){
  const today=simNow();
  // podShiftsOn (Oct 2026) — a one-off day change from the Today tab's Schedule grid counts too, both
  // ways: putting them on a Pod for today, or taking them off one.
  // A floor move today (Oct 2026) decides instead, either way: a Pod moved to them counts, a Pod of
  // theirs moved to someone else doesn't. Their shifts themselves are unchanged.
  const todayKey=toKey(today);
  return pods.filter(function(p){
    const fl=floorAssignmentFor(p.id, todayKey);
    if(fl) return fl.instructorId===instructorId;
    return podShiftsOn(p.id, today).some(function(s){ return s.instructorId===instructorId; });
  }).map(function(p){ return p.id; });
}
// Includes both flavours of "checked in with me today": physically seated at one of my Pods, and
// checked in to my own Online group — an instructor is on the hook for both at once, so both show
// up together on their one "My Pod today" panel. Excludes anyone already checked out (Sept 2026,
// once instructors could check students out themselves, this list had to drop them immediately —
// same live-vs-historical rule checkedInTodayStillPresent()/checkedInNamesByPod() already use —
// otherwise a checked-out student would sit on the instructor's own roster, offering a Check out
// button, for the rest of the day).
function checkedInAtInstructorPodToday(instructorId){
  const todayKey=toKey(simNow());
  const myPodIds=instructorPodIdsToday(instructorId);
  // Ordered by exit time, soonest-leaving first (Sept 2026, per Allie: "can the students be shown
  // ordered by exit time, not alphabetical") — same convention the front desk's own live board
  // already uses (see sortEntries() in liveOccupancyGroups()), so an instructor sees who's about to
  // need checking out right at the top of their own list, rather than everyone in whatever order
  // they happened to check in.
  return sessions.filter(function(s){
    if(s.status!=='attended' || toKey(s.date)!==todayKey || s.checkedOut) return false;
    if(s.online) return s.instructorId===instructorId;
    return myPodIds.indexOf(s.podId)>-1;
  }).sort(function(a,b){
    const ea = a.actualEnd!=null? a.actualEnd : a.start+a.duration;
    const eb = b.actualEnd!=null? b.actualEnd : b.start+b.duration;
    return ea-eb;
  });
}

/* ---------- shift coverage requests ---------- */
// An instructor flags one dated occurrence of their own shift as needing coverage (e.g. they're
// sick), front desk sees it and picks a qualified, available replacement for just that date — the
// swap lands in the block's oneOffCoverage list (blockInstructorOn resolves it automatically
// everywhere else: booking, coverage summaries, capacity checks), leaving the instructor's regular
// dated assignment (5.2/5.3) untouched for every other day.
function openCoverageRequestForm(instructorId, podId, weekday, blockId, dateKey){
  const today=simNow();
  let d=new Date(today);
  while(WEEKDAY_KEYS[(d.getDay()+6)%7]!==weekday){ d=addDays(d,1); }
  state.coverageRequestForm={instructorId, podId, weekday, blockId, date:dateKey||toKey(d), note:'', error:''};
  render();
}
function closeCoverageRequestForm(){ state.coverageRequestForm=null; render(); }
function setCoverageRequestField(field, value){
  state.coverageRequestForm[field]=value;
  state.coverageRequestForm.error='';
  render();
}
function submitCoverageRequest(){
  const f=state.coverageRequestForm;
  const d=new Date(f.date);
  if(!f.date || toKey(d)<toKey(simNow())){ f.error='Pick today or a future date.'; render(); return; }
  if(WEEKDAY_KEYS[(d.getDay()+6)%7]!==f.weekday){ f.error='That date isn\'t a '+f.weekday+'.'; render(); return; }
  const dup=coverageRequests.find(function(r){ return r.blockId===f.blockId && toKey(r.date)===f.date && r.status==='open'; });
  if(dup){ f.error='There\'s already an open coverage request for that date.'; render(); return; }
  const block=podBlocksForDay(f.podId, f.weekday).find(function(b){ return b.id===f.blockId; });
  // Every qualified, actually-free instructor gets an email the moment the request goes in — a
  // parallel heads-up alongside front desk's own "needs coverage" queue, not a replacement for
  // front desk making the actual assignment (fillCoverageRequest). This is a point-in-time
  // snapshot of who's free right now; it doesn't re-fire later if availability changes.
  const notify=block? availableSubsForCoverage(f.podId, f.weekday, block, d, f.instructorId) : [];
  // If literally nobody qualifies and is free right now, that's already the "nobody can cover this
  // shift" case (5.14) — alert the manager immediately rather than waiting for front desk to notice
  // the request sitting open, or to click "mark unstaffed" themselves days later.
  const managerNotified = notify.length===0;
  const notifiedIds = notify.map(function(i){ return i.id; });
  const req={id:newId()||('cov'+(nextCoverageId++)), podId:f.podId, weekday:f.weekday, blockId:f.blockId, date:d, requestedBy:f.instructorId, note:f.note, status:'open', filledBy:null, notifiedInstructorIds:notifiedIds, managerNotified};
  coverageRequests.push(req);
  dbWrite('submitting coverage request', function(){ return supabaseClient.from('coverage_requests').insert({
    id:req.id, pod_id:req.podId, block_id:req.blockId, weekday:req.weekday, the_date:toKey(req.date),
    requested_by:req.requestedBy, note:req.note, status:'open', filled_by:null, manager_notified:managerNotified
  }).then(function(r){
    if(r.error || !notifiedIds.length) return r;
    return supabaseClient.from('coverage_request_notified_instructors').insert(notifiedIds.map(function(iid){
      return {coverage_request_id:req.id, instructor_id:iid};
    }));
  }); });
  const notifyMsg = notify.length
    ? ' Emailed '+notify.length+' available instructor'+(notify.length===1?'':'s')+' ('+notify.map(function(i){ return i.name; }).join(', ')+').'
    : ' Nobody is currently available — emailed '+MANAGER_EMAIL+' so it doesn\'t sit unnoticed.';
  toast(f.staffMode
    ? 'Marked as needing cover: '+findPod(f.podId).name+' on '+fmtShort(d)+' ('+findInstructor(f.instructorId).name+'\'s shift).'+notifyMsg
    : 'Coverage requested for '+fmtShort(d)+' — front desk will pick it up.'+notifyMsg);
  state.coverageRequestForm=null;
  render();
}
function cancelCoverageRequest(id){
  const r=coverageRequests.find(function(x){ return x.id===id; });
  if(r) r.status='cancelled';
  dbWrite('cancelling coverage request', function(){ return supabaseClient.from('coverage_requests').update({status:'cancelled'}).eq('id', id); });
  // Anyone who offered to cover hears it's no longer needed (Oct 2026). The requesting instructor
  // can't update (or even see) other instructors' offers, so the Edge Function does it server-side.
  pendingCoverOffers(id).forEach(function(o){ o.status='cancelled'; });
  if(supabaseClient && currentUser) supabaseClient.functions.invoke('send-cover-offer-email', {body:{cancelRequestId:id}});
  render();
}
// Qualified (5.3) instructors who are also actually free that exact date — not already covering a
// different Pod at an overlapping time, whether via their regular assignment or another swap.
function availableSubsForCoverage(podId, weekday, block, date, excludeInstructorId){
  const qualifying=qualifyingInstructorsForBlock(weekday, block, date).filter(function(i){ return i.id!==excludeInstructorId; });
  return qualifying.filter(function(instr){
    for(const otherPodId in podSchedule){
      const clash=podBlocksForDay(otherPodId, weekday).some(function(ob){
        if(otherPodId===podId && ob.id===block.id) return false;
        return ob.start<block.end && block.start<ob.end && blockInstructorOn(ob, date)===instr.id;
      });
      if(clash) return false;
    }
    return true;
  });
}
// Every currently open coverage request, system-wide (5.19) — not just the ones this instructor
// personally raised. Tagged and sorted so shifts overlapping their own declared weekly availability
// (instructorCurrentWeeklyPattern) surface first — the ones they could plausibly help with — then
// everything else, oldest date first within each group. Visibility only: front desk still makes the
// actual assignment (5.9/5.10); an instructor can't claim one from here.
function openCoverageRequestsSortedForInstructor(instructorId){
  const open=coverageRequests.filter(function(r){ return r.status==='open'; });
  const pattern=instructorCurrentWeeklyPattern(instructorId);
  const tagged=open.map(function(r){
    const block=podBlocksForDay(r.podId, r.weekday).find(function(b){ return b.id===r.blockId; });
    const a=pattern[r.weekday];
    const withinOwnAvailability = !!(block && a && block.start>=a.start && block.end<=a.end);
    return {request:r, withinOwnAvailability:withinOwnAvailability};
  });
  tagged.sort(function(x,y){
    if(x.withinOwnAvailability!==y.withinOwnAvailability) return x.withinOwnAvailability? -1 : 1;
    return new Date(x.request.date)-new Date(y.request.date);
  });
  return tagged;
}
// Re-resolves instructor coverage for every session ALREADY sitting in this Pod on this exact date
// — not just future/still-unassigned ones — whenever a one-off coverage swap changes who's actually
// covering (Sept 2026, root cause of "an instructor covering someone else's shift can't check a
// student out — after they do, the student goes back to the list", reported after a shift-coverage
// swap). generateRecurringSessions()'s own self-heal (see the "previously-unassigned occurrence"
// comment above it) only ever re-resolves a session that had NO instructor at all — a session that
// was already staffed by the ORIGINAL instructor keeps their id untouched, which is correct for
// every other kind of change, but wrong here: a one-off coverage swap is specifically the one case
// where WHO covers an already-assigned session needs to change too. Left as-is, the covering
// instructor could still see the student (coverage lookups like instructorPodIdsToday resolve the
// swap live), but any write they made to that session — check-out, check-in, no-show — was silently
// rejected: instructor_update_own_sessions' RLS only lets an instructor touch a row that already
// lists them as instructor_id/instructor_id_2, and an UPDATE whose RLS condition matches zero rows
// doesn't error, it just quietly succeeds having touched nothing — so the local "checked out" flag
// got overwritten back to false the moment data next reloaded, with no error ever shown.
function reassignSessionsForCoverageChange(podId, weekday, dateKey){
  const date=new Date(dateKey);
  sessionsOnDate(dateKey).filter(function(s){ return s.podId===podId && !s.online && s.status!=='cancelled'; })
    .forEach(function(s){
      const cov=sessionMinderFor(podId, weekday, s.start, s.duration, date); // a floor move wins (Oct 2026)
      if(cov.primaryInstructorId===s.instructorId && (cov.secondaryInstructorId||null)===(s.instructorId2||null) && (cov.handoffAt||null)===(s.handoff||null)) return; // nothing actually changed for this session
      s.instructorId=cov.primaryInstructorId; s.instructorId2=cov.secondaryInstructorId; s.handoff=cov.handoffAt;
      dbWrite('updating coverage on an already-scheduled session', function(){ return supabaseClient.from('sessions').update({
        instructor_id:s.instructorId, instructor_id_2:s.instructorId2, handoff_min:s.handoff
      }).eq('id', s.id); });
    });
}
function fillCoverageRequest(requestId, instructorId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId});
  req.status='filled';
  req.filledBy=instructorId;
  dbWrite('filling coverage request', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:instructorId}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:instructorId});
    });
  });
  reassignSessionsForCoverageChange(req.podId, req.weekday, dateKey);
  regenerateAllRecurring();
  settleCoverOffers(requestId, instructorId, 'declined'); // anyone who offered hears the outcome (Oct 2026)
  toast(findInstructor(instructorId).name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+'.');
  render();
}
// Lets front desk record a coverage arrangement made face-to-face in the centre — any instructor,
// not just the qualification-and-availability shortlist fillCoverageRequest() is normally called
// from. Front desk is trusted to have actually confirmed the arrangement; this just records it.
function assignCoverageManually(requestId, instructorId){
  if(!instructorId){ toast('Choose an instructor first.'); return; }
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  if(!req || req.status!=='open') return;
  const instr=findInstructor(instructorId);
  fillCoverageRequest(requestId, instructorId);
  toast(instr.name+' is covering '+findPod(req.podId).name+'’s '+req.weekday+' shift on '+fmtShort(req.date)+' (arranged directly).');
}
function markCoverageUncovered(requestId){
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  const dateKey=toKey(req.date);
  block.oneOffCoverage=(block.oneOffCoverage||[]).filter(function(o){ return toKey(o.date)!==dateKey; });
  block.oneOffCoverage.push({date:new Date(req.date), instructorId:null});
  req.status='filled';
  req.filledBy=null;
  // The manager is only emailed once per request — usually this already happened the moment it was
  // raised (submitCoverageRequest, when the shortlist came back empty). Cover the rarer case where
  // it wasn't: someone was available at request time but never actually took it, so front desk is
  // the one confirming, right now, that nobody can cover it.
  const alreadyNotified=!!req.managerNotified;
  req.managerNotified=true;
  dbWrite('marking shift unstaffed', function(){
    return supabaseClient.from('coverage_requests').update({status:'filled', filled_by:null, manager_notified:true}).eq('id', requestId).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').delete().eq('block_id', block.id).eq('the_date', dateKey);
    }).then(function(){
      return supabaseClient.from('pod_shift_one_off_coverage').insert({block_id:block.id, the_date:dateKey, instructor_id:null});
    });
  });
  reassignSessionsForCoverageChange(req.podId, req.weekday, dateKey);
  regenerateAllRecurring();
  settleCoverOffers(requestId, null, 'declined');
  toast(findPod(req.podId).name+' is marked unstaffed for '+fmtShort(req.date)+' — no replacement found.'+(alreadyNotified? '' : ' Emailed '+MANAGER_EMAIL+'.'));
  render();
}

/* ---------- instructors offering to cover (Oct 2026) ---------- */
// Per Allie: "give my instructors the ability to cover a shift even if outside of their hours, so
// they submit a request to cover it, multiple can do this, and I can accept or decline the cover
// request" — "they get an email whether I accepted or declined". Any instructor (other than the one
// who asked for cover) can offer on any open coverage request; front desk sees the offers on that
// request and accepts one (fillCoverageRequest — which also declines everyone else) or declines one.
// Every decided offer is emailed its outcome by the send-cover-offer-email Edge Function.
// coverage_offers table: add_coverage_offers.sql.
function myCoverOffer(requestId, instructorId){
  return coverageOffers.find(function(o){ return o.requestId===requestId && o.instructorId===instructorId; }) || null;
}
function pendingCoverOffers(requestId){
  return coverageOffers.filter(function(o){ return o.requestId===requestId && o.status==='pending'; })
    .sort(function(a,b){ return a.createdAt-b.createdAt; });
}
// Already rostered (or covering) another Pod at an overlapping time on that date? Shown as a heads-up
// only — front desk decides.
function coverOfferClash(req, instructorId){
  const block=podBlocksForDay(req.podId, req.weekday).find(function(b){ return b.id===req.blockId; });
  if(!block) return null;
  for(const otherPodId in podSchedule){
    if(otherPodId===req.podId) continue;
    const hit=podShiftsOn(otherPodId, req.date).find(function(s){ return s.instructorId===instructorId && s.start<block.end && block.start<s.end; });
    if(hit) return findPod(otherPodId).name+' '+rangeLabel(hit.start, hit.end-hit.start);
  }
  return null;
}
function emailCoverOffers(offerIds){
  if(!offerIds.length || !supabaseClient || !currentUser) return;
  supabaseClient.functions.invoke('send-cover-offer-email', {body:{offerIds:offerIds}}).then(function(r){
    const err=(r.error && (r.error.message||String(r.error))) || (r.data && r.data.error);
    if(err) toast('The offer was saved, but the email to the instructor didn\'t send — '+err, 8000);
  });
}
function offerToCover(requestId){
  const instrId = supabaseClient? (currentUser && currentUser.instructorId) : state.instructorLoggedIn;
  const req=coverageRequests.find(function(r){ return r.id===requestId; });
  if(!instrId || !req || req.status!=='open') return;
  const clash=coverOfferClash(req, instrId);
  if(!confirm('Offer to cover '+findPod(req.podId).name+' on '+fmtShort(req.date)+'?'+(clash? '\n\nHeads up: you\'re already on '+clash+' that day.' : '')+'\n\nFront desk will accept or decline, and you\'ll get an email either way.')) return;
  const existing=myCoverOffer(requestId, instrId);
  if(existing){
    existing.status='pending'; existing.createdAt=new Date();
    dbWrite('re-offering to cover', function(){ return supabaseClient.from('coverage_offers').update({status:'pending'}).eq('id', existing.id); });
  } else {
    const o={id:newId()||('off'+Date.now()), requestId, instructorId:instrId, status:'pending', createdAt:new Date()};
    coverageOffers.push(o);
    dbWrite('offering to cover a shift', function(){ return supabaseClient.from('coverage_offers').insert({id:o.id, request_id:requestId, instructor_id:instrId, status:'pending'}); });
  }
  toast('Offer sent — front desk will let you know by email.');
  render();
}
function withdrawCoverOffer(offerId){
  const o=coverageOffers.find(function(x){ return x.id===offerId; });
  if(!o || o.status!=='pending') return;
  o.status='withdrawn';
  dbWrite('withdrawing a cover offer', function(){ return supabaseClient.from('coverage_offers').update({status:'withdrawn'}).eq('id', offerId); });
  toast('Offer withdrawn.');
  render();
}
// Records the outcome on every still-pending offer for a request and emails them. acceptedInstrId:
// whoever got the shift (their own offer becomes "accepted"); everyone else becomes `othersStatus`.
function settleCoverOffers(requestId, acceptedInstrId, othersStatus){
  const changed=[];
  coverageOffers.forEach(function(o){
    if(o.requestId!==requestId || o.status!=='pending') return;
    o.status = (acceptedInstrId && o.instructorId===acceptedInstrId)? 'accepted' : othersStatus;
    changed.push(o);
  });
  if(!changed.length) return;
  dbWrite('recording cover offer outcomes', function(){
    return Promise.all(changed.map(function(o){ return supabaseClient.from('coverage_offers').update({status:o.status, decided_at:new Date().toISOString()}).eq('id', o.id); }))
      .then(function(rs){ const bad=rs.find(function(r){ return r.error; }); if(!bad) emailCoverOffers(changed.map(function(o){ return o.id; })); return bad||{error:null}; });
  });
}
function acceptCoverOffer(offerId){
  const o=coverageOffers.find(function(x){ return x.id===offerId; });
  if(!o || o.status!=='pending') return;
  const req=coverageRequests.find(function(r){ return r.id===o.requestId; });
  const others=pendingCoverOffers(o.requestId).length-1;
  if(!confirm(findInstructor(o.instructorId).name+' covers '+findPod(req.podId).name+' on '+fmtShort(req.date)+'?\n\nThey\'ll get a confirmation email'+(others>0? ', and the '+others+' other'+(others===1?'':'s')+' who offered will be told it\'s sorted.' : '.'))) return;
  fillCoverageRequest(o.requestId, o.instructorId); // also settles every offer on this request
}
function declineCoverOffer(offerId){
  const o=coverageOffers.find(function(x){ return x.id===offerId; });
  if(!o || o.status!=='pending') return;
  if(!confirm('Decline '+findInstructor(o.instructorId).name+'\'s offer? They\'ll get an email letting them know.')) return;
  o.status='declined';
  dbWrite('declining a cover offer', function(){ return supabaseClient.from('coverage_offers').update({status:'declined', decided_at:new Date().toISOString()}).eq('id', o.id)
    .then(function(r){ if(!r.error) emailCoverOffers([o.id]); return r; }); });
  toast('Offer declined — '+findInstructor(o.instructorId).name+' will get an email.');
  render();
}

/* ---------- instructor shifts calendar (Oct 2026) ---------- */
// Per Allie: "the instructors want to know if we can create a calendar sync function for them" —
// "just one way, so that their shifts appear on their calendar (and disappear when cancelled)".
// Each instructor gets a private subscription link to the instructor-calendar Edge Function
// (instructor-calendar.ts), which rebuilds their shifts from the live roster on every fetch. The
// link's token lives in instructor_calendar_links (add_instructor_calendar_sync.sql), readable only
// by that instructor and staff. Loaded lazily the first time the card renders, not in loadAllData().
function calendarFeedUrl(token){ return SUPABASE_URL+'/functions/v1/instructor-calendar?token='+token; }
function randomFeedToken(){
  const bytes=new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function loadCalendarLink(instructorId){
  state.calendarLink={loading:true};
  supabaseClient.from('instructor_calendar_links').select('feed_token').eq('instructor_id', instructorId).maybeSingle().then(function(r){
    state.calendarLink = r.error? {error:r.error.message} : (r.data? {token:r.data.feed_token} : {none:true});
    renderUnlessEditing();
  });
}
function createCalendarLink(instructorId){
  state.calendarLink={loading:true}; render();
  supabaseClient.from('instructor_calendar_links').insert({instructor_id:instructorId, feed_token:randomFeedToken()}).select('feed_token').single().then(function(r){
    state.calendarLink = r.error? {error:r.error.message} : {token:r.data.feed_token};
    render();
  });
}
function resetCalendarLink(instructorId){
  if(!confirm('Reset your calendar link?\n\nYour current link stops working straight away, so you\'ll need to remove the old calendar from your phone/computer and add the new link instead. Only do this if your link has been shared with someone it shouldn\'t have.')) return;
  const token=randomFeedToken();
  state.calendarLink={loading:true}; render();
  supabaseClient.from('instructor_calendar_links').update({feed_token:token, updated_at:new Date().toISOString()}).eq('instructor_id', instructorId).then(function(r){
    state.calendarLink = r.error? {error:r.error.message} : {token:token};
    if(!r.error) toast('New calendar link created — the old one no longer works.');
    render();
  });
}
function copyCalendarLink(){
  const url=calendarFeedUrl(state.calendarLink.token);
  (navigator.clipboard? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ toast('Calendar link copied.'); })
    .catch(function(){ prompt('Copy your calendar link:', url); });
}
function renderCalendarSyncCard(instr){
  let html='<div class="card"><h2>Add my shifts to my calendar</h2>'
    +'<p>Subscribe once and your shifts show up in your own calendar app — including extra and changed shifts. If a shift is cancelled or given to someone else, it disappears by itself.</p>';
  if(!supabaseClient){ return html+'<div class="empty-note">Available in the live app only.</div></div>'; }
  const c=state.calendarLink;
  if(!c){ loadCalendarLink(instr.id); return html+'<div class="empty-note">Loading…</div></div>'; }
  if(c.loading) return html+'<div class="empty-note">Loading…</div></div>';
  if(c.error) return html+'<div class="banner danger">Couldn\'t load your calendar link: '+c.error+'</div><button class="btn sm" onclick="loadCalendarLink(\''+instr.id+'\')">Try again</button></div>';
  if(c.none) return html+'<button class="btn primary" onclick="createCalendarLink(\''+instr.id+'\')">Get my calendar link</button></div>';
  const url=calendarFeedUrl(c.token);

  html+='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'
      +'<input type="text" readonly value="'+url+'" onclick="this.select()" style="flex:1;min-width:220px;font-size:.8rem"/>'
      +'<button class="btn sm primary" onclick="copyCalendarLink()">Copy link</button>'
      +'<a class="btn sm" href="'+webcal+'">Subscribe on iPhone / Mac</a>'
    +'</div>'
    +'<p class="small"><b>iPhone / Mac:</b> tap "Subscribe on iPhone / Mac" above, then Subscribe.<br>'
    +'<b>Google Calendar:</b> on a computer, open calendar.google.com → next to "Other calendars" click <b>+</b> → <b>From URL</b> → paste the link → Add calendar. It then shows on your phone too.<br>'
    +'<b>Outlook:</b> Add calendar → <b>Subscribe from web</b> → paste the link.</p>'
    +'<p class="small muted">Your calendar app checks for changes on its own schedule — usually within an hour on iPhone and Outlook, but Google can take several hours. Front desk will still let you know about same-day changes. Keep this link to yourself: anyone with it can see your shifts.</p>'
    +'<button class="btn sm ghost" onclick="resetCalendarLink(\''+instr.id+'\')">Reset link</button>';
  return html+'</div>';
}

function renderInstructor(){
